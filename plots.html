<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b8c5b0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141614" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>Yusuf's Plots</title>
<script>
  if (location.protocol === "http:" && location.hostname !== "localhost") location.replace("https:" + location.href.slice(5));
</script>
<style>
  :root {
    --bg: #b8c5b0; --panel: #ffffff; --ink: #17281a; --muted: #5b7360; --line: #c0d8c6;
    --accent-soft: #e0f0e4; --wall: #17281a; --seam: rgba(23, 40, 26, .16); --bad: #c0392b;
    --cell-filter: none;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141614; --panel: #1d201e; --ink: #e9ece8; --muted: #8b918c; --line: #2a2e2b;
      --accent-soft: #222a23; --wall: #0b0c0b; --seam: rgba(0, 0, 0, .22); --bad: #ff6b5b;
      --cell-filter: saturate(.85) brightness(.86);
    }
  }
  @font-face { font-family: "EB Garamond"; src: url("malik.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); min-height: 100dvh;
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  button { font: inherit; color: inherit; touch-action: manipulation; }
  [hidden] { display: none !important; }

  /* ---- The site's bar, as on Bot and Notes ---- */
  .top { display: flex; align-items: center; gap: 12px; padding: 10px clamp(12px, 1.4vw, 24px); min-height: 49px;
         padding-top: max(10px, env(safe-area-inset-top));
         border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 20; }
  .brand { font-weight: 640; letter-spacing: -.01em; white-space: nowrap; color: var(--ink); text-decoration: none; }
  .mark { position: absolute; left: 50%; top: 50%; translate: -50% -50%; display: grid; grid-template-columns: 1fr auto 1fr;
          align-items: center; white-space: nowrap; font-family: "EB Garamond", Garamond, "Hoefler Text", serif; z-index: 2; }
  .mside { display: flex; align-items: center; gap: 2px; }
  .mside.l { justify-self: end; }
  .mside.r { justify-self: start; }
  .mword { font: inherit; background: none; border: none; display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 10px;
           border-radius: 8px; color: var(--ink); cursor: pointer; }
  .mword:hover { background: var(--accent-soft); }
  .mname { font-size: 19px; letter-spacing: .044em; line-height: 1; display: inline-block; transform: scaleX(.8); margin: 0 -6px; }
  .marticle, .mnoun { font: 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--muted);
    display: inline-block; overflow: hidden; max-width: 64px; transition: max-width .3s cubic-bezier(.2,.7,.3,1), opacity .2s, margin .3s; }
  .mark.open .marticle, .mark.open .mnoun { max-width: 0; opacity: 0; margin: 0 -3px; }
  .mpage { font-size: 13px; letter-spacing: .044em; line-height: 1; color: var(--ink); text-decoration: none; border-radius: 7px;
    display: inline-block; overflow: hidden; max-width: 0; padding: 5px 0; margin: 0; opacity: 0; pointer-events: none;
    transform: scale(.9); transition: max-width .34s cubic-bezier(.2,.7,.3,1), padding .34s, margin .34s, opacity .24s, transform .34s cubic-bezier(.2,.7,.3,1); }
  .mside.l .mpage { transform: translateX(14px) scale(.9); }
  .mside.r .mpage { transform: translateX(-14px) scale(.9); }
  .mark.open .mpage { max-width: 140px; padding: 5px 9px; margin: 0 2px; opacity: 1; pointer-events: auto; transform: none; }
  .mside.l .mpage:last-child { margin-right: 6px; }
  .mside.r .mpage:first-child { margin-left: 6px; }
  .mpage:hover { background: var(--accent-soft); }
  .mpage.here { background: var(--bg); color: var(--ink); cursor: default; }
  .mpage.here:hover { background: var(--bg); }
  .levels-btn { margin-left: auto; background: var(--accent-soft); border: 0; border-radius: 999px; padding: 6px 14px; font-size: 13px;
                font-weight: 600; cursor: pointer; position: relative; z-index: 3; }
  @media (max-width: 640px) { .mark { display: none; } }

  /* ---- The game ---- */
  main { display: grid; justify-items: center; gap: 14px; padding: 18px 16px max(28px, env(safe-area-inset-bottom)); }
  .stage { width: var(--board); display: grid; gap: 12px; }
  :root { --board: min(calc(100vw - 32px), 560px, max(300px, calc(100dvh - 270px))); }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .title { font-family: "EB Garamond", Garamond, "Hoefler Text", serif; font-size: 30px; line-height: 1; letter-spacing: .01em; margin: 0; }
  .size { color: var(--muted); font-size: 13px; margin-left: 8px; font-family: inherit; }
  .clock { font-variant-numeric: tabular-nums; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .clock svg { width: 16px; height: 16px; opacity: .55; }
  .diff { display: flex; gap: 3px; align-items: center; color: var(--muted); font-size: 12px; }
  .diff i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .diff i.on { background: var(--ink); }
  .sub { display: flex; justify-content: space-between; align-items: center; margin-top: -4px; }

  .tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tool { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 9px 4px 8px; cursor: pointer;
          display: grid; justify-items: center; gap: 3px; font-size: 12px; font-weight: 600; }
  .tool svg { width: 20px; height: 20px; }
  .tool:hover { background: var(--accent-soft); }
  .tool:disabled { opacity: .45; cursor: default; }
  .tool[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .rules { color: var(--muted); font-size: 13px; margin: 2px 0 0; text-align: center; text-wrap: balance; }
  .toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); translate: -50% 20px; opacity: 0;
           background: var(--ink); color: var(--panel); padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
           transition: opacity .2s, translate .2s; pointer-events: none; z-index: 60; white-space: nowrap; }
  .toast.show { opacity: 1; translate: -50% 0; }

  /* ---- Win card and level picker ---- */
  .scrim { position: fixed; inset: 0; background: rgba(15, 25, 17, .38); display: grid; place-items: center; padding: 16px; z-index: 50;
           animation: fade .2s; }
  @keyframes fade { from { opacity: 0; } }
  .card { background: var(--panel); border-radius: 18px; padding: 24px 22px 20px; width: min(360px, 100%); text-align: center;
          box-shadow: 0 30px 60px -30px rgba(0,0,0,.5); animation: rise .3s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes rise { from { transform: translateY(16px) scale(.97); opacity: 0; } }
  .card h2 { font-family: "EB Garamond", Garamond, serif; font-weight: 400; font-size: 34px; margin: 4px 0 2px; }
  .card .big { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 6px 0 2px; }
  .card .meta { color: var(--muted); font-size: 13px; }
  .card .crownmark { width: 46px; height: 46px; color: #c99a2e; }
  .row { display: flex; gap: 8px; margin-top: 18px; }
  .btn { flex: 1; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 11px 10px; font-weight: 650; cursor: pointer; }
  .btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }

  .picker { background: var(--panel); border-radius: 18px; width: min(560px, 100%); max-height: min(86dvh, 760px); display: grid;
            grid-template-rows: auto 1fr; overflow: hidden; animation: rise .3s cubic-bezier(.2,.9,.3,1.2); }
  .picker header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
  .picker h2 { font-family: "EB Garamond", Garamond, serif; font-weight: 400; font-size: 28px; margin: 0; }
  .picker .count { color: var(--muted); font-size: 13px; }
  .close { border: 0; background: var(--accent-soft); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1; }
  .picker .scroll { overflow-y: auto; padding: 6px 18px 20px; overscroll-behavior: contain; }
  .picker h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 8px; font-weight: 650; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 7px; }
  .lv { aspect-ratio: 1; border-radius: 11px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; display: grid;
        place-items: center; align-content: center; gap: 1px; font-weight: 650; font-variant-numeric: tabular-nums; padding: 0; }
  .lv small { font-size: 10px; font-weight: 500; color: var(--muted); }
  .lv.done { background: var(--sw); border-color: transparent; color: #17281a; filter: var(--cell-filter); }
  .lv.done small { color: rgba(23,40,26,.7); }
  .lv.now { outline: 2.5px solid var(--ink); outline-offset: 1px; }
  .lv:hover { border-color: var(--ink); }
  .picker .foot { display: flex; justify-content: center; margin-top: 22px; }
  .linkbtn { border: 0; background: none; color: var(--muted); text-decoration: underline; font-size: 12px; cursor: pointer; }
  .picker .foot { gap: 18px; }

  /* ---- The lock ---- */
  .gate { min-height: calc(100dvh - 140px); display: grid; place-items: center; padding: 24px 16px; }
  .gatecard { background: var(--panel); border-radius: 18px; padding: 26px 22px 22px; width: min(360px, 100%); display: grid; gap: 12px;
              text-align: center; box-shadow: 0 30px 60px -34px rgba(0,0,0,.45); }
  .gatecard .crownmark { width: 40px; height: 40px; color: #c99a2e; justify-self: center; }
  .gatecard h2 { font-family: "EB Garamond", Garamond, serif; font-weight: 400; font-size: 30px; margin: 0; }
  .gatecard p { margin: -6px 0 4px; color: var(--muted); font-size: 13px; }
  .gatecard input[type=password] { font: inherit; font-size: 16px; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line);
                                   background: var(--bg); color: var(--ink); outline: none; width: 100%; }
  .gatecard input[type=password]:focus { border-color: var(--ink); }
  .gatecard input.wrong { border-color: var(--bad); animation: shake .3s; }
  .gatecard .msg { min-height: 1.2em; font-size: 13px; color: var(--bad); margin: -4px 0 0; }
  @keyframes shake { 25% { translate: -6px; } 75% { translate: 6px; } }
  .vh { position: absolute; width: 1px; height: 1px; padding: 0; border: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; opacity: 0; }
  .syncdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin: 0 5px 1px 0; vertical-align: middle; }
  .syncdot.ok { background: #3c9a52; } .syncdot.busy { background: #c99a2e; } .syncdot.bad { background: var(--bad); }


  /* ---- The board: a plain grid underneath, the drawn plots on top, the clues on top of those ---- */
  :root { --ground: #f3f5f1; --gridline: rgba(23, 40, 26, .13); --clue-ink: #17281a; }
  @media (prefers-color-scheme: dark) { :root { --ground: #262a27; --gridline: rgba(255, 255, 255, .08); } }
  .pboard { --n: 6; width: var(--board); aspect-ratio: 1; position: relative; border-radius: 12px; overflow: hidden;
            background-color: var(--ground);
            background-image: linear-gradient(var(--gridline) 1px, transparent 1px), linear-gradient(90deg, var(--gridline) 1px, transparent 1px);
            background-size: calc(100% / var(--n)) calc(100% / var(--n)); background-position: -0.5px -0.5px;
            border: 3px solid var(--wall); box-shadow: 0 10px 30px -18px rgba(23, 40, 26, .55);
            touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: crosshair; }
  .plot { position: absolute; border-radius: 9px; background: var(--c); filter: var(--cell-filter);
          box-shadow: inset 0 0 0 2px rgba(23, 40, 26, .28); transition: box-shadow .15s; animation: drop .18s ease-out;
          left: calc(var(--x) * 100% / var(--n) + 3px); top: calc(var(--y) * 100% / var(--n) + 3px);
          width: calc(var(--w) * 100% / var(--n) - 6px); height: calc(var(--h) * 100% / var(--n) - 6px); }
  .plot.empty { background: color-mix(in srgb, var(--muted) 30%, var(--ground)); }
  .plot.bad { background-image: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--bad) 30%, transparent) 6px 10px);
              box-shadow: inset 0 0 0 2.5px var(--bad); }
  .plot.flash { animation: glow .9s ease 2; }
  .plot.preview { background: color-mix(in srgb, var(--ink) 12%, transparent); box-shadow: inset 0 0 0 2.5px var(--ink);
                  animation: none; filter: none; z-index: 3; display: grid; place-items: center; }
  .plot.preview span { background: var(--ink); color: var(--panel); border-radius: 999px; padding: 2px 9px; font-size: 13px; font-weight: 700;
                       font-variant-numeric: tabular-nums; white-space: nowrap; }
  @keyframes drop { from { transform: scale(.94); opacity: .5; } }
  @keyframes glow { 50% { box-shadow: inset 0 0 0 4px var(--ink); } }
  .pboard.won .plot { animation: settle .6s cubic-bezier(.3,1.6,.5,1) both; animation-delay: calc(var(--k) * 40ms); }
  @keyframes settle { 40% { transform: scale(1.04); } }

  .clue { position: absolute; z-index: 2; pointer-events: none; display: grid; place-items: center;
          left: calc(var(--x) * 100% / var(--n)); top: calc(var(--y) * 100% / var(--n));
          width: calc(100% / var(--n)); height: calc(100% / var(--n)); }
  /* The tile's own shape is the hint: round = any shape, square = square, long = wider than tall, upright = taller than wide. */
  .clue b { --cell: calc(var(--board) / var(--n)); display: grid; place-items: center;
            background: var(--c); filter: var(--cell-filter); color: var(--clue-ink); box-shadow: 0 0 0 2px rgba(23, 40, 26, .35);
            font-weight: 750; font-size: calc(var(--cell) * .34); font-variant-numeric: tabular-nums; line-height: 1; }
  .clue b.a { width: 62%; height: 62%; border-radius: 50%; }
  .clue b.s { width: 62%; height: 62%; border-radius: calc(var(--cell) * .12); }
  .clue b.w { width: 84%; height: 50%; border-radius: calc(var(--cell) * .12); }
  .clue b.t { width: 50%; height: 84%; border-radius: calc(var(--cell) * .12); }

  .key { display: flex; justify-content: center; gap: 6px 16px; color: var(--muted); font-size: 12px; margin-top: -2px; flex-wrap: wrap; }
  .key span { display: inline-flex; align-items: center; gap: 6px; }
  .key i { display: inline-block; background: color-mix(in srgb, var(--muted) 55%, transparent); border-radius: 3px; }
  .key i.a { width: 11px; height: 11px; border-radius: 50%; } .key i.s { width: 11px; height: 11px; }
  .key i.w { width: 16px; height: 9px; } .key i.t { width: 9px; height: 16px; }
  .tools { grid-template-columns: repeat(3, 1fr); }
  .card .plotmark { width: 46px; height: 46px; }
</style>
</head>
<body>
<div class="top">
  <a class="brand" href="games.html">&lsaquo; Games</a>
  <nav class="mark" aria-label="MALIK">
    <span class="mside l">
      <a class="mpage" href="bot.html">Bot</a>
      <a class="mpage" href="notes.html">Notes</a>
    </span>
    <button class="mword" type="button" aria-expanded="false">
      <span class="marticle">a</span><span class="mname">MALIK</span><span class="mnoun">product</span>
    </button>
    <span class="mside r">
      <a class="mpage" href="index.html#preview">Yusuf&rsquo;s Preview</a>
      <a class="mpage" href="games.html">Games</a>
    </span>
  </nav>
  <button class="levels-btn" id="levelsBtn" type="button" hidden>Levels</button>
</div>
<script>
  /* The same menu as the other pages: press the mark and the pages come out either side of it. */
  (function () {
    const mk = document.querySelector(".mark"), btn = mk.querySelector(".mword");
    let away = null;
    const set = open => { mk.classList.toggle("open", open); btn.setAttribute("aria-expanded", open ? "true" : "false"); };
    btn.addEventListener("click", () => set(!mk.classList.contains("open")));
    document.addEventListener("pointermove", e => {
      if (!mk.classList.contains("open")) return;
      const r = mk.getBoundingClientRect(), pad = 28;
      const inside = e.clientX >= r.left - pad && e.clientX <= r.right + pad && e.clientY >= r.top - pad && e.clientY <= r.bottom + pad;
      if (inside) { clearTimeout(away); away = null; return; }
      if (away === null) away = setTimeout(() => { away = null; set(false); }, 420);
    });
    document.addEventListener("click", e => { if (mk.classList.contains("open") && !e.target.closest(".mark")) set(false); }, true);
  })();
</script>


<main id="game" hidden>
  <div class="stage">
    <div class="head">
      <h1 class="title"><span id="lvTitle">Level 1</span><span class="size" id="lvSize">5 × 5</span></h1>
      <div class="clock" aria-label="Time"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span id="clock">0:00</span></div>
    </div>
    <div class="sub">
      <div class="diff" id="diff" aria-label="Difficulty"></div>
      <div class="diff" id="best"></div>
    </div>
    <div class="pboard" id="board" aria-label="Puzzle board"></div>
    <div class="tools">
      <button class="tool" id="undo" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Undo</button>
      <button class="tool" id="clear" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>Clear</button>
      <button class="tool" id="hint" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2z"/></svg>Hint</button>
    </div>
    <div class="key"><span><i class="a"></i>any shape</span><span><i class="s"></i>square</span><span><i class="w"></i>wide</span><span><i class="t"></i>tall</span></div>
    <p class="rules">Split the grid into rectangles, each holding exactly one number &mdash; that&rsquo;s how many squares it covers, in the shape shown.<br>Drag to draw a rectangle. Tap one to remove it.</p>
  </div>
</main>

<div class="toast" id="toast" role="status"></div>

<div class="scrim" id="winScrim" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <svg class="plotmark" viewBox="0 0 24 24"><use href="#plotmark"/></svg>
    <h2 id="winTitle">Solved</h2>
    <div class="big" id="winTime">0:00</div>
    <div class="meta" id="winMeta"></div>
    <div class="row">
      <button class="btn" id="replay" type="button">Replay</button>
      <button class="btn primary" id="next" type="button">Next level</button>
    </div>
  </div>
</div>

<div class="scrim" id="pickScrim" hidden>
  <div class="picker" role="dialog" aria-modal="true" aria-labelledby="pickTitle">
    <header><div><h2 id="pickTitle">Levels</h2><div class="count" id="pickCount"></div></div><button class="close" id="pickClose" type="button" aria-label="Close">×</button></header>
    <div class="scroll" id="pickList"></div>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="plotmark" viewBox="0 0 24 24">
    <rect x="2" y="2" width="11" height="8" rx="2" fill="#f4b6a6"/><rect x="15" y="2" width="7" height="13" rx="2" fill="#9fcde8"/>
    <rect x="2" y="12" width="5" height="10" rx="2" fill="#f7d98b"/><rect x="9" y="12" width="4" height="10" rx="2" fill="#bfe0a6"/>
    <rect x="15" y="17" width="7" height="5" rx="2" fill="#cdb8ea"/>
  </symbol>
</svg>

    const out = blank();
    out.resetAt = Math.max(a.resetAt, b.resetAt);
    for (const src of [a, b]) for (const k in src.done) {
      const [t, at] = src.done[k];
      if (at < out.resetAt && at !== 0) continue;
      const cur = out.done[k];
      out.done[k] = cur ? [Math.min(cur[0], t), Math.max(cur[1], at)] : [t, at];
    }
    for (const src of [a, b]) for (const k in src.boards) {
      const bd = src.boards[k], cur = out.boards[k];
      if (bd.at < out.resetAt) continue;
      if (!cur || bd.at > cur.at || (bd.at === cur.at && (bd.t || 0) > (cur.t || 0))) out.boards[k] = bd;
    }
    for (const k in out.boards) if (out.done[k] && out.done[k][1] >= out.boards[k].at) delete out.boards[k];
    const p = b.prefsAt > a.prefsAt ? b : a;
    out.auto = !!p.auto; out.cur = p.cur; out.prefsAt = p.prefsAt;
    return out;
  }

  /* ---- Sync: one JSON file in a private GitHub repository, read on unlock and whenever the page
     comes back into view, written a moment after each change. Without a key it all stays on this device. ---- */
  const sync = { on: !!(SYNC && SYNC.token), sha: null, timer: 0, busy: false, again: false, state: "off", touched: false };
  const ghUrl = () => `https://api.github.com/repos/${SYNC.repo}/contents/${SYNC_FILE}`;
  const ghHead = () => ({ Authorization: "Bearer " + SYNC.token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" });
  const enc64 = (str) => btoa(String.fromCharCode(...new TextEncoder().encode(str)));
  const dec64 = (b) => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, "")), (c) => c.charCodeAt(0)));
  function setSync(state) {
    sync.state = state;
    const el = document.getElementById("syncLine");
    if (el) el.innerHTML = syncText();
  }
  function syncText() {
    const t = { off: ["", "Saved on this device only"], busy: ["busy", "Syncing…"], ok: ["ok", "Synced across your devices"],
                offline: ["bad", "Offline — saved here, will sync later"], key: ["bad", "Sync key isn't working"] }[sync.state];
    return `<span class="syncdot ${t[0]}"></span>${t[1]}`;
  }
  async function ghGet() {
    const r = await fetch(ghUrl() + "?t=" + Date.now(), { headers: ghHead(), cache: "no-store" });
    if (r.status === 404) return { data: null, sha: null };
    if (r.status === 401 || r.status === 403) throw { key: true };
    if (!r.ok) throw new Error("get " + r.status);
    const j = await r.json();
    return { data: JSON.parse(dec64(j.content)), sha: j.sha };
  }
  async function ghPut(data, sha, keepalive) {
    const body = { message: "Progress", content: enc64(JSON.stringify(data)) };
    if (sha) body.sha = sha;
    const r = await fetch(ghUrl(), { method: "PUT", headers: { ...ghHead(), "Content-Type": "application/json" }, body: JSON.stringify(body), keepalive: !!keepalive });
    if (r.status === 409 || r.status === 422) throw { conflict: true };
    if (r.status === 401 || r.status === 403 || r.status === 404) throw { key: true };
    if (!r.ok) throw new Error("put " + r.status);
    return (await r.json()).content.sha;
  }
  /* Fetch the file and fold it in. Returns true if anything here changed. */
  async function pull() {
    const { data, sha } = await ghGet();
    sync.sha = sha;
    if (!data) return { changed: false, remoteSame: false };
    const before = JSON.stringify(save);
    save = merge(save, data);
    const after = JSON.stringify(save);
    if (after !== before) persist();
    return { changed: after !== before, remoteSame: JSON.stringify(tidy(data)) === after };
  }
  async function push(keepalive) {
    if (!sync.on) return;
    if (sync.busy) { sync.again = true; return; }
    sync.busy = true; clearTimeout(sync.timer); setSync("busy");
    try {
      for (let k = 0; ; k++) {
        try { sync.sha = await ghPut(save, sync.sha, keepalive); break; }
        catch (e) { if (!e || !e.conflict || k > 3) throw e; const p = await pull(); if (p.changed) refreshFromSync(); }
      }
      setSync("ok");
    } catch (e) {
      setSync(e && e.key ? "key" : "offline");
      sync.timer = setTimeout(push, e && e.key ? 60000 : 15000);
    } finally {
      sync.busy = false;
      if (sync.again) { sync.again = false; schedulePush(); }
    }
  }
  function schedulePush(ms = 2500) { if (!sync.on) return; clearTimeout(sync.timer); sync.timer = setTimeout(push, ms); }
  async function syncNow() {
    if (!sync.on || sync.busy) return;
    setSync("busy");
    try {
      const p = await pull();
      if (p.changed) refreshFromSync();
      if (!p.remoteSame) await push(); else setSync("ok");
    } catch (e) { setSync(e && e.key ? "key" : "offline"); }
  }
  /* After progress arrives from another device: if nothing's been played here since, pick up where
     that device left off; otherwise just refresh what's on screen. */
  function refreshFromSync() {
    if (press || won) return;
    if (!sync.touched) { openLevel(startLevel(), true); return; }
    $("best").textContent = bestOf(L) != null ? `Best ${fmt(bestOf(L))}` : "";
  }
  async function firstPull() { await syncNow(); }
  document.addEventListener("visibilitychange", () => {
    if (!sync.on) return;
    if (document.hidden) { if (sync.timer && !sync.busy) push(true); }
    else { sync.touched = false; syncNow(); }
  });
  setSync(sync.on ? "busy" : "off");


  /* ---- Level state: the plots drawn so far, as [top, left, height, width] ---- */
  let n, clues, answer, colours, plots, history, elapsed, running, hints;
  const enc = (ps) => ps.map((p) => p.join(".")).join(",");
  const dec = (s) => (s ? s.split(",").map((t) => t.split(".").map(Number)) : []);
  const shapeOf = (h, w) => (h === w ? "s" : w > h ? "w" : "t");
  const inside = (p, r, c) => r >= p[0] && r < p[0] + p[2] && c >= p[1] && c < p[1] + p[3];
  const overlaps = (a, b) => a[0] < b[0] + b[2] && b[0] < a[0] + a[2] && a[1] < b[1] + b[3] && b[1] < a[1] + a[3];

  function openLevel(i, quiet) {
    L = i;
    if (save.cur !== i) { save.cur = i; save.prefsAt = Date.now(); if (!quiet) schedulePush(); }
    const [size, cl, ans, cols, score] = LEVELS[i];
    n = size; clues = cl; answer = ans; colours = cols;
    const kept = save.boards[i];
    plots = kept ? dec(kept.m) : [];
    elapsed = kept ? kept.t || 0 : 0; hints = kept ? kept.h || 0 : 0;
    history = []; won = false; running = false;

    $("lvTitle").textContent = `Level ${i + 1}`;
    $("lvSize").textContent = `${n} × ${n}`;
    const stars = score < 12 ? 1 : score < 25 ? 2 : score < 45 ? 3 : 4;
    $("diff").innerHTML = [1, 2, 3, 4].map((k) => `<i class="${k <= stars ? "on" : ""}"></i>`).join("") +
      `<span style="margin-left:5px">${["", "Gentle", "Steady", "Tricky", "Fiendish"][stars]}</span>`;
    $("best").textContent = bestOf(i) != null ? `Best ${fmt(bestOf(i))}` : "";
    boardEl.style.setProperty("--n", n);
    boardEl.classList.remove("won");
    render();
    tickClock();
    persist();
  }

  /* ---- Checking: a plot is right when it holds exactly one clue, of its size and shape ---- */
  function judge(p) {
    const inside_ = clues.map((q, k) => k).filter((k) => inside(p, clues[k][0], clues[k][1]));
    if (inside_.length !== 1) return { k: inside_[0], ok: false, empty: inside_.length === 0 };
    const [, , a, hint] = clues[inside_[0]];
    return { k: inside_[0], ok: p[2] * p[3] === a && (hint === "a" || hint === shapeOf(p[2], p[3])) };
  }

  function render(preview) {
    let html = "";
    let allOk = true, covered = 0;
    plots.forEach((p, idx) => {
      const j = judge(p);
      covered += p[2] * p[3];
      if (!j.ok) allOk = false;
      const col = j.k !== undefined ? PALETTE[colours[j.k]] : "";
      html += `<div class="plot${j.empty ? " empty" : ""}${j.ok ? "" : " bad"}" data-i="${idx}" style="--y:${p[0]};--x:${p[1]};--h:${p[2]};--w:${p[3]};--k:${idx};${col ? `--c:${col}` : ""}"></div>`;
    });
    if (preview) {
      const [r, c, h, w] = preview;
      html += `<div class="plot preview" style="--y:${r};--x:${c};--h:${h};--w:${w}"><span>${w >= 3 ? `${h} × ${w} = ` : ""}${h * w}</span></div>`;
    }
    clues.forEach(([r, c, a, hint], k) => {
      html += `<div class="clue" style="--y:${r};--x:${c}"><b class="${hint}" style="--c:${PALETTE[colours[k]]}">${a}</b></div>`;
    });
    boardEl.innerHTML = html;
    $("undo").disabled = !history.length || won;
    if (!won && !preview && allOk && covered === n * n && plots.length === clues.length) win();
  }

  /* ---- Moves ---- */
  function snapshot() { history.push(enc(plots)); if (history.length > 400) history.shift(); }
  function changed() {
    if (!running && !won) { running = true; lastTick = performance.now(); }
    save.boards[L] = { m: enc(plots), t: Math.floor(elapsed), h: hints, at: Date.now() };
    sync.touched = true;
    persist();
    schedulePush();
    render();
  }
  function cellAt(e) {
    const b = boardEl.getBoundingClientRect(), size = b.width / n;
    const c = Math.max(0, Math.min(n - 1, Math.floor((e.clientX - b.left) / size)));
    const r = Math.max(0, Math.min(n - 1, Math.floor((e.clientY - b.top) / size)));
    return [r, c];
  }
  const box = (a, b) => [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.abs(a[0] - b[0]) + 1, Math.abs(a[1] - b[1]) + 1];

  /* Drag from one square to another: that rectangle becomes a plot, replacing any it overlaps.
     Tap a plot: it goes. */
  boardEl.addEventListener("pointerdown", (e) => {
    if (won || e.button > 0) return;
    e.preventDefault();
    const at = cellAt(e);
    press = { id: e.pointerId, start: at, cur: at, moved: false };
    try { boardEl.setPointerCapture(e.pointerId); } catch (err) {}
  });
  boardEl.addEventListener("pointermove", (e) => {
    if (!press || e.pointerId !== press.id) return;
    const at = cellAt(e);
    if (at[0] === press.cur[0] && at[1] === press.cur[1]) return;
    press.cur = at; press.moved = true;
    render(box(press.start, press.cur));
  });
  function endPress(e) {
    if (!press || e.pointerId !== press.id) return;
    const { start, cur, moved } = press;
    press = null;
    if (e.type === "pointercancel") { render(); return; }
    if (!moved || (start[0] === cur[0] && start[1] === cur[1])) {
      const idx = plots.findIndex((p) => inside(p, start[0], start[1]));
      if (idx >= 0) { snapshot(); plots.splice(idx, 1); changed(); }
      else render();
      return;
    }
    const p = box(start, cur);
    snapshot();
    plots = plots.filter((q) => !overlaps(p, q));
    plots.push(p);
    changed();
  }
  boardEl.addEventListener("pointerup", endPress);
  boardEl.addEventListener("pointercancel", endPress);
  boardEl.addEventListener("contextmenu", (e) => e.preventDefault());

  function undo() {
    if (!history.length || won) return;
    plots = dec(history.pop());
    changed();
  }
  $("undo").addEventListener("click", undo);
  document.addEventListener("keydown", (e) => {
    if (e.key.toLowerCase() === "z" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); undo(); }
    if (e.key === "Escape") $("pickScrim").hidden = true;
  });
  $("clear").addEventListener("click", () => {
    if (won || !plots.length) return;
    snapshot(); plots = []; changed(); toast("Cleared — Undo brings it back");
  });

  /* Hint: puts in one plot from the answer (clearing anything in its way), preferring a clue whose plot is wrong or missing. */
  $("hint").addEventListener("click", () => {
    if (won) return;
    const has = (a) => plots.some((p) => p[0] === a[0] && p[1] === a[1] && p[2] === a[2] && p[3] === a[3]);
    const missing = answer.map((a, k) => k).filter((k) => !has(answer[k]));
    if (!missing.length) return;
    const k = missing[Math.floor(Math.random() * missing.length)], a = answer[k];
    snapshot();
    plots = plots.filter((q) => !overlaps(a, q));
    plots.push([...a]);
    hints++;
    changed();
    const el = boardEl.querySelector(`.plot[data-i="${plots.length - 1}"]`);
    if (el) el.classList.add("flash");
  });

  /* ---- Clock ---- */
  let lastTick = 0;
  function fmt(s) { s = Math.floor(s); const m = Math.floor(s / 60); return `${m}:${String(s % 60).padStart(2, "0")}`; }
  function tickClock() { $("clock").textContent = fmt(elapsed); }
  setInterval(() => {
    if (!running || won || document.hidden) return;
    const now = performance.now();
    elapsed += (now - lastTick) / 1000; lastTick = now;
    tickClock();
    if (save.boards[L]) { save.boards[L].t = Math.floor(elapsed); persist(); }
  }, 250);
  document.addEventListener("visibilitychange", () => { lastTick = performance.now(); });

  /* ---- Winning ---- */
  function win() {
    won = true; running = false;
    const t = Math.max(1, Math.floor(elapsed));
    const prev = bestOf(L);
    const record = prev == null || t < prev;
    save.done[L] = [record ? t : prev, Date.now()];
    delete save.boards[L];
    persist();
    push();
    boardEl.classList.add("won");
    $("undo").disabled = true;
    $("winTime").textContent = fmt(t);
    const bits = [];
    if (prev == null) bits.push(`Level ${L + 1} done`);
    else bits.push(record ? `New best — was ${fmt(prev)}` : `Best ${fmt(prev)}`);
    if (hints) bits.push(`${hints} hint${hints > 1 ? "s" : ""}`);
    bits.push(`${Object.keys(save.done).length} of ${LEVELS.length} solved`);
    $("winMeta").textContent = bits.join(" · ");
    $("next").textContent = L + 1 < LEVELS.length ? "Next level" : "All levels";
    setTimeout(() => { if (won) { $("winScrim").hidden = false; $("next").focus(); } }, 900);
  }
  $("next").addEventListener("click", () => {
    $("winScrim").hidden = true;
    if (L + 1 < LEVELS.length) openLevel(L + 1); else showPicker();
  });
  $("replay").addEventListener("click", () => {
    $("winScrim").hidden = true;
    delete save.boards[L];
    openLevel(L);
  });

  /* ---- Level picker ---- */
  function showPicker() {
    const done = Object.keys(save.done).length;
    $("pickCount").innerHTML = `${done} of ${LEVELS.length} solved · <span id="syncLine">${syncText()}</span>`;
    syncNow();
    let html = "", lastN = 0;
    LEVELS.forEach(([size], i) => {
      if (size !== lastN) { if (lastN) html += "</div>"; html += `<h3>${size} × ${size}</h3><div class="grid">`; lastN = size; }
      const best = bestOf(i), going = save.boards[i];
      const cls = ["lv", best != null ? "done" : "", i === L ? "now" : ""].join(" ");
      const note = best != null ? fmt(best) : going ? "…" : "";
      html += `<button class="${cls}" data-lv="${i}" style="--sw:${PALETTE[(i * 3) % PALETTE.length]}" type="button" aria-label="Level ${i + 1}${best != null ? ", solved" : ""}">${i + 1}${note ? `<small>${note}</small>` : ""}</button>`;
    });
    html += `</div><div class="foot"><button class="linkbtn" id="wipe" type="button">Reset all progress</button><button class="linkbtn" id="lockBtn" type="button">Lock this device</button></div>`;
    $("pickList").innerHTML = html;
    $("pickScrim").hidden = false;
    const now = $("pickList").querySelector(".now");
    if (now) now.scrollIntoView({ block: "center" });
  }
  $("levelsBtn").addEventListener("click", showPicker);
  $("pickClose").addEventListener("click", () => { $("pickScrim").hidden = true; });
  $("pickScrim").addEventListener("click", (e) => {
    if (e.target === $("pickScrim")) { $("pickScrim").hidden = true; return; }
    const b = e.target.closest(".lv");
    if (b) { $("pickScrim").hidden = true; $("winScrim").hidden = true; openLevel(+b.dataset.lv); return; }
    if (e.target.id === "wipe" && confirm("Reset every level's times and progress?")) {
      const now = Date.now();
      save = { ...blank(), prefsAt: now, resetAt: now }; persist(); push();
      $("pickScrim").hidden = true; openLevel(0);
    }
    if (e.target.id === "lockBtn") {
      if (sync.timer && !sync.busy) push(true);
      lock();
    }
  });

  let toastT;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1900);
  }

  function startLevel() {
    const cur = Number.isInteger(save.cur) && save.cur >= 0 && save.cur < LEVELS.length ? save.cur : 0;
    const first = LEVELS.findIndex((_, i) => save.done[i] == null);
    return save.done[cur] != null && !save.boards[cur] && first >= 0 ? first : cur;
  }
  openLevel(startLevel(), true);
  if (sync.on) syncNow();
}
</script>
</body>
</html>
