<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a MALIK product</title>
<style>
  /* Registered so they can be used inside calc() and colour mixing, and so they hold
     a sane value before the first scroll event lands. */
  @property --fade    { syntax: '<number>'; inherits: true; initial-value: 1; }
  @property --collapse{ syntax: '<number>'; inherits: true; initial-value: 0; }
  @property --raised  { syntax: '<number>'; inherits: true; initial-value: 0; }
  @property --lift    { syntax: '<number>'; inherits: true; initial-value: 0; }

  :root {
    /* Four readings of one scroll, not four stages of it. Every one of them is moving
       while the others are: the words go while the slab arrives while the whole thing
       climbs. They differ only in how quickly each finishes. */
    --fade: 1;      /* the ink in "a" and "product" */
    --collapse: 0;  /* the room those two words take up */
    --raised: 0;    /* how far the slab has come up out of the page */
    --lift: 0;      /* how far up the window the slab has travelled */

    --big: clamp(2rem, 7vw, 3.25rem);

    /* How far the slab keeps off the top of the window once it has arrived. */
    --perch: 40px;

    /* The mark's own colours, as the app sets them. */
    --mark:  #000000;
    --muted: rgba(0, 0, 0, 0.5);

    /* Two grounds: the flat one the page opens on, and the softer one the raised slab
       needs. Neumorphism cannot work against pure white — the highlight has nowhere
       to go — so the page warms into it as you scroll rather than starting there. */
    --ground-flat: #ffffff;
    --ground-soft: #e9e6e0;

    --plate:       #ebe8e2;
    --plate-lit:   #f1eee9;
    --shadow-dark: rgba(160, 153, 141, 0.55);
    --shadow-lit:  rgba(255, 255, 255, 0.55);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --mark:  #ffffff;
      --muted: rgba(255, 255, 255, 0.55);

      --ground-flat: #1c1c1e;
      --ground-soft: #232329;

      --plate:       #26262d;
      --plate-lit:   #2b2b33;
      --shadow-dark: rgba(0, 0, 0, 0.62);
      --shadow-lit:  rgba(66, 66, 80, 0.30);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: color-mix(in srgb, var(--ground-soft) calc(var(--raised) * 100%), var(--ground-flat));
    color: var(--mark);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Nothing on the page needs a position indicator, and a bar down the right edge is
     one more thing sitting beside a mark meant to be alone. Scrolling itself is
     untouched — only the drawing of it.

     Declared on the root as well as the body, because the element that actually
     scrolls a normal page is the root: putting this on `body` alone hides a scrollbar
     the body does not have and leaves the visible one exactly where it was. */
  html, body {
    scrollbar-width: none;          /* Firefox, and Safari 18.2 on */
    -ms-overflow-style: none;
  }
  html::-webkit-scrollbar,
  body::-webkit-scrollbar { width: 0; height: 0; display: none; }

  /* The room to scroll through. The mark never travels down the page — the stage is
     stuck to the top of the window while this passes behind it. */
  .scroller { height: 220vh; height: 220svh; }

  .stage {
    position: sticky;
    top: 0;
    height: 100vh;
    height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    /* A full-height layer over the page: it must not swallow scrolling. */
    pointer-events: none;
  }

  .plate {
    position: relative;
    pointer-events: auto;
    padding: 0.52em 1.15em;
    font-size: var(--big);
    /* Rises from the middle of the window to rest near the top. It keeps its size and
       its shape the whole way — the slab is the bar, not something that turns into
       one. The distance depends on how tall it is, so it is measured, not assumed. */
    transform: translateY(calc(var(--rise, 0px) * var(--lift)));
  }

  /* The slab itself, behind the letters. A pseudo-element so it can fade and grow
     without dragging the text with it.
     
     Lit from straight above rather than from a corner. A diagonal light threw the
     dark shadow further right than the pale one reached left, and since a dark shadow
     on a light ground registers far more strongly than a white one does, the slab's
     visual weight ended up about ten pixels right of the name — which is what made a
     name measuring dead centre look as though it had slipped left. Straight down, the
     two sides cannot disagree. */
  .plate::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 0.62em;
    background: linear-gradient(180deg, var(--plate-lit), var(--plate));
    box-shadow:
      0 calc(0.22em * var(--raised)) calc(0.6em * var(--raised)) var(--shadow-dark),
      0 calc(-0.14em * var(--raised)) calc(0.45em * var(--raised)) var(--shadow-lit);
    opacity: var(--raised);
    transform: scale(calc(0.94 + 0.06 * var(--raised)));
  }

  .wordmark {
    position: relative;   /* above the slab */
    z-index: 1;
    display: flex;
    align-items: baseline;
    /* Closes along with the words either side, so nothing is left holding the slab
       open once they have gone. */
    gap: calc(0.206em * (1 - var(--collapse)));
    visibility: hidden;
  }
  .wordmark.ready { visibility: visible; }

  .article,
  .noun {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    font-size: 0.441em;
    font-weight: 400;
    color: var(--muted);
    white-space: nowrap;
    /* They give up their width as well as their ink. Fading alone left them holding
       the row open, so the slab stayed as wide as the whole phrase around a name that
       no longer needed the room. Faded out by the time they are a third gone, so the
       narrowing is never seen cutting into a letter. */
    overflow: hidden;
    opacity: var(--fade);
  }
  .article { width: calc(var(--wa, 0px) * (1 - var(--collapse))); }
  .noun    { width: calc(var(--wn, 0px) * (1 - var(--collapse))); }

  .name {
    font-family: "EB Garamond", Garamond, "Adobe Garamond Pro", "Hoefler Text", "Times New Roman", serif;
    font-size: 1em;
    font-weight: 400;
    letter-spacing: 0.044em;   /* 1.5pt at 34pt */
    color: var(--mark);
    white-space: nowrap;

    /* Squeezed to 80% of its width, as the app sets it. A transform does not change
       the space an element takes up, so the 10% left standing at each end is taken
       back below — measured, because the width depends on which Garamond the
       visitor's machine actually has. */
    display: inline-block;
    transform: scaleX(0.8);
  }
</style>
</head>
<body>
  <div class="scroller">
    <div class="stage">
      <div class="plate">
        <p class="wordmark">
          <span class="article">a</span><span class="name">MALIK</span><span class="noun">product</span>
        </p>
      </div>
    </div>
  </div>

<script>
  const root = document.documentElement;
  const stage = document.querySelector('.stage');
  const plate = document.querySelector('.plate');
  const wordmark = document.querySelector('.wordmark');
  const name = document.querySelector('.name');
  const article = document.querySelector('.article');
  const noun = document.querySelector('.noun');

  const clamp01 = (n) => Math.min(Math.max(n, 0), 1);

  // `offsetWidth` is the laid-out width, which a transform leaves alone — so these are
  // the true widths, before the squeeze and before any sliding.
  function measure() {
    name.style.marginInline = '0';

    // Letter spacing is added after the last letter as well as between them, so the
    // painted word sits half a space left of the box that holds it. Splitting that
    // difference between the two margins puts the letters themselves on the centre
    // line rather than their box.
    const tracking = parseFloat(getComputedStyle(name).letterSpacing) || 0;
    const bias = tracking * 0.8 / 2;          // 0.8 because the name is squeezed
    const pull = -name.offsetWidth * 0.1;     // the room the squeeze leaves standing
    name.style.marginLeft = `${pull + bias}px`;
    name.style.marginRight = `${pull - bias}px`;

    // Their natural widths, so the collapse has somewhere to start from. Cleared
    // first, or each measurement would return the width the last one set.
    article.style.width = 'auto';
    noun.style.width = 'auto';
    root.style.setProperty('--wa', `${article.offsetWidth}px`);
    root.style.setProperty('--wn', `${noun.offsetWidth}px`);
    article.style.width = '';
    noun.style.width = '';
    wordmark.classList.add('ready');
  }

  function frame() {
    const vh = window.innerHeight;
    // One scroll, read four ways. They all start together at the first pixel of it —
    // the mark begins climbing while the words are still fading, rather than waiting
    // for them to finish — and only differ in how soon each is done.
    const p = clamp01(window.scrollY / (vh * 0.9));
    // The ink goes first and the room it took goes second, because a word that is
    // still half visible while its box is closing gets sliced down the middle. Both
    // happen inside the opening fifth of the scroll, well before the climb is over —
    // nothing here waits for anything else to finish.
    root.style.setProperty('--fade', clamp01(1 - p / 0.18).toFixed(4));
    root.style.setProperty('--collapse', clamp01((p - 0.18) / 0.30).toFixed(4));
    root.style.setProperty('--raised', clamp01(p / 0.45).toFixed(4));
    root.style.setProperty('--lift', p.toFixed(4));

    // Half the room above the slab is how far it has to climb to reach the top of the
    // window; the perch is what stops it landing flush against the edge.
    const perch = parseFloat(getComputedStyle(root).getPropertyValue('--perch')) || 0;
    root.style.setProperty('--rise', `${-((stage.offsetHeight - plate.offsetHeight) / 2 - perch)}px`);
  }

  let queued = false;
  function onScroll() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; frame(); });
  }

  // Measured once the font is in hand: sizing against the fallback would set the
  // spacing for a face that is about to be replaced.
  (document.fonts?.ready ?? Promise.resolve()).then(() => { measure(); frame(); });

  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('resize', () => { measure(); frame(); });
</script>
</body>
</html>
