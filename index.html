<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a MALIK product</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Barrio&family=Birthstone&family=Explora&family=Hurricane&family=Nanum+Gothic&family=Qahiri&family=Rock+Salt&display=swap">
<style>
  /* Registered so they can be used inside calc() and colour mixing, and so they hold
     a sane value before the first scroll event lands. */
  @property --fade    { syntax: '<number>'; inherits: true; initial-value: 1; }
  @property --collapse{ syntax: '<number>'; inherits: true; initial-value: 0; }
  @property --raised  { syntax: '<number>'; inherits: true; initial-value: 0; }
  @property --lift    { syntax: '<number>'; inherits: true; initial-value: 0; }
  /* The reveal's own readings. --arrive and --overshoot are two easings of the one
     arrival: everything lands on the first, and only the sideways travel rides the
     second, which carries the pane a hair past its mark and lets it settle back. */
  @property --arrive    { syntax: '<number>'; inherits: true; initial-value: 0; }
  @property --overshoot { syntax: '<number>'; inherits: true; initial-value: 0; }
  @property --arrive-o  { syntax: '<number>'; inherits: true; initial-value: 0; }
  @property --body      { syntax: '<number>'; inherits: true; initial-value: 0; }
  @property --bloom     { syntax: '<number>'; inherits: true; initial-value: 0; }

  :root {
    /* Four readings of one scroll, not four stages of it. Every one of them is moving
       while the others are: the words go while the slab arrives while the whole thing
       climbs. They differ only in how quickly each finishes. */
    --fade: 1;      /* the ink in "a" and "product" */
    --collapse: 0;  /* the room those two words take up */
    --raised: 0;    /* how far the slab has come up out of the page */
    --lift: 0;      /* how far up the window the slab has travelled */
    --arrive: 0;    /* the pane coming across */
    --overshoot: 0; /* the same arrival, allowed past its mark */
    --arrive-o: 0;  /* the pane's ink, in before its travel is */
    --body: 0;      /* the icon's shape settling in behind it */
    --bloom: 0;     /* the painted ground coming up through the glass */

    /* Big enough to be the second act rather than a footnote to the first, and
       still narrower than the pill it arrives beneath. */
    --icon: min(48vmin, 300px);

    /* What the icon makes room for when it is opened. The width is a ceiling, not a
       size: the sheet is only as wide as its own words, and the pair is centred on
       what it actually measures rather than on the box it was allowed. */
    --sheet-max: min(300px, 34vw);
    --gap: clamp(28px, 5vw, 56px);

    --big: clamp(2rem, 7vw, 3.25rem);

    /* How far the slab keeps off the top of the window once it has arrived. */
    --perch: 24px;

    /* The mark's own colours, as the app sets them. */
    --mark:  #000000;
    --muted: rgba(0, 0, 0, 0.5);

    /* Two grounds: the flat one the page opens on, and the softer one the raised slab
       needs. Neumorphism cannot work against pure white — the highlight has nowhere
       to go — so the page warms into it as you scroll rather than starting there. */
    --ground-flat: #ffffff;
    --ground-soft: #e9e6e0;

    --plate:       #ebe8e2;
    --plate-lit:   #f1eee9;
    --shadow-dark: rgba(160, 153, 141, 0.55);
    --shadow-lit:  rgba(255, 255, 255, 0.55);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --mark:  #ffffff;
      --muted: rgba(255, 255, 255, 0.55);

      --ground-flat: #1c1c1e;
      --ground-soft: #232329;

      --plate:       #26262d;
      --plate-lit:   #2b2b33;
      --shadow-dark: rgba(0, 0, 0, 0.62);
      --shadow-lit:  rgba(66, 66, 80, 0.30);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: color-mix(in srgb, var(--ground-soft) calc(var(--raised) * 100%), var(--ground-flat));
    color: var(--mark);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Nothing on the page needs a position indicator, and a bar down the right edge is
     one more thing sitting beside a mark meant to be alone. Scrolling itself is
     untouched — only the drawing of it.

     Declared on the root as well as the body, because the element that actually
     scrolls a normal page is the root: putting this on `body` alone hides a scrollbar
     the body does not have and leaves the visible one exactly where it was. */
  html, body {
    scrollbar-width: none;          /* Firefox, and Safari 18.2 on */
    -ms-overflow-style: none;

    /* A sideways swipe on a page with nowhere to go sideways is handed to the browser,
       which reads it as "back". Since a sideways swipe here means something, the page
       keeps it: this refuses the overscroll the gesture is built on, rather than
       trying to out-guess it after the fact. */
    overscroll-behavior-x: none;
    /* The same refusal for touch — the page pans up and down, and nothing else. */
    touch-action: pan-y;
  }

  /* A grey dot instead of the arrow.
  
     A real cursor rather than a circle chased across the page by script: the system
     draws it, so it is exactly under the pointer at every moment instead of a frame
     or two behind it. The pair of images is for retina — the browser measures a
     cursor in CSS pixels, so a single small one is drawn soft on a dense screen. The
     numbers after the image are the hotspot: half the width and half the height, so
     the point being clicked is the middle of the dot rather than its top left.
     
     `auto` at the end is not decoration. If a browser cannot load the image it falls
     through to the arrow rather than leaving the visitor with no pointer at all. */
  html, body, .stage, .plate, .wordmark {
    cursor: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAABaklEQVR42qWTMY7TQBSGv3/GNk2KKbMF10CIhpScwFLkA9AgueUIbOkVDQeIIuUEW2YbhPYaFJvKcpEGe2YeBQ7aApSs8lej0Xzz/0/vPQGYmSQZwHa7fVcUxcec8/uU0msA7/1P59xDjPHber3+/pzR6dB13avlcvlF0qeiKIppmkgpMX9AWZbEGKOZfT0cDp/btv1lZtJut/OLxaIYhuE+hLAahsHMLANOkmY3A7IkF0LQMAz7EMKH4/EYXV3Xqe/72xDCqu/7EZAkf4KZLyR5QH3fj/Pb27qukzabzRvv/Y+ccwYc8Bf8jwzIzjmXUnrrgLaqKv1JeRYGkJlRVZWA1gGraZqY3S+Vm5mVA25SSjyv+WwESXOHbl7i+u8owJP3/tSqi2Rm5r0HeHLAvixLgPwC4zwzewd04zjaaWYuCSCJcRwN6FzTNI8xxrsQgs85T2etc55CCD7GeNc0zePVo3z9Ml27zr8BYor+cf9zHwkAAAAASUVORK5CYII=) 8 8, auto;
    cursor: -webkit-image-set(
              url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAABaklEQVR42qWTMY7TQBSGv3/GNk2KKbMF10CIhpScwFLkA9AgueUIbOkVDQeIIuUEW2YbhPYaFJvKcpEGe2YeBQ7aApSs8lej0Xzz/0/vPQGYmSQZwHa7fVcUxcec8/uU0msA7/1P59xDjPHber3+/pzR6dB13avlcvlF0qeiKIppmkgpMX9AWZbEGKOZfT0cDp/btv1lZtJut/OLxaIYhuE+hLAahsHMLANOkmY3A7IkF0LQMAz7EMKH4/EYXV3Xqe/72xDCqu/7EZAkf4KZLyR5QH3fj/Pb27qukzabzRvv/Y+ccwYc8Bf8jwzIzjmXUnrrgLaqKv1JeRYGkJlRVZWA1gGraZqY3S+Vm5mVA25SSjyv+WwESXOHbl7i+u8owJP3/tSqi2Rm5r0HeHLAvixLgPwC4zwzewd04zjaaWYuCSCJcRwN6FzTNI8xxrsQgs85T2etc55CCD7GeNc0zePVo3z9Ml27zr8BYor+cf9zHwkAAAAASUVORK5CYII=) 1x,
              url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAADvElEQVR42s2Xz2sbRxTHv+/NrHe19q4hUGoTcktLqUIhl0IvyaGUgCD0Ug/WQehPMBRyVnQoBEIK/hNsX4wEgRIohKTngi+FEpniHkPllECwK0sr7c7M66Hr4rp2mmJbyTsuO/P5vu+bNz8Ipwe1Wi3VbrctAHQ6nQUiqnnvv/DefyIil4koBQAR+YOIfmPmn5n5iYh8b4x5AQCtVku3220HQE6EnPSx1Wpxu932ALCxsfFxGIYrAL5USr1PRHDOwTkH7z0AgJmhlIJSCiIC59zvAL6bTCarjUZj+/icrxXQ6XSUMcatrq6Gi4uLd4no6zAMZ7Isg7XWl5kwER0dLyICAB4Aaa25UqlgMpnkIvLt7u7u3ZWVlcnh3KcKOPxhbW3twziON6Io+nQwGEBELABFJfW/olTjiEgnSYLxeLw1Go0azWZz57gIOg4vLf9hZmZmYTgcFkSkTyvVG2qxs7OzQZ7nLyaTyeeNRmP7qAg+rI8xxq2vr18Nw/CpUmphOBxaIgrOAAcAIqJgOBxapdRCGIZP19fXrxpjXKvVYgAgEaFut8tzc3N6f3//x0qlcr2Ea5xjlE7oLMt+mp+f/+zg4MAuLS15Va1WlTHG1Wq1b9I0/WowGBRl5ucaRMR5nhdpml7e29sL6vX6k2q1qkhEaHNz8wNm7nnvSUT4jLa/1ggi8sws3vvq8vLyr0xEIiJ34jjW3nu5QDgAkPde4jjWInKHiIQ6nc57RVH8orW+ZK2VN221M6wF0VqTtfZVEAQfsbX2dhRFl6y1/qLhh21hrfUl8zaLyC0iktP26gtcCyIit5iIrjnnaBrZH3WhZF5jAFeccxCRqQkQEXLOAcAVBpB47zFtB8qTNGG85WAAA2b++zydUgmEmQFgwACeK6VQdsK0SiBKKQB4ziLyTCkl03agZD5jInpcdgBNsfQkIkREj1lr/Wg8Hr/SWvM0XCi3Yi6Zj9gY85KIHsZxDABuCtm7OI5BRA+NMS+5tOL+aDSyzEwXvCULM9NoNLJEdF9EiLvdLtfr9R1r7YMkSVR5Ab0o+22SJMpa+6Ber+90u11+61cyJiLp9XpSq9UmRVGYPM93oyjS5+mEiNgoinSe57tFUZharTbp9XpCRPJuXMsBwBjjOp2OajQa21mW3SyKYitN06DsWft/WlT+CguA0jQNiqLYyrLs5nH4PwQcFdFsNnf6/f6NLMvuBUGQJ0mitdYkIl5EXClG/s0UJyJea01JkuggCPIsy+71+/0bJ72K3s3H6bSf538CEwqyNa4QXuoAAAAASUVORK5CYII=) 2x) 8 8, auto;
    cursor: image-set(
              url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAABaklEQVR42qWTMY7TQBSGv3/GNk2KKbMF10CIhpScwFLkA9AgueUIbOkVDQeIIuUEW2YbhPYaFJvKcpEGe2YeBQ7aApSs8lej0Xzz/0/vPQGYmSQZwHa7fVcUxcec8/uU0msA7/1P59xDjPHber3+/pzR6dB13avlcvlF0qeiKIppmkgpMX9AWZbEGKOZfT0cDp/btv1lZtJut/OLxaIYhuE+hLAahsHMLANOkmY3A7IkF0LQMAz7EMKH4/EYXV3Xqe/72xDCqu/7EZAkf4KZLyR5QH3fj/Pb27qukzabzRvv/Y+ccwYc8Bf8jwzIzjmXUnrrgLaqKv1JeRYGkJlRVZWA1gGraZqY3S+Vm5mVA25SSjyv+WwESXOHbl7i+u8owJP3/tSqi2Rm5r0HeHLAvixLgPwC4zwzewd04zjaaWYuCSCJcRwN6FzTNI8xxrsQgs85T2etc55CCD7GeNc0zePVo3z9Ml27zr8BYor+cf9zHwkAAAAASUVORK5CYII=) 1x,
              url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAADvElEQVR42s2Xz2sbRxTHv+/NrHe19q4hUGoTcktLqUIhl0IvyaGUgCD0Ug/WQehPMBRyVnQoBEIK/hNsX4wEgRIohKTngi+FEpniHkPllECwK0sr7c7M66Hr4rp2mmJbyTsuO/P5vu+bNz8Ipwe1Wi3VbrctAHQ6nQUiqnnvv/DefyIil4koBQAR+YOIfmPmn5n5iYh8b4x5AQCtVku3220HQE6EnPSx1Wpxu932ALCxsfFxGIYrAL5USr1PRHDOwTkH7z0AgJmhlIJSCiIC59zvAL6bTCarjUZj+/icrxXQ6XSUMcatrq6Gi4uLd4no6zAMZ7Isg7XWl5kwER0dLyICAB4Aaa25UqlgMpnkIvLt7u7u3ZWVlcnh3KcKOPxhbW3twziON6Io+nQwGEBELABFJfW/olTjiEgnSYLxeLw1Go0azWZz57gIOg4vLf9hZmZmYTgcFkSkTyvVG2qxs7OzQZ7nLyaTyeeNRmP7qAg+rI8xxq2vr18Nw/CpUmphOBxaIgrOAAcAIqJgOBxapdRCGIZP19fXrxpjXKvVYgAgEaFut8tzc3N6f3//x0qlcr2Ea5xjlE7oLMt+mp+f/+zg4MAuLS15Va1WlTHG1Wq1b9I0/WowGBRl5ucaRMR5nhdpml7e29sL6vX6k2q1qkhEaHNz8wNm7nnvSUT4jLa/1ggi8sws3vvq8vLyr0xEIiJ34jjW3nu5QDgAkPde4jjWInKHiIQ6nc57RVH8orW+ZK2VN221M6wF0VqTtfZVEAQfsbX2dhRFl6y1/qLhh21hrfUl8zaLyC0iktP26gtcCyIit5iIrjnnaBrZH3WhZF5jAFeccxCRqQkQEXLOAcAVBpB47zFtB8qTNGG85WAAA2b++zydUgmEmQFgwACeK6VQdsK0SiBKKQB4ziLyTCkl03agZD5jInpcdgBNsfQkIkREj1lr/Wg8Hr/SWvM0XCi3Yi6Zj9gY85KIHsZxDABuCtm7OI5BRA+NMS+5tOL+aDSyzEwXvCULM9NoNLJEdF9EiLvdLtfr9R1r7YMkSVR5Ab0o+22SJMpa+6Ber+90u11+61cyJiLp9XpSq9UmRVGYPM93oyjS5+mEiNgoinSe57tFUZharTbp9XpCRPJuXMsBwBjjOp2OajQa21mW3SyKYitN06DsWft/WlT+CguA0jQNiqLYyrLs5nH4PwQcFdFsNnf6/f6NLMvuBUGQJ0mitdYkIl5EXClG/s0UJyJea01JkuggCPIsy+71+/0bJ72K3s3H6bSf538CEwqyNa4QXuoAAAAASUVORK5CYII=) 2x) 8 8, auto;
  }
  html::-webkit-scrollbar,
  body::-webkit-scrollbar { width: 0; height: 0; display: none; }

  /* The room to scroll through. The mark never travels down the page — the stage is
     stuck to the top of the window while this passes behind it.

     Most of this is the icon's. The mark is done climbing inside the first window's
     worth; the rest is the reveal, which needs the room to be a reveal rather than a
     flicker. */
  .scroller { height: 460vh; height: 460svh; }

  .stage {
    position: sticky;
    top: 0;
    height: 100vh;
    height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    /* A full-height layer over the page: it must not swallow scrolling. */
    pointer-events: none;

    /* The pane comes in on a diagonal from off to the right, and both of these are
       about that approach: the perspective is what makes the turn read as depth, and
       the clip is what keeps the last of the travel from reaching over the edge of
       the window. */
    perspective: 1500px;
    perspective-origin: 50% 48%;
    overflow: hidden;
  }

  .plate {
    position: relative;
    pointer-events: auto;
    --pad-x: 1.15em;
    padding: 0.52em var(--pad-x);
    font-size: var(--big);

    /* The room the broadest face needs, held as a floor the closing pill stops at
       rather than a size it reaches for at the end. The words either side close as
       you scroll and the pill closes with them — but it stops here instead of drawing
       all the way in to the name, so the size it settles at on arrival is a size it
       has already shrunk to. Applied at the moment of arrival instead, as it was, a
       pill that had just finished closing sprang back open by the better part of a
       letter. Now it only ever contracts. --floor is a multiple of the mark's own
       size, measured from the faces once they have loaded; the padding is added back
       because the box is border-box. */
    min-width: calc(var(--floor, 0) * 1em + var(--pad-x) * 2);
    /* Rises from the middle of the window to rest near the top. It keeps its size and
       its shape the whole way — the slab is the bar, not something that turns into
       one. The distance depends on how tall it is, so it is measured, not assumed. */
    transform: translateY(calc(var(--rise, 0px) * var(--lift)));
  }

  /* The slab itself, behind the letters. A pseudo-element so it can fade and grow
     without dragging the text with it.
     
     Lit from straight above rather than from a corner. A diagonal light threw the
     dark shadow further right than the pale one reached left, and since a dark shadow
     on a light ground registers far more strongly than a white one does, the slab's
     visual weight ended up about ten pixels right of the name — which is what made a
     name measuring dead centre look as though it had slipped left. Straight down, the
     two sides cannot disagree. */
  .plate::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 0.62em;
    background: linear-gradient(180deg, var(--plate-lit), var(--plate));
    box-shadow:
      0 calc(0.22em * var(--raised)) calc(0.6em * var(--raised)) var(--shadow-dark),
      0 calc(-0.14em * var(--raised)) calc(0.45em * var(--raised)) var(--shadow-lit);
    opacity: var(--raised);
    transform: scale(calc(0.94 + 0.06 * var(--raised)));
  }

  .wordmark {
    position: relative;   /* above the slab */
    z-index: 1;
    display: flex;
    align-items: baseline;
    /* Closes along with the words either side, so nothing is left holding the slab
       open once they have gone. */
    gap: calc(0.206em * (1 - var(--collapse)));
    visibility: hidden;
  }
  .wordmark.ready { visibility: visible; }

  .article,
  .noun {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    font-size: 0.441em;
    font-weight: 400;
    color: var(--muted);
    white-space: nowrap;
    /* They give up their width as well as their ink. Fading alone left them holding
       the row open, so the slab stayed as wide as the whole phrase around a name that
       no longer needed the room. Faded out by the time they are a third gone, so the
       narrowing is never seen cutting into a letter. */
    overflow: hidden;
    opacity: var(--fade);
  }
  .article { width: calc(var(--wa, 0px) * (1 - var(--collapse))); }
  .noun    { width: calc(var(--wn, 0px) * (1 - var(--collapse))); }

  .name {
    font-family: var(--face);
    /* Each face is scaled to sit at about the same width as the others, so the pill
       does not lurch between a wide one and a narrow one. The number is measured from
       the face itself once it has loaded, not guessed per font. */
    font-size: calc(1em * var(--face-scale, 1));
    font-weight: 400;
    letter-spacing: 0.044em;   /* 1.5pt at 34pt */
    color: var(--mark);
    white-space: nowrap;

    /* Squeezed to 80% of its width, as the app sets it. A transform does not change
       the space an element takes up, so the 10% left standing at each end is taken
       back below — measured, because the width depends on which Garamond the
       visitor's machine actually has. */
    display: inline-block;
    /* Only the Garamond original is squeezed: that narrowing is part of the mark, and
       applied to a display face drawn at its own proportions it would just look like
       a mistake. */
    transform: scaleX(var(--squeeze, 1));
  }

  /* ---- The icon, and the reveal that carries it in --------------------------- */

  /* It is not a picture of itself here. The file is a painted ground with one pane
     of glass over it, and the reveal has to take those two apart — so they are two
     elements, built the way Logo V4.icon builds them rather than flattened into a
     PNG. The pane is the ground's sibling and not its child: it arrives from well
     outside the icon's edges, and a child would be cut off at them.

     The numbers are measured out of the file. The pane artwork's ink is 488 x 892
     inside a 1024 canvas, placed at 0.7 — so 341.6 x 624.4pt, which is 0.3336 and
     0.6098 of the icon, dead centre in both directions. */
  /* A button, because it is one: pressing it opens the sheet beside it, and a button
     is the only version of that a keyboard can reach. Everything a button brings with
     it by default is given back — border, padding, its own font and ground — leaving
     just the behaviour.

     It is `disabled` until the reveal has finished, so the middle of the page is not
     quietly clickable while there is still nothing there to click. */
  .logo {
    position: absolute;
    left: 50%;
    top: 50%;
    translate: -50% -50%;
    width: var(--icon);
    height: var(--icon);
    appearance: none;
    border: 0;
    padding: 0;
    background: none;
    font: inherit;
    color: inherit;
    cursor: inherit;
    /* The stage refuses the pointer outright so it can never swallow a scroll, and
       that refusal is inherited — so the one thing on it meant to be pressed has to
       ask for the pointer back. */
    pointer-events: auto;
    /* So the pane's rotation is read as depth rather than as a squash: the stage
       holds the perspective, and this passes it down to the pane. */
    transform-style: preserve-3d;
    /* Steps aside to make room for the sheet, and comes back when it closes. */
    transform: translateX(0);
    transition: transform 0.52s cubic-bezier(0.2, 0.7, 0.3, 1), opacity 0.4s ease-out;
  }
  .logo[disabled] { pointer-events: none; }
  /* --sheet-real is what the sheet came out as, written back by measure(). The
     fallback is only for the first paint, before anything has been measured. */
  .stage.open .logo { transform: translateX(calc((var(--gap) + var(--sheet-real, 200px)) / -2)); }

  .icon {
    position: absolute;
    inset: 0;
    border-radius: calc(var(--icon) * 0.2237);
    overflow: hidden;
    /* The file's own base fill, which is what shows in the moment between the shape
       arriving and the painting coming up through it. */
    background: #eaf3ec;
    background: color(display-p3 0.92507 0.95 0.92843);
    opacity: var(--body);
    transform: scale(calc(0.94 + 0.06 * var(--body)));
    box-shadow:
      0 40px 80px -34px rgba(23, 28, 24, 0.38),
      0 2px 5px rgba(23, 28, 24, 0.07);
  }

  .ground {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: var(--bloom);
    /* Comes to rest rather than arriving at rest: a little over size, settling to
       its own. */
    transform: scale(calc(1.08 - 0.08 * var(--bloom)));
  }

  .pane {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 2;                 /* glass in front of the painting, never behind it */
    width: calc(var(--icon) * 0.3336);
    height: calc(var(--icon) * 0.6098);
    border-radius: calc(var(--icon) * 0.1);
    /* Opaque white while it is travelling, frosting back as the ground blooms so the
       colour ends up reading through it. */
    background: rgba(255, 255, 255, calc(1 - 0.66 * var(--bloom)));
    backdrop-filter: blur(18px) saturate(0.72) brightness(1.04);
    -webkit-backdrop-filter: blur(18px) saturate(0.72) brightness(1.04);
    box-shadow:
      0 26px 60px -28px rgba(23, 28, 24, 0.40),
      inset 0 0 0 1px rgba(255, 255, 255, 0.22);
    opacity: var(--arrive-o);
    transform:
      translate(-50%, -50%)
      translate3d(calc(72vw * (1 - var(--overshoot))),
                  calc(26px * (1 - var(--arrive))),
                  calc(-380px * (1 - var(--arrive))))
      rotateY(calc(-22deg * (1 - var(--arrive))))
      rotateZ(calc(4deg * (1 - var(--arrive))))
      scale(calc(0.88 + 0.12 * var(--arrive)));
    /* Out of focus while it is still a long way off. */
    filter: blur(calc(9px * (1 - var(--arrive))));
    will-change: transform, filter;
  }

  /* Underneath the icon, in the same square it occupies, and painted over by it
     because it comes first in the markup. Sweeping the icon aside is what uncovers
     it — the sense being that it was under there the whole time rather than that it
     has just been fetched. Rock Salt is already loaded for the wordmark, so a page
     written by hand costs nothing extra to ask for. */
  .notes {
    position: absolute;
    left: 50%;
    top: 50%;
    translate: -50% -50%;
    width: var(--icon);
    height: var(--icon);
    display: grid;
    place-items: center;
    font-family: "Rock Salt", "Bradley Hand", "Segoe Script", cursive;
    font-size: clamp(20px, 5vmin, 34px);
    line-height: 1.35;
    color: var(--mark);
    text-decoration: none;
    /* Written on the slant, the way a word jotted on a page sits. */
    transform: translateX(-16px) rotate(-3.5deg);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.52s cubic-bezier(0.2, 0.7, 0.3, 1), opacity 0.3s ease-out 0.06s;
  }
  .stage.peeled .notes {
    transform: translateX(0) rotate(-3.5deg);
    opacity: 1;
    pointer-events: auto;
  }
  /* Drawn rather than underlined: a line put there by the same hand. */
  .notes::after {
    content: "";
    position: absolute;
    left: 50%;
    translate: -50% 0;
    bottom: calc(50% - 1.5em);
    width: 3.1em;
    height: 0.34em;
    border-bottom: 2px solid currentColor;
    border-radius: 0 0 60% 40%;
    opacity: 0.5;
  }

  /* Swept aside, not deleted: it stays on the page, dimmed, and a swipe the other
     way brings it back. */
  .stage.peeled .logo {
    transform: translateX(calc(var(--icon) * -1)) rotate(-5deg);
    opacity: 0.32;
  }

  /* What the icon opens onto. It arrives from just behind the icon rather than from
     nowhere — twenty pixels of travel is enough to read as coming out from under it,
     and more would turn a disclosure into a journey. */
  .sheet {
    --sheet-x: calc((var(--icon) + var(--gap)) / 2);
    position: absolute;
    left: 50%;
    top: 50%;
    translate: -50% -50%;
    width: max-content;
    max-width: var(--sheet-max);
    /* Three lines of three different lengths. Ranged left they share a left edge and
       nothing else — and because the button's own label is centred inside its pill,
       the shortest line under it, the note, reads as having slipped. One centre line
       for all three, the same as when they stack under the icon on a narrow window. */
    text-align: center;
    transform: translateX(calc(var(--sheet-x) - 20px));
    opacity: 0;
    pointer-events: none;
    transition: transform 0.52s cubic-bezier(0.2, 0.7, 0.3, 1), opacity 0.34s ease-out;
  }
  .stage.open .sheet {
    transform: translateX(var(--sheet-x));
    opacity: 1;
    pointer-events: auto;
  }

  .sheet-name,
  .sheet-store,
  .sheet-note {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  }
  .sheet-name {
    font-size: clamp(19px, 2.3vw, 25px);
    font-weight: 500;
    letter-spacing: -0.012em;
    color: var(--mark);
  }
  /* The shape of the App Store's button, and deliberately not the thing itself: no
     href, no press, and not a control of any kind — there is nowhere for it to go
     yet. Saying so underneath is better than a button that looks live and does
     nothing when you press it. */
  .sheet-store {
    display: inline-block;
    margin-top: 18px;
    padding: 7px 22px;
    border-radius: 999px;
    background: #0071e3;
    color: #ffffff;
    font-size: 15px;
    font-weight: 500;
  }
  .sheet-note {
    margin-top: 11px;
    font-size: 13px;
    color: var(--muted);
  }

  /* Side by side needs somewhere to put them. Under about 700px there isn't, so the
     icon steps up instead of aside and the sheet comes out beneath it. */
  @media (max-width: 700px) {
    .sheet {
      --sheet-x: 0px;
      max-width: min(320px, 78vw);
      transform: translateY(calc(var(--icon) * 0.46 + 26px));
    }
    .stage.open .sheet { transform: translateY(calc(var(--icon) * 0.46 + 46px)); }
    .stage.open .logo { transform: translateY(calc(var(--icon) * -0.42)); }
  }

  /* The letters, as distinct from the box holding them: this is what slides aside
     when a face is swapped, leaving the squeeze above it untouched. */
  .ink { display: inline-block; }

  /* Nothing to look at — somewhere to measure from. An empty inline-block of no size
     sits with its top edge exactly on the baseline, which is the one line in the box
     the DOM will not otherwise tell you the position of. */
  .baseline { display: inline-block; width: 0; height: 0; }

  /* Whatever face is showing sits in the middle of a box that does not move — across
     and down. Each face has its own line box: a script face with long ascenders asks
     for half again the height of a plain one, and left to itself the pill grew and
     shrank on every swipe. */
  .plate {
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>
  <div class="scroller">
    <div class="stage">
      <div class="plate">
        <p class="wordmark">
          <span class="article">a</span><span class="name"><span class="ink">MALIK</span><span class="baseline"></span></span><span class="noun">product</span>
        </p>
      </div>
      <a class="notes" href="notes.html" tabindex="-1" aria-hidden="true">notes</a>
      <button class="logo" type="button" aria-expanded="false" aria-controls="sheet" disabled>
        <span class="icon"><img class="ground" src="logo-ground.jpg" alt="" decoding="async"></span>
        <span class="pane"></span>
      </button>
      <div class="sheet" id="sheet" aria-hidden="true">
        <p class="sheet-name">Yusuf&rsquo;s Preview</p>
        <p class="sheet-store">View in App Store</p>
        <p class="sheet-note">Not on the App Store yet.</p>
      </div>
    </div>
  </div>

<script>
  const root = document.documentElement;
  const ink = document.querySelector('.ink');
  const stage = document.querySelector('.stage');
  const plate = document.querySelector('.plate');
  const wordmark = document.querySelector('.wordmark');
  const name = document.querySelector('.name');
  const article = document.querySelector('.article');
  const noun = document.querySelector('.noun');
  const baseline = document.querySelector('.baseline');
  const logo = document.querySelector('.logo');
  const sheet = document.querySelector('.sheet');
  const notes = document.querySelector('.notes');

  /* One canvas, used wherever the question is where the paint actually falls rather
     than where the box around it does. */
  const gauge = document.createElement('canvas').getContext('2d');
  function inkOf(text) {
    const cs = getComputedStyle(name);
    gauge.font = `${parseFloat(cs.fontSize)}px ${cs.fontFamily}`;
    try { gauge.letterSpacing = cs.letterSpacing; } catch {}
    return gauge.measureText(text);
  }

  const clamp01 = (n) => Math.min(Math.max(n, 0), 1);
  const outCubic = (t) => 1 - Math.pow(1 - t, 3);
  /* Past the mark and back. The only thing on the page that overshoots, and only the
     pane's sideways travel rides it — everything else lands straight. */
  const outBack = (t) => { const c = 1.3; return 1 + (c + 1) * (t - 1) ** 3 + c * (t - 1) ** 2; };

  // `offsetWidth` is the laid-out width, which a transform leaves alone — so these are
  // the true widths, before the squeeze and before any sliding.
  function measure() {
    name.style.marginInline = '0';
    // The squeeze belongs to the Garamond original alone; the rest are drawn at their
    // own proportions and only the room it leaves standing has to be taken back.
    const squeeze = parseFloat(getComputedStyle(name).transform.split('(')[1]) || 1;

    // Across, the box the browser lays out is not the shape that gets painted inside
    // it. Letter spacing is added after the last letter as well as between them, and
    // every face carries its own side bearings on top of that — a brush script with a
    // flourish coming off the K reaches a long way past where its box stops. Centring
    // the box therefore does not centre the word: Rock Salt came out eight pixels
    // right of the middle of a pill measured to the pixel.
    //
    // So the box is placed by where the paint falls rather than by where the box
    // ends. Whatever room is left over goes half to each margin, and the squeeze is
    // in there because the margins move the box in layout space while the eye is
    // judging the scaled result.
    const w = name.offsetWidth;
    const across = inkOf('MALIK');
    const middleOfInk = (across.actualBoundingBoxRight - across.actualBoundingBoxLeft) / 2;
    const bias = squeeze * (w / 2 - middleOfInk);
    const pull = -w * (1 - squeeze) / 2;
    name.style.marginLeft = `${pull + bias}px`;
    name.style.marginRight = `${pull - bias}px`;

    // Their natural widths, so the collapse has somewhere to start from. Cleared
    // first, or each measurement would return the width the last one set.
    article.style.width = 'auto';
    noun.style.width = 'auto';
    root.style.setProperty('--wa', `${article.offsetWidth}px`);
    root.style.setProperty('--wn', `${noun.offsetWidth}px`);
    article.style.width = '';
    noun.style.width = '';

    /* Down the page, the same problem as across it: the box is centred, the ink in it
       is not. A line box is mostly air — ascender room above, descender room below —
       and MALIK is capitals with nothing under the baseline at all, so the letters
       ride high inside a box sitting dead centre. Left alone it reads as a name that
       has drifted up in its pill, which is exactly what it is.

       Measured, not reasoned about: the marker gives the baseline, the canvas gives
       how far the paint reaches either side of it, and the difference between where
       that puts the middle of the ink and where the middle of the pill is, is the
       nudge. The whole wordmark takes it rather than the name alone — "a" and
       "product" sit on that same baseline, and moving one of the three would break
       the line they share. */
    wordmark.style.translate = '0px';
    const down = inkOf('MALIK');
    const middleOfLetters = baseline.getBoundingClientRect().top
                          - (down.actualBoundingBoxAscent - down.actualBoundingBoxDescent) / 2;
    const box = plate.getBoundingClientRect();
    wordmark.style.translate = `0 ${(box.top + box.height / 2 - middleOfLetters).toFixed(2)}px`;

    // How wide the sheet turned out, so the icon knows how far to step aside for it.
    root.style.setProperty('--sheet-real', `${sheet.offsetWidth}px`);

    wordmark.classList.add('ready');
  }

  function frame() {
    const vh = window.innerHeight;
    // One scroll, read four ways. They all start together at the first pixel of it —
    // the mark begins climbing while the words are still fading, rather than waiting
    // for them to finish — and only differ in how soon each is done.
    const p = clamp01(window.scrollY / (vh * 0.9));
    // The ink goes first and the room it took goes second, because a word that is
    // still half visible while its box is closing gets sliced down the middle. Both
    // happen inside the opening fifth of the scroll, well before the climb is over —
    // nothing here waits for anything else to finish.
    root.style.setProperty('--fade', clamp01(1 - p / 0.18).toFixed(4));
    root.style.setProperty('--collapse', clamp01((p - 0.18) / 0.30).toFixed(4));
    root.style.setProperty('--raised', clamp01(p / 0.45).toFixed(4));
    root.style.setProperty('--lift', p.toFixed(4));
    /* ---- The reveal ---------------------------------------------------------- */

    // The room the reveal is read across is measured, not assumed: what is actually
    // left to scroll once the mark has taken its 0.9 of a window to climb. `svh` is
    // the short viewport and `innerHeight` is the tall one, so a page written in one
    // and a climb written in the other do not divide into each other the same way on
    // a phone as on a desktop. Measuring the leftover means the reveal fills whatever
    // room there turns out to be, and ends where the page does either way.
    //
    // The last 15% is left alone, so the icon is finished a little before the floor
    // rather than exactly on it.
    const room = Math.max((document.documentElement.scrollHeight - vh) - vh * 0.9, 1);
    const q = clamp01((window.scrollY - vh * 0.9) / (room * 0.85));

    // Four beats, in the proportions the preview build set: the pane comes across,
    // the icon's shape arrives behind it, the painting blooms up through the glass,
    // and the white frosts back to let the colour read. Each one begins while the one
    // before it is still going. The numbers are the preview's own, divided through by
    // the 0.86 it spent before its caption — the caption is not wanted here, and the
    // rest opens up to fill the room it was using.
    const t = clamp01(q / 0.605);
    root.style.setProperty('--arrive', outCubic(t).toFixed(4));
    root.style.setProperty('--overshoot', outBack(t).toFixed(4));
    // Its ink is in long before its travel is, or it would be seen arriving from off
    // the edge of the window rather than simply being there, coming.
    root.style.setProperty('--arrive-o', clamp01(q / 0.058).toFixed(4));
    root.style.setProperty('--body', outCubic(clamp01((q - 0.558) / 0.233)).toFixed(4));
    const bloom = outCubic(clamp01((q - 0.698) / 0.302));
    root.style.setProperty('--bloom', bloom.toFixed(4));

    // Only offered once the icon is actually there to press. And if the reveal is
    // scrolled back up the way it came, anything it opened closes behind it rather
    // than being left hanging in the middle of a page it no longer belongs to.
    const nowReady = bloom > 0.995;
    if (nowReady !== ready) {
      ready = nowReady;
      logo.disabled = !ready;
      if (!ready) { setOpen(false); setPeeled(false); }
    }

    // Swiping is only offered once the mark has arrived; on the way there the pill's
    // height belongs to the closing words, so any height pinned by a face swap is let
    // go of again.
    const wasParked = parked;
    parked = p > 0.999;

    if (!parked) {
      // On the way up the height belongs to the closing words, so anything pinned by
      // a face swap is let go of again. The width asks for none of this: its floor is
      // in the stylesheet and holds the whole way up.
      if (plate.style.height) plate.style.height = '';
    } else if (!wasParked) {
      // The moment it arrives, the height it has arrived at is the height it keeps.
      boxHeight = boxHeight ?? plate.offsetHeight;
      plate.style.height = `${boxHeight}px`;
    }

    // Half the room above the slab is how far it has to climb to reach the top of the
    // window; the perch is what stops it landing flush against the edge.
    const perch = parseFloat(getComputedStyle(root).getPropertyValue('--perch')) || 0;
    root.style.setProperty('--rise', `${-((stage.offsetHeight - plate.offsetHeight) / 2 - perch)}px`);
  }

  let queued = false;
  function onScroll() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; frame(); });
  }

  // Measured once the font is in hand: sizing against the fallback would set the
  // spacing for a face that is about to be replaced.
  (document.fonts?.ready ?? Promise.resolve()).then(() => {
    measure();
    frame();
    fitFaces();
  });

  /* ---- The faces, and swiping between them ------------------------------------ */

  // The original leads, so a swipe can always bring the mark itself back.
  const FACES = [
    { family: '"EB Garamond", Garamond, "Adobe Garamond Pro", "Hoefler Text", serif', squeeze: 0.8 },
    { family: '"Birthstone", cursive' },
    { family: '"Nanum Gothic", sans-serif' },
    { family: '"Audiowide", sans-serif' },
    { family: '"Hurricane", cursive' },
    { family: '"Explora", cursive' },
    { family: '"Qahiri", sans-serif' },
    { family: '"Barrio", cursive' },
    { family: '"Rock Salt", cursive' }
  ];

  let face = 0;
  let swapping = false;
  let parked = false;      // true once the mark has finished its climb
  /* The pill's height, taken once when the mark first arrives and then held. A script
     face with long ascenders asks for half again the line box of a plain one, and a
     box that breathes each time you swipe reads as the box being unsure of itself.
     Fixed, the faces change inside something that does not move. The width needs no
     such bookkeeping — the floor in the stylesheet is the same for every face, and
     every face fits inside it. */
  let boxHeight = null;
  /* How much room the broadest face needs once every face stands at the same height.
     The box is floored at this rather than at the original mark, so no face has to
     shrink to fit and the box still never changes. */
  let widestInk = 0;

  function applyFace(i) {
    const f = FACES[i];
    root.style.setProperty('--face', f.family);
    root.style.setProperty('--squeeze', f.squeeze ?? 1);
    root.style.setProperty('--face-scale', f.scale ?? 1);
    measure();

    // Only ever pinned once the mark is parked, and never before: pinning it at load
    // would record the height of the whole phrase, and a jump straight to the top
    // rather than a scroll never passes through the state that would let it go again.
    if (!parked) { plate.style.height = ''; return; }
    plate.style.height = `${boxHeight}px`;
  }

  /* One swipe moves one face, however hard it was thrown. A trackpad flick sends a
     long tail of events and a phone fling sends one; both have to count once. The
     lock is taken on the first event of a gesture and only released once the gesture
     has been quiet for a moment, so the tail is spent against a closed door. */
  function step(direction) {
    if (swapping || !parked) return;
    swapping = true;

    const away = `translateX(${-direction * 0.4}em)`;
    const from = `translateX(${direction * 0.4}em)`;

    ink.style.transition = 'transform 0.16s ease-in, opacity 0.16s ease-in';
    ink.style.transform = away;
    ink.style.opacity = '0';

    setTimeout(() => {
      face = (face + direction + FACES.length) % FACES.length;
      // Swapped while it cannot be seen, so the change of face is never caught in the
      // act — only its arrival is.
      applyFace(face);

      ink.style.transition = 'none';
      ink.style.transform = from;
      void ink.offsetWidth;                 // makes the jump take effect before the ride back
      ink.style.transition = 'transform 0.28s cubic-bezier(0.2, 0.7, 0.3, 1), opacity 0.28s ease-out';
      ink.style.transform = 'translateX(0)';
      ink.style.opacity = '1';

      setTimeout(() => { swapping = false; }, 290);
    }, 170);
  }

  /* Is this gesture aimed at the icon rather than at the page? Asked of the point,
     not of the element under it: once the icon has been swept aside it is no longer
     where it was, and the note that replaced it has to answer for the same square. */
  function onIcon(x, y) {
    if (!ready) return false;
    const inside = (b) => x >= b.left && x <= b.right && y >= b.top && y <= b.bottom;
    // The note never moves, and it occupies exactly the square the icon sits in when
    // it is home — so it stands in as the target even while the icon itself is still
    // in flight. Asking only where the icon is right now would mean a second swipe,
    // thrown before the first had finished, sailed past it and changed the face.
    return inside(notes.getBoundingClientRect())
        || inside(logo.getBoundingClientRect());
  }

  // Trackpad and mouse wheel.
  let wheelHeld = false;
  let wheelIdle;
  addEventListener('wheel', (e) => {
    // A mostly vertical wheel is someone scrolling the page, not choosing a face —
    // and it is left alone entirely, so ordinary scrolling is never intercepted.
    if (Math.abs(e.deltaX) <= Math.abs(e.deltaY) || Math.abs(e.deltaX) < 2) return;
    // Claimed outright. `overscroll-behavior` alone leaves a gap: a trackpad gesture
    // that begins before the browser has decided whose it is can still be taken as a
    // page-back, and there is no undoing that once it has happened.
    if (e.cancelable) e.preventDefault();
    clearTimeout(wheelIdle);
    wheelIdle = setTimeout(() => { wheelHeld = false; }, 220);
    if (wheelHeld) return;
    wheelHeld = true;
    // Over the icon the same gesture sweeps it aside instead of changing the face.
    if (onIcon(e.clientX, e.clientY)) { setPeeled(e.deltaX > 0); return; }
    step(e.deltaX > 0 ? 1 : -1);
    // Not passive, because a passive listener is forbidden from refusing the gesture.
  }, { passive: false });

  // Touch: one swipe, one face, by definition of the gesture.
  let touchX = null, touchY = null, touchFromIcon = false;
  addEventListener('touchstart', (e) => {
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
    // Decided where the finger lands, not where it lifts: the icon moves during the
    // gesture, and what was being aimed at is settled at the start.
    touchFromIcon = onIcon(touchX, touchY);
  }, { passive: true });
  addEventListener('touchend', (e) => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    const dy = e.changedTouches[0].clientY - touchY;
    touchX = touchY = null;
    if (Math.abs(dx) < 40 || Math.abs(dx) <= Math.abs(dy)) return;
    if (touchFromIcon) {
      setPeeled(dx < 0);
      // A swipe that ends on a button would otherwise be delivered as a tap as well,
      // and open the sheet on the way past.
      swiped = true;
      clearTimeout(swipeIdle);
      swipeIdle = setTimeout(() => { swiped = false; }, 400);
      return;
    }
    step(dx < 0 ? 1 : -1);
  }, { passive: true });

  // Arrow keys, so this is reachable without a trackpad.
  addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    // With the icon or the note itself focused, the arrows work the gesture rather
    // than the faces — so none of this needs a trackpad.
    if (ready && (document.activeElement === logo || document.activeElement === notes)) {
      setPeeled(e.key === 'ArrowLeft');
      return;
    }
    step(e.key === 'ArrowRight' ? 1 : -1);
  });

  /* Each face is measured once it has actually loaded and scaled towards the width of
     the original, so the pill stays about one size instead of stretching for the wide
     faces and shrinking for the narrow ones. Measured rather than tabulated: the
     numbers would otherwise be nine guesses that only hold for the fonts as they are
     today. */
  async function fitFaces() {
    /* Measured as ink, not as line boxes.
    
       A font's line box is mostly air above and below the letters, and how much air
       differs wildly between a text face and a brush script — so matching line boxes
       made the scripts sit tiny inside a box sized for their empty space. Canvas
       reports where the paint actually starts and stops, which is the only measure
       that answers the question being asked: does this look the same size as the
       other one. */
    const ctx = gauge;
    const PROBE = 100;   // the size everything is measured at, before being scaled

    const box = [];
    for (const f of FACES) {
      try { await document.fonts.load(`${PROBE}px ${f.family.split(',')[0]}`); } catch {}
      ctx.font = `${PROBE}px ${f.family}`;
      try { ctx.letterSpacing = '0.044em'; } catch {}
      const m = ctx.measureText('MALIK');
      box.push({
        w: (m.actualBoundingBoxRight + m.actualBoundingBoxLeft) * (f.squeeze ?? 1),
        h: m.actualBoundingBoxAscent + m.actualBoundingBoxDescent
      });
    }

    /* Height alone decides the scale, because height is what the eye compares when it
       asks whether two words are the same size.
    
       Width used to cap it as well, which quietly undid the whole exercise: the box
       had been cut to fit the original, so a broader face reached the ends of it and
       was shrunk — Audiowide and Hurricane ended up a fifth shorter than the rest for
       no reason the eye could see. The answer is to size the box for the broadest
       face rather than the first one, and let every face stand at full height inside
       a box that still never moves. */
    const target = box[0];
    FACES.forEach((f, i) => {
      f.scale = Math.min(Math.max(target.h / (box[i].h || 1), 0.4), 2.6);
    });

    // The room the broadest of them needs, once every face stands at the same height.
    // Held as a fraction of the probe's size rather than as pixels, because the mark
    // is not drawn at the size it was measured at — the window decides that.
    widestInk = Math.max(...FACES.map((f, i) => box[i].w * f.scale)) / PROBE * 1.03;
    root.style.setProperty('--floor', widestInk.toFixed(4));
    applyFace(face);
    // The floor changes how wide the pill is, and how wide it is decides how tall it
    // is and so how far it has to climb. Measured again now rather than left until
    // the next scroll event, which on a page opened part way down may never come.
    frame();
  }

  /* ---- Opening the icon -------------------------------------------------------- */

  let ready = false;
  let opened = false;
  let peeled = false;
  let swiped = false;
  let swipeIdle;

  /* Two things the icon can do, and it cannot be doing both: opening the sheet beside
     it and being swept off the note underneath it are alternatives, so each one puts
     the other away. */
  function setOpen(next) {
    if (next === opened) return;
    opened = next;
    stage.classList.toggle('open', opened);
    logo.setAttribute('aria-expanded', opened ? 'true' : 'false');
    sheet.setAttribute('aria-hidden', opened ? 'false' : 'true');
    if (opened) setPeeled(false);
  }

  function setPeeled(next) {
    if (next === peeled) return;
    peeled = next;
    stage.classList.toggle('peeled', peeled);
    notes.setAttribute('aria-hidden', peeled ? 'false' : 'true');
    // Out of the tab order while it is out of sight, so nothing invisible can be
    // reached by tabbing to it.
    notes.tabIndex = peeled ? 0 : -1;
    if (peeled) setOpen(false);
  }

  logo.addEventListener('click', () => {
    if (swiped) return;          // that was a swipe going past, not a tap
    setOpen(!opened);
  });
  // A way out that does not depend on finding the icon again.
  addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    setOpen(false);
    setPeeled(false);
  });

  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('resize', () => {
    boxHeight = null;
    plate.style.height = '';
    parked = false;
    measure();
    frame();
  });
</script>
</body>
</html>
