/* ---- timeline popup ---- */
var timeline = null;   /* {noteId, pageId?, blockId?, filter, mode} */

function timelineEntries(){
  var n = note(timeline.noteId);
  if(!n) return [];
  var list = (n.log || []).slice();
  list.reverse();                                   /* newest first */
  if(timeline.pageId)  list = list.filter(function(e){ return e.pageId === timeline.pageId; });
  if(timeline.blockId) list = list.filter(function(e){ return e.blockId === timeline.blockId; });
  if(timeline.pointId) list = list.filter(function(e){ return e.pointId === timeline.pointId; });
  if(timeline.filter === "done")  list = list.filter(function(e){ return e.kind === "done"; });
  if(timeline.filter === "edits") list = list.filter(function(e){ return e.kind === "edit" || e.kind === "add"; });
  return list;
}

var KIND_LABEL = {add:"added", edit:"edited", done:"done", undone:"reopened"};

function timelineScope(){
  var n = note(timeline.noteId);
  if(!n) return "";
  if(timeline.pointId){
    var pg0 = page(n, timeline.pageId);
    var b0 = pg0 && pg0.blocks.filter(function(x){ return x.id===timeline.blockId; })[0];
    var pt0 = b0 && findPoint(b0, timeline.pointId);
    return pt0 ? (pt0.text || "a point") : "this point";
  }
  if(timeline.blockId){
    var pg = page(n, timeline.pageId);
    var b = pg && pg.blocks.filter(function(x){ return x.id===timeline.blockId; })[0];
    return b ? blockLabel(b) : "this card";
  }
  if(timeline.pageId){
    var p2 = page(n, timeline.pageId);
    return p2 ? p2.title : "this page";
  }
  return n.title + " \u2014 all pages";
}

function seg(act, current, options){
  return '<div class="seg">' + options.map(function(o){
    return '<button class="segb'+(current===o[0]?" on":"")+'" data-act="'+act+'"'
      + ' data-v="'+o[0]+'">'+o[1]+'</button>';
  }).join("") + '</div>';
}

function timelineHTML(){
  var rows = timelineEntries();
  var body;
  if(!rows.length){
    body = '<div class="tlempty">Nothing recorded here yet.</div>';
  } else if(timeline.mode === "list"){
    body = rows.map(function(e){
      return '<button class="tlrow" data-act="tlGo" data-page="'+(e.pageId||"")+'">'
        + '<span class="tlwhen">'+esc(shortStamp(e.t))+'</span>'
        + '<span class="tlsec">'+esc(e.section||"\u2014")+'</span>'
        + '<span class="tltx"><em>'+esc(KIND_LABEL[e.kind]||e.kind)+'</em> '+esc(e.text)+'</span>'
        + '<span class="tlgo">\u2192</span></button>';
    }).join("");
  } else {
    var days = [], byDay = {};
    rows.forEach(function(e){
      var d = shortStamp(e.t).slice(0,8);
      if(!byDay[d]){ byDay[d] = []; days.push(d); }
      byDay[d].push(e);
    });
    body = '<div class="tlrail">' + days.map(function(d){
      return '<div class="tlday"><div class="tldate">'+esc(d)+'</div>'
        + byDay[d].map(function(e){
            return '<button class="tlitem" data-act="tlGo" data-page="'+(e.pageId||"")+'">'
              + '<span class="tldot"></span>'
              + '<span class="tlhm">'+esc(shortStamp(e.t).slice(9))+'</span>'
              + '<span class="tltx"><em>'+esc(KIND_LABEL[e.kind]||e.kind)+'</em> '+esc(e.text)
              + ' <span class="tlsec">'+esc(e.section||"")+'</span></span></button>';
          }).join("")
        + '</div>';
    }).join("") + '</div>';
  }

  return '<div class="tlback" data-act="tlClose"><div class="tlbox" data-act="tlNoop">'
    + '<div class="tlhead"><strong>Timeline</strong>'
    + '<span class="tlscope">'+esc(timelineScope())+'</span><span class="spacer"></span>'
    + seg("tlFilter", timeline.filter, [["all","all"],["done","Done"],["edits","edits"]])
    + seg("tlMode", timeline.mode, [["list","list"],["timeline","timeline"]])
    + '<button class="btn" data-act="tlClose">Close</button></div>'
    + '<div class="tlbody">'+body+'</div></div></div>';
}

/* ---- front ---- */
function viewFront(){
  var notes = db.notes.map(function(n){
    var pages = n.pages.length;
    var open = 0;
    n.pages.forEach(function(p){
      p.blocks.forEach(function(b){
        ensurePoints(b).forEach(function(pt){ if(pt.todo && !pt.done) open++; });
      });
    });
    return '<button class="row" data-act="openNote" data-note="'+n.id+'">'
      + '<span class="name">'+esc(n.title||"untitled")+'</span>'
      + '<span class="meta">'+pages+' page'+(pages===1?"":"s")
      + (open? ' · '+open+' to do':'')+'</span>'
      + '<span class="x" data-act="delNote" data-note="'+n.id+'" title="Delete note">✕</span>'
      + '</button>';
  }).join("");

  var groups = db.notes.map(function(n){
    var items = [];
    n.pages.forEach(function(p){
      p.blocks.forEach(function(b){
        ensurePoints(b).forEach(function(pt){
          if(!pt.todo) return;
          items.push('<button class="todo'+(pt.done?" is-done":"")+'" data-act="openPage"'
            + ' data-note="'+n.id+'" data-page="'+p.id+'">'
            + '<span class="box"></span>'
            + '<span class="t">'+esc(pt.text || "untitled")
            + ' <span class="where">'+esc(p.title)
            + (b.title ? ' · '+esc(b.title) : '')
            + (pt.person ? ' · '+esc(pt.person) : '')+'</span></span>'
            + '</button>');
        });
      });
    });
    if(!items.length) return "";
    return '<div class="todogroup"><h3>'+esc(n.title)+'</h3>'+items.join("")+'</div>';
  }).filter(Boolean).join("");

  return topbar('<span>index</span>')
  + '<div class="wrap"><div class="cols">'
    + '<div class="card"><h2>Notes<span class="spacer"></span>'
      + '<button class="btn" data-act="newNote">+ Note</button></h2>'
      + '<div class="rowlist">'+(notes || '<div class="empty">No notes yet.</div>')+'</div></div>'
    + '<div class="card"><h2>To do list</h2>'
      + (groups || '<div class="empty">Nothing marked “to do” yet.</div>')+'</div>'
  + '</div></div>';
}

/* ---- note map ---- */
var W=190, H=90, GX=60, GY=48, PAD=22;
var mapMinX=0, mapMinY=0;
/* the sideways nudge is drawing-only: it never touches structure or packing */
function visX(p){ return p.x + (p.xoff || 0); }
var PALETTE = [
  "#e79190","#eeaf78","#e9d484","#a5cf9f","#96bfe3","#bea3da",   /* basics */
  "#fadcdb","#fbe7d3","#faf2ce","#dcefd6","#dcebf7","#e9dff4"    /* pastels */
];

function viewNote(){
  var n = note(view.note);
  if(!n){ view={v:"front"}; return viewFront(); }

  var xs = n.pages.map(visX), ys = n.pages.map(function(p){return p.y;});
  var minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs);
  var minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
  mapMinX = minX; mapMinY = minY;
  var cw = (maxX-minX+1)*W + (maxX-minX)*GX + PAD*2;
  var ch = (maxY-minY+1)*H + (maxY-minY)*GY + PAD*2;

  function left(p){ return (visX(p)-minX)*(W+GX)+PAD; }
  function top(p){ return (p.y-minY)*(H+GY)+PAD; }

  var lines = n.edges.map(function(e){
    var a=page(n,e[0]), b=page(n,e[1]);
    if(!a||!b) return "";
    var ax=left(a)+W/2, ay=top(a)+H/2, bx=left(b)+W/2, by=top(b)+H/2;
    var stroke = ' stroke="var(--node-line)" stroke-width="1.5" fill="none"';
    if(a.x!==b.x && a.y!==b.y){
      /* Turn in the gap between the two tiles, so a branched sibling's line
         doesn't run along a row or column that already has a line in it. */
      var pts;
      if(b.dir==="down" || b.dir==="up"){
        var my=(ay+by)/2; pts=ax+' '+ay+', '+ax+' '+my+', '+bx+' '+my+', '+bx+' '+by;
      } else {
        var mx=(ax+bx)/2; pts=ax+' '+ay+', '+mx+' '+ay+', '+mx+' '+by+', '+bx+' '+by;
      }
      return '<polyline points="'+pts+'"'+stroke+'/>';
    }
    return '<line x1="'+ax+'" y1="'+ay+'" x2="'+bx+'" y2="'+by+'"'+stroke+'/>';
  }).join("");

  var nodes = n.pages.map(function(p){
    var count = p.blocks.length;
    var live = [];
    p.blocks.forEach(function(b){
      ensurePoints(b).forEach(function(pt){ if((pt.text||"").trim()) live.push(pt); });
    });
    var allDone = live.length > 0 && live.every(function(pt){ return pt.done; });
    var h = ["up","down","left","right"].map(function(d){
      var st = d==="up"   ? 'left:'+(W/2-10)+'px;top:-10px'
             : d==="down" ? 'left:'+(W/2-10)+'px;bottom:-10px'
             : d==="left" ? 'top:'+(H/2-10)+'px;left:-10px'
             :              'top:'+(H/2-10)+'px;right:-10px';
      return '<button class="handle" style="'+st+'" title="Add a page '+d
        + '" data-act="addPage" data-note="'+n.id+'" data-page="'+p.id+'" data-dir="'+d+'">+</button>';
    }).join("");
    var editing = (editingPageId === p.id);
    var shown = (editing && pendingColour !== undefined) ? pendingColour : p.color;
    var tint = shown ? ';background:'+shown : "";
    return '<div class="node'+(editing?" editing":"")+(shown?" tinted":"")+'"'
      + ' role="button" tabindex="0"'
      + ' style="left:'+left(p)+'px;top:'+top(p)
      + 'px;width:'+W+'px;height:'+H+'px'+tint+'"'
      + ' data-act="openPage" data-note="'+n.id+'" data-page="'+p.id+'">'
      + '<div class="nrow">'
        + (editing
            ? '<input class="nedit" data-act="nodeTitle" data-note="'+n.id+'" data-page="'+p.id
              + '" value="'+esc(p.title)+'">'
            : '<span class="nt">'+esc(p.title)+'</span>')
        + '<button class="npen" title="Rename this page" data-act="editPage"'
        + ' data-note="'+n.id+'" data-page="'+p.id+'">\u270E</button>'
        + '<button class="nodex" title="Delete this page" data-act="askDelPage"'
        + ' data-note="'+n.id+'" data-page="'+p.id+'">\u2715</button>'
      + '</div>'
      + '<span class="nc">'+(count? count+' card'+(count===1?"":"s") : "empty")
        + (allDone ? '<span class="donetag">\u2713 done</span>' : "")+'</span>'
      + (p.dir
          ? '<button class="spread" data-act="spread" data-note="'+n.id+'" data-page="'+p.id+'"'
            + ' title="Drag sideways to nudge this page and its children">'
            + "\u2194" + '</button>'
          : "")
      + (editing
          ? '<div class="swatches"><div class="swgrid">'
            + '<button class="swch none'+(pendingColour===""?" on":"")+'" data-act="colour"'
              + ' data-colour="" data-note="'+n.id+'" data-page="'+p.id+'" title="No colour"></button>'
            + PALETTE.map(function(col){
                var chosen = (pendingColour === undefined) ? p.color : pendingColour;
                return '<button class="swch'+(chosen===col?" on":"")+'" data-act="colour"'
                  + ' data-colour="'+col+'" data-note="'+n.id+'" data-page="'+p.id+'"'
                  + ' style="background:'+col+'"></button>';
              }).join("")
            + '<label class="swch wheel" title="Any colour">'
              + '<input type="color" data-act="colourPick" data-note="'+n.id+'" data-page="'+p.id+'"'
              + ' value="'+esc(p.color || "#88b3d6")+'"></label>'
            + '</div><div class="swrow">'
            + '<button class="btn swbtn" data-act="applyColour" data-scope="one"'
              + ' data-note="'+n.id+'" data-page="'+p.id+'">Apply</button>'
            + '<button class="btn swbtn" data-act="applyColour" data-scope="all"'
              + ' data-note="'+n.id+'" data-page="'+p.id+'">Apply to all</button>'
            + '</div></div>'
          : "")
      + '<button class="grip" data-act="grip" title="Drag to move this page">'
        + '<svg viewBox="0 0 22 14" width="15" height="10" aria-hidden="true">'
        + '<rect x="0" y="0" width="6" height="6" rx="2"/><rect x="8" y="0" width="6" height="6" rx="2"/>'
        + '<rect x="16" y="0" width="6" height="6" rx="2"/><rect x="0" y="8" width="6" height="6" rx="2"/>'
        + '<rect x="8" y="8" width="6" height="6" rx="2"/><rect x="16" y="8" width="6" height="6" rx="2"/>'
        + '</svg></button>'
      + h + '</div>';
  }).join("");

  return topbar('<button class="crumb" data-act="front">index</button><span class="sep">/</span>'
      + '<input class="titlefield" data-act="noteTitle" data-note="'+n.id+'" value="'+esc(n.title)+'"'
      + ' placeholder="name this note" title="This is the note name \u2014 click to rename it">',
      '<button class="btn" data-act="tlOpen" data-note="'+n.id+'"'
      + ' title="Every change across this note">Timeline</button>')
  + '<div class="wrap">'
    + '<div class="mapscroll"><div class="mapinner" data-bw="'+cw+'" data-bh="'+ch+'"'
    + ' style="width:'+cw+'px;height:'+ch+'px">'
    + '<svg width="'+cw+'" height="'+ch+'">'+lines+'</svg>'+nodes
    + '</div></div></div>';
}

function peopleOptions(n, current){
  return ['<option value=""'+(current?"":" selected")+'>—</option>']
    .concat(n.people.map(function(nm){
      return '<option'+(nm===current?" selected":"")+'>'+esc(nm)+'</option>';
    }))
    .concat(['<option value="__new">+ add name…</option>']).join("");
}

/* ---- page ---- */
function viewPage(){
  var n = note(view.note); if(!n){ view={v:"front"}; return viewFront(); }
  var p = page(n, view.page); if(!p){ view={v:"note",note:n.id}; return viewNote(); }

  var axes = { col: axis(n,p,"col"), row: axis(n,p,"row") };
  function arm(kind){
    var list = axes[kind];
    /* nothing connected along this axis: keep the bar, leave it empty, so the
       page content never shifts around depending on the shape of the map */
    var chips = list.length > 1 ? list.map(function(q){
      return '<button class="axischip'+(q.id===p.id?" on":"")+'"'
        + ' data-act="openPage" data-note="'+n.id+'" data-page="'+q.id+'">'+esc(q.title)+'</button>';
    }).join("") : "";
    return '<div class="arm '+kind+'"><span class="armlab">'
      + (kind==="col" ? "Column" : "Row") + '</span>' + chips + '</div>';
  }

  var blocks = p.blocks.map(function(b){
    var stamp = b.done && b.doneAt ? ' <span class="stamp">'+esc(shortStamp(b.doneAt))+'</span>' : "";
    return '<div class="block'+(b.done?" is-done":"")+'" data-block="'+b.id+'">'
      + '<button class="cgrip" data-act="cgrip" data-block="'+b.id+'"'
        + ' title="Drag to reorder this card">'
        + '<svg viewBox="0 0 14 22" width="10" height="15" aria-hidden="true">'
        + '<rect x="0" y="0" width="6" height="6" rx="2"/><rect x="8" y="0" width="6" height="6" rx="2"/>'
        + '<rect x="0" y="8" width="6" height="6" rx="2"/><rect x="8" y="8" width="6" height="6" rx="2"/>'
        + '<rect x="0" y="16" width="6" height="6" rx="2"/><rect x="8" y="16" width="6" height="6" rx="2"/>'
        + '</svg></button>'
      + '<div class="btop">'
        + '<input class="btitle" placeholder="title" value="'+esc(b.title)+'"'
          + ' data-act="bTitle" data-block="'+b.id+'">'
        + '<button class="clock" data-act="tlOpen" data-note="'+n.id+'" data-page="'+p.id+'"'
          + ' data-block="'+b.id+'" title="Changes to this card">\u25F4'
          + (lastTouched(n,b.id) ? ' <span class="stamp">'+esc(shortStamp(lastTouched(n,b.id)))+'</span>' : "")
          + '</button>'
      + '</div>'
      + '<div class="points">' + ensurePoints(b).map(function(pt){
          var when = pt.editedAt ? shortStamp(pt.editedAt) : "";
          return '<div class="pt'+(pt.done?" is-done":"")+'" data-point="'+pt.id+'"'
            + ' style="margin-left:'+((pt.depth||0)*26)+'px">'
            + '<button class="ptgrip" data-act="ptgrip" data-block="'+b.id+'" data-point="'+pt.id+'"'
              + ' title="Drag to reorder"><svg viewBox="0 0 14 14" width="9" height="9">'
              + '<rect x="0" y="0" width="6" height="6" rx="2"/><rect x="8" y="0" width="6" height="6" rx="2"/>'
              + '<rect x="0" y="8" width="6" height="6" rx="2"/><rect x="8" y="8" width="6" height="6" rx="2"/>'
              + '</svg></button>'
            + '<button class="ptdone" data-act="ptDone" data-block="'+b.id+'" data-point="'+pt.id+'"'
              + ' title="Mark this point done">'+(pt.done?"●":"○")+'</button>'
            + '<textarea class="pttx" rows="1" placeholder="point"'
              + ' data-act="ptText" data-block="'+b.id+'" data-point="'+pt.id+'">'
              + esc(pt.text)+'</textarea>'
            + '<span class="ptside">'
              + '<button class="pttodo'+(pt.todo?" on":"")+'" data-act="ptTodo" data-block="'+b.id+'"'
                + ' data-point="'+pt.id+'" title="Add to the to do list">to do</button>'
              + '<button class="ptdonebtn'+(pt.done?" on":"")+'" data-act="ptDone" data-block="'+b.id+'"'
                + ' data-point="'+pt.id+'" title="Mark this point done">done</button>'
              + '<select class="ptalloc" data-act="ptPerson" data-block="'+b.id+'" data-point="'+pt.id+'">'
                + peopleOptions(n, pt.person) + '</select>'
              + '<button class="ptclock" data-act="tlOpen" data-note="'+n.id+'" data-page="'+p.id+'"'
                + ' data-block="'+b.id+'" data-point="'+pt.id+'" title="Changes to this point">'
                + '◴'+(when?' <span class="stamp">'+esc(when)+'</span>':"")+'</button>'
              + '<button class="ptx" data-act="ptDel" data-block="'+b.id+'" data-point="'+pt.id+'"'
                + ' title="Delete this point">✕</button>'
            + '</span></div>';
        }).join("") + '</div>'
      + '<div class="bfoot">'
        + '<button class="toggle'+(b.done?" on":"")+'" data-act="bDone" data-block="'+b.id+'">'
          + '<span class="sw"></span>done</button>' + stamp
        + '<span class="spacer"></span>'
        + '<button class="x" style="opacity:.6" data-act="delBlock" data-block="'+b.id+'"'
          + ' title="Delete card">✕</button>'
      + '</div></div>';
  }).join("");

  return topbar('<button class="crumb" data-act="front">index</button><span class="sep">/</span>'
      + '<button class="crumb" data-act="openNote" data-note="'+n.id+'">'+esc(n.title)+'</button>'
      + '<span class="sep">/</span>'
      + '<input class="titlefield" data-act="pageTitle" data-note="'+n.id+'" data-page="'+p.id
      + '" value="'+esc(p.title)+'" placeholder="name this page"'
      + ' title="This is the page name \u2014 click to rename it">',
      '<button class="btn" data-act="tlOpen" data-note="'+n.id+'" data-page="'+p.id+'"'
      + ' title="Changes on this page">Timeline</button>'
)
  + '<div class="wrap"><div class="pageL">'
    + '<div class="corner"></div>'
    + arm("row")
    + arm("col")
    + '<div class="main">' + blocks
      + '<button class="addblock" data-act="addBlock">+ card</button></div>'
  + '</div></div>';
}

/* ============ undo ============ */
var undoStack = [], redoStack = [], typingUndoAt = 0, UNDO_MAX = 60;
var editingPageId = null, editStartTitle = "", pendingColour;

function applyColour(n, p, colour, all){
  pushUndo();
  var ids = all ? Object.keys(subtreeIds(n, p)) : [p.id];
  ids.forEach(function(id){
    var q = page(n, id);
    if(!q) return;
    if(colour) q.color = colour; else delete q.color;
  });
  save();
  render();
}
function exitEdit(){
  editingPageId = null;
  pendingColour = undefined;
  var sw = document.getElementById("swpop");
  if(sw) sw.remove();
  render();
}

function pushUndo(){
  undoStack.push(JSON.stringify(db));
  if(undoStack.length > UNDO_MAX) undoStack.shift();
  redoStack.length = 0;
}
function popUndo(){ undoStack.pop(); }   /* the action was cancelled after all */

/* Typing pushes one snapshot per burst, not one per keystroke. */
function typingUndo(){
  var now = Date.now();
  if(now - typingUndoAt > 900) pushUndo();
  typingUndoAt = now;
}

function applySnapshot(json){
  db = JSON.parse(json);
  dirty = true;
  typingUndoAt = 0;
  persist();
  render();
}
function undo(){
  if(!undoStack.length) return;
  redoStack.push(JSON.stringify(db));
  applySnapshot(undoStack.pop());
}
function redo(){
  if(!redoStack.length) return;
  undoStack.push(JSON.stringify(db));
  applySnapshot(redoStack.pop());
}

/* ============ dragging a tile to reorder it ============ */
/* A drag never sets a position. It re-links the tree: the tile is pulled out of
   its chain (its follower closes the gap) and spliced into the slot you dropped
   on. Its own children come with it. Positions are then recomputed as always. */

var drag = null;

function cellX(x){ return (x - mapMinX)*(W+GX) + PAD; }
function cellY(y){ return (y - mapMinY)*(H+GY) + PAD; }

function childInDir(n, p, d){
  var out = null;
  n.edges.forEach(function(e){
    if(e[0] !== p.id || out) return;
    var k = page(n, e[1]);
    if(k && k.dir === d) out = k;
  });
  return out;
}
function unlink(n, a, b){
  n.edges = n.edges.filter(function(e){ return !(e[0]===a.id && e[1]===b.id); });
}
function link(n, a, b){ n.edges.push([a.id, b.id]); }

function subtreeIds(n, p){
  var cm = childrenOf(n), out = {}, st = [p.id];
  while(st.length){
    var id = st.pop();
    if(out[id]) continue;
    out[id] = 1;
    (cm[id] || []).forEach(function(k){ st.push(k); });
  }
  return out;
}

/* What actually travels with a dragged tile: itself and everything hanging off
   it, EXCEPT the next tile along the same strand - that one is a peer in the
   row/column, and it closes the gap behind you rather than coming along. */
function movingSet(n, X, linkDir){
  var succ = childInDir(n, X, linkDir);
  var cm = childrenOf(n), out = {}, st = [X.id];
  while(st.length){
    var id = st.pop();
    if(out[id]) continue;
    out[id] = 1;
    (cm[id] || []).forEach(function(k){
      if(id === X.id && succ && k === succ.id) return;
      st.push(k);
    });
  }
  return out;
}

/* Pull X out of its chain; whoever followed X takes X's place. */
function detach(n, X, linkDir, takeChain){
  var pid = parentOf(n)[X.id];
  var par = pid ? page(n, pid) : null;
  if(par) unlink(n, par, X);
  if(takeChain) return;                 /* the rest of the strand comes along */
  var succ = childInDir(n, X, linkDir);
  if(succ){
    unlink(n, X, succ);
    if(par){ link(n, par, succ); succ.dir = X.dir; }
    else { succ.dir = null; }
  }
}

/* Pull X out on its own; its children are handed to whoever was above it. */
function soloDetach(n, X){
  var pid = parentOf(n)[X.id];
  var par = pid ? page(n, pid) : null;
  var kids = n.edges.filter(function(e){ return e[0]===X.id; }).map(function(e){ return e[1]; });
  if(par) unlink(n, par, X);
  kids.forEach(function(k){
    var kp = page(n, k);
    if(!kp) return;
    unlink(n, X, kp);
    if(par) link(n, par, kp);
    else kp.dir = null;
  });
}

/* Hang X off P in direction d, sitting at `index` among P's children in that
   direction. Sibling order is edge order, so P's edges get rewritten. */
function attachOrdered(n, P, X, d, index){
  X.dir = d;
  var notP = n.edges.filter(function(e){ return e[0] !== P.id; });
  var mine = n.edges.filter(function(e){ return e[0] === P.id; });
  var same = [], other = [];
  mine.forEach(function(e){
    var k = page(n, e[1]);
    (k && k.dir === d ? same : other).push(e);
  });
  same.splice(Math.max(0, Math.min(index, same.length)), 0, [P.id, X.id]);
  n.edges = notP.concat(other, same);
}

function moveToChild(n, X, P, d, index, takeChain, solo){
  if(solo) soloDetach(n, X);
  else detach(n, X, X.dir || d, takeChain);
  attachOrdered(n, P, X, d, index);
  relayout(n);
}

/* Splice X between prev and next along linkDir. */
function moveInto(n, X, prev, next, linkDir, takeChain, solo){
  if(solo) soloDetach(n, X);
  else detach(n, X, linkDir, takeChain);
  var tail = X;                          /* whatever came along ends here */
  if(!solo && takeChain){ var t; while((t = childInDir(n, tail, linkDir))) tail = t; }
  if(prev){
    var after = childInDir(n, prev, linkDir);
    if(after) unlink(n, prev, after);
    link(n, prev, X); X.dir = linkDir;
    if(after){ link(n, tail, after); after.dir = linkDir; }
  } else if(next){
    var pid = parentOf(n)[next.id];
    var par = pid ? page(n, pid) : null;
    X.dir = next.dir;
    if(par){ unlink(n, par, next); link(n, par, X); }
    else { X.dir = null; }
    link(n, tail, next); next.dir = linkDir;
  }
  relayout(n);
}

/* Every place the dragged tile could legally land. */
function buildSlots(n, X, solo){
  var slots = [];

  function addSlots(kind, groupKey, sortKey){
    var linkDir = kind === "row" ? "right" : "down";
    var groups = {};
    n.pages.forEach(function(q){
      if(q.id === X.id) return;
      var g = q[groupKey];
      (groups[g] = groups[g] || []).push(q);
    });
    Object.keys(groups).forEach(function(g){
      var list = groups[g].sort(function(a,b){ return a[sortKey] - b[sortKey]; });
      /* Shuffling along the strand you're already on is a reorder, and the tiles
         after you stay put. Landing anywhere else takes your strand with you. */
      var reorder = (+g === X[groupKey]);
      /* moving on its own, nothing travels with it, so nothing else is off-limits */
      var banned = solo ? {} : (reorder ? movingSet(n, X, linkDir) : subtreeIds(n, X));
      banned[X.id] = 1;
      for(var i=0;i<=list.length;i++){
        var prev = i>0 ? list[i-1] : null;
        var next = i<list.length ? list[i] : null;
        /* Dropping above the top of a column would make the dragged tile the
           parent of what's there. Say that by dropping underneath instead. */
        if(kind === "col" && !prev) continue;
        if(prev && banned[prev.id]) continue;
        if(next && banned[next.id]) continue;
        var cx, cy;
        if(kind === "row"){
          cy = cellY(+g) + H/2;
          cx = prev ? cellX(visX(prev)) + W + GX/2 : cellX(visX(next)) - GX/2;
        } else {
          cx = cellX(+g) + W/2;
          cy = prev ? cellY(prev.y) + H + GY/2 : cellY(next.y) - GY/2;
        }
        slots.push({kind:kind, linkDir:linkDir, prev:prev, next:next,
                    cx:cx, cy:cy, reorder:reorder});
      }
    });
  }
  addSlots("row", "y", "x");
  addSlots("col", "x", "y");

  /* One level up: instead of joining a tile's strand, become a child of the tile
     above. These sit in the band between a parent and its children, so nudging
     the drop upward promotes it. */
  var moving = solo ? {} : subtreeIds(n, X);
  moving[X.id] = 1;
  n.pages.forEach(function(P){
    if(moving[P.id]) return;
    ["down","right"].forEach(function(d){
      var kids = (childrenOf(n)[P.id] || []).map(function(k){ return page(n,k); })
        .filter(function(k){ return k && k.dir === d && k.id !== X.id; });
      kids.sort(function(a,b){ return d === "down" ? a.x-b.x : a.y-b.y; });
      for(var i=0;i<=kids.length;i++){
        var cx, cy;
        if(d === "down"){
          cy = cellY(P.y) + H + GY/2;
          cx = !kids.length ? cellX(visX(P)) + W/2
             : i === 0 ? cellX(visX(kids[0])) - GX/2
             : i === kids.length ? cellX(visX(kids[i-1])) + W + GX/2
             : (cellX(visX(kids[i-1])) + W + cellX(visX(kids[i]))) / 2;
        } else {
          cx = cellX(visX(P)) + W + GX/2;
          cy = !kids.length ? cellY(P.y) + H/2
             : i === 0 ? cellY(kids[0].y) - GY/2
             : i === kids.length ? cellY(kids[i-1].y) + H + GY/2
             : (cellY(kids[i-1].y) + H + cellY(kids[i].y)) / 2;
        }
        slots.push({branch:true, parent:P, dir:d, index:i, cx:cx, cy:cy});
      }
    });
  });
  slots.push({original:true, cx:cellX(visX(X))+W/2, cy:cellY(X.y)+H/2});
  return slots;
}

/* Apply the pending move to a throwaway copy of the note, so we can draw the
   arrangement it would produce - every tile, every connector - before you let go. */
function previewOf(n, X, slot){
  var clone = JSON.parse(JSON.stringify(n));
  function find(id){ return clone.pages.filter(function(q){ return q.id===id; })[0] || null; }
  var cx = find(X.id);
  if(!cx) return null;
  if(slot.original) return clone;         /* unchanged: this is the "put it back" state */
  if(slot.branch){
    var cp = find(slot.parent.id);
    if(!cp) return null;
    moveToChild(clone, cx, cp, slot.dir, slot.index, !drag.solo, drag.solo);
    return clone;
  }
  moveInto(clone, cx, slot.prev ? find(slot.prev.id) : null,
                     slot.next ? find(slot.next.id) : null,
                     slot.linkDir, !slot.reorder && !drag.solo, drag.solo);
  return clone;
}

function paintPreview(){
  var layer = drag.layer;
  if(!drag.slot){
    layer.innerHTML = "";
    drag.inner.classList.remove("previewing");
    return;
  }
  var pv = previewOf(drag.n, drag.p, drag.slot);
  if(!pv){ layer.innerHTML = ""; return; }
  drag.inner.classList.add("previewing");

  var xs = pv.pages.map(visX), ys = pv.pages.map(function(q){ return q.y; });
  var mnX = Math.min.apply(null, xs), mxX = Math.max.apply(null, xs);
  var mnY = Math.min.apply(null, ys), mxY = Math.max.apply(null, ys);
  var px = function(q){ return (visX(q)-mnX)*(W+GX)+PAD; };
  var py = function(q){ return (q.y-mnY)*(H+GY)+PAD; };
  var cw = (mxX-mnX+1)*W + (mxX-mnX)*GX + PAD*2;
  var ch = (mxY-mnY+1)*H + (mxY-mnY)*GY + PAD*2;

  var byId = {}; pv.pages.forEach(function(q){ byId[q.id]=q; });
  var lines = pv.edges.map(function(e){
    var a=byId[e[0]], b=byId[e[1]];
    if(!a||!b) return "";
    var ax=px(a)+W/2, ay=py(a)+H/2, bx=px(b)+W/2, by=py(b)+H/2;
    var st = ' stroke="var(--accent)" stroke-width="1.5" fill="none" opacity=".85"';
    if(a.x!==b.x && a.y!==b.y){
      var pts = (b.dir==="down"||b.dir==="up")
        ? (function(){ var my=(ay+by)/2; return ax+' '+ay+', '+ax+' '+my+', '+bx+' '+my+', '+bx+' '+by; })()
        : (function(){ var mx=(ax+bx)/2; return ax+' '+ay+', '+mx+' '+ay+', '+mx+' '+by+', '+bx+' '+by; })();
      return '<polyline points="'+pts+'"'+st+'/>';
    }
    return '<line x1="'+ax+'" y1="'+ay+'" x2="'+bx+'" y2="'+by+'"'+st+'/>';
  }).join("");

  var tiles = pv.pages.map(function(q){
    var mark = q.id!==drag.p.id ? "" : (drag.slot.original ? " origin" : " moved");
    return '<div class="pvnode'+mark+'" style="left:'+px(q)
      + 'px;top:'+py(q)+'px;width:'+W+'px;height:'+H+'px"><span>'+esc(q.title)+'</span></div>';
  }).join("");

  layer.style.width = cw+"px"; layer.style.height = ch+"px";
  layer.innerHTML = '<svg width="'+cw+'" height="'+ch+'">'+lines+'</svg>'+tiles;
  drag.inner.style.minWidth = Math.max(cw, parseInt(drag.inner.style.minWidth,10)||0)+"px";
  drag.inner.style.minHeight = Math.max(ch, parseInt(drag.inner.style.minHeight,10)||0)+"px";
}

var spread = null, cardDrag = null, ptDrag = null;

/* a point carries everything indented under it */
function pointRun(pts, i){
  var n = 1, d = pts[i].depth || 0;
  while(i + n < pts.length && (pts[i+n].depth || 0) > d) n++;
  return n;
}

app.addEventListener("mousedown", function(e){
  if(e.button === 0){
    var pg = e.target.closest && e.target.closest(".ptgrip");
    if(pg){
      e.preventDefault();
      var pc = ctx(pg);
      if(!pc.b || !pc.pt) return;
      ptDrag = { n:pc.n, b:pc.b, id:pc.pt.id, pushed:false };
      document.body.style.cursor = "grabbing";
      return;
    }
    var cg = e.target.closest && e.target.closest(".cgrip");
    if(cg){
      e.preventDefault();
      var cn = note(view.note), cp = cn && page(cn, view.page);
      if(!cn || !cp) return;
      cardDrag = { n:cn, p:cp, id:cg.getAttribute("data-block"), pushed:false };
      var el = cg.closest(".block");
      if(el) el.classList.add("cdragging");
      document.body.style.cursor = "grabbing";
      return;
    }
  }
  if(e.button !== 0) return;
  /* keep the caret in the rename box while picking a colour */
  if(e.target.closest && e.target.closest(".swatches")){ e.preventDefault(); return; }

  var sp = e.target.closest && e.target.closest(".spread");
  if(sp){
    e.preventDefault();
    var sn = note(sp.getAttribute("data-note"));
    var spg = sn && page(sn, sp.getAttribute("data-page"));
    if(!sn || !spg || !spg.dir) return;
    spread = { n:sn, p:spg, sx:e.clientX, start:(spg.xoff || 0), pushed:false };
    document.body.style.cursor = "ew-resize";
    return;
  }

  var g = e.target.closest && e.target.closest(".grip");
  if(!g) return;
  e.preventDefault();
  var nodeEl = g.closest(".node"), inner = app.querySelector(".mapinner");
  var n = note(nodeEl.getAttribute("data-note"));
  var p = n && page(n, nodeEl.getAttribute("data-page"));
  if(!n || !p || !inner) return;

  var layer = document.createElement("div");
  layer.className = "previewlayer";
  inner.appendChild(layer);

  drag = { n:n, p:p, el:nodeEl, layer:layer, inner:inner, scroller:inner.parentNode,
           solo:(e.metaKey || e.ctrlKey),
           slots:buildSlots(n, p, e.metaKey || e.ctrlKey),
           slot:null, lastSlot:undefined, moved:false,
           sx:e.clientX, sy:e.clientY, px:e.clientX, py:e.clientY };
  nodeEl.classList.add("dragging");
  drag.autoTimer = setInterval(function(){
    if(!drag || !drag.moved) return;
    var r = drag.scroller.getBoundingClientRect(), edge = 70, step = 14, moved = false;
    if(drag.px > r.right - edge){ drag.scroller.scrollLeft += step; moved = true; }
    else if(drag.px < r.left + edge){ drag.scroller.scrollLeft -= step; moved = true; }
    if(drag.py > r.bottom - edge){ drag.scroller.scrollTop += step; moved = true; }
    else if(drag.py < r.top + edge){ drag.scroller.scrollTop -= step; moved = true; }
    if(moved) pickSlot();
  }, 30);
  drag.scroller.classList.add("dragging");
});

function pickSlot(){
  var r = drag.inner.getBoundingClientRect();
  var px = drag.px - r.left, py = drag.py - r.top, best = null, bestD = Infinity;
  drag.slots.forEach(function(s){
    var d = (s.cx-px)*(s.cx-px) + (s.cy-py)*(s.cy-py);
    if(d < bestD){ bestD = d; best = s; }
  });
  var home = drag.slots[drag.slots.length-1];
  drag.slot = (bestD <= 320*320) ? best : home;   /* nothing near: offer its old spot */
  if(drag.slot !== drag.lastSlot){ drag.lastSlot = drag.slot; paintPreview(); }
}

document.addEventListener("mousemove", function(e){
  if(ptDrag){
    var rows = [].slice.call(app.querySelectorAll('.block[data-block="'+ptDrag.b.id+'"] .pt'));
    if(!rows.length) return;
    var to = rows.length - 1;
    for(var r0=0;r0<rows.length;r0++){
      var rr = rows[r0].getBoundingClientRect();
      if(e.clientY < rr.top + rr.height/2){ to = r0; break; }
    }
    var pts = ptDrag.b.points, from = -1;
    for(var q=0;q<pts.length;q++) if(pts[q].id === ptDrag.id) from = q;
    if(from < 0) return;
    var run = pointRun(pts, from);
    if(to >= from && to < from + run) return;          /* inside its own run */
    if(!ptDrag.pushed){ pushUndo(); ptDrag.pushed = true; }
    var moving = pts.splice(from, run);
    var dest = to > from ? to - run + 1 : to;
    Array.prototype.splice.apply(pts, [Math.max(0, dest), 0].concat(moving));
    save();
    render();
    return;
  }
  if(cardDrag){
    var cards = [].slice.call(app.querySelectorAll(".block"));
    if(!cards.length) return;
    var to = cards.length - 1;
    for(var i=0;i<cards.length;i++){
      var r = cards[i].getBoundingClientRect();
      if(e.clientY < r.top + r.height/2){ to = i; break; }
    }
    var blocks = cardDrag.p.blocks;
    var from = -1;
    for(var j=0;j<blocks.length;j++) if(blocks[j].id === cardDrag.id) from = j;
    if(from < 0 || from === to) return;
    if(!cardDrag.pushed){ pushUndo(); cardDrag.pushed = true; }
    blocks.splice(to, 0, blocks.splice(from, 1)[0]);
    save();
    render();
    var moved = app.querySelector('.block[data-block="'+cardDrag.id+'"]');
    if(moved) moved.classList.add("cdragging");
    return;
  }
  if(spread){
    /* purely visual: shifts where it sits, never who it belongs to */
    var g = spread.start + Math.round((e.clientX - spread.sx) / (W + GX));
    if(g !== (spread.p.xoff || 0)){
      if(!spread.pushed){ pushUndo(); spread.pushed = true; }
      spread.p.xoff = g;
      relayout(spread.n);
      save();
      render();
    }
    return;
  }
  if(!drag) return;
  var solo = !!(e.metaKey || e.ctrlKey);
  if(solo !== drag.solo){                       /* modifier flipped: rebuild the options */
    drag.solo = solo;
    drag.slots = buildSlots(drag.n, drag.p, solo);
    drag.lastSlot = undefined;
  }
  drag.px = e.clientX; drag.py = e.clientY;
  var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if(!drag.moved && (Math.abs(dx) > 3 || Math.abs(dy) > 3)) drag.moved = true;
  drag.el.style.transform = "translate("+dx+"px,"+dy+"px)";
  if(!drag.moved) return;
  pickSlot();
});

function endDrag(apply){
  var d = drag; drag = null;
  d.el.style.transform = "";
  d.el.classList.remove("dragging");
  d.inner.classList.remove("previewing");
  d.inner.style.minWidth = ""; d.inner.style.minHeight = "";
  padCanvas(d.scroller);
  if(d.autoTimer) clearInterval(d.autoTimer);
  if(d.layer.parentNode) d.layer.parentNode.removeChild(d.layer);
  var s = d.slot;
  var keep = !apply || !d.moved || !s || s.original
          || (!s.branch && ((s.prev && s.prev.id === d.p.id) || (s.next && s.next.id === d.p.id)));
  if(keep){ render(); return; }
  pushUndo();
  if(s.branch) moveToChild(d.n, d.p, s.parent, s.dir, s.index, !d.solo, d.solo);
  else moveInto(d.n, d.p, s.prev, s.next, s.linkDir, !s.reorder && !d.solo, d.solo);
  save();
  render();
}

document.addEventListener("mouseup", function(){
  if(ptDrag){ ptDrag = null; document.body.style.cursor = ""; render(); return; }
  if(cardDrag){
    cardDrag = null;
    document.body.style.cursor = "";
    render();
    return;
  }
  if(spread){ spread = null; document.body.style.cursor = ""; return; }
  if(drag) endDrag(true);
});

/* ============ right-click menu ============ */
function closeMenu(){
  var m = document.getElementById("ctxmenu");
  if(m) m.remove();
}

function openMenu(x, y, items){
  closeMenu();
  var m = document.createElement("div");
  m.id = "ctxmenu";
  m.className = "ctxmenu";
  m.innerHTML = items.map(function(it){
    return '<button class="ctxitem'+(it.danger?" danger":"")+'" data-i="'+it.i+'">'
      + esc(it.label)+'</button>';
  }).join("");
  m.style.left = "0px"; m.style.top = "0px";
  document.body.appendChild(m);
  /* keep it on screen */
  var r = m.getBoundingClientRect();
  m.style.left = Math.min(x, window.innerWidth  - r.width  - 8) + "px";
  m.style.top  = Math.min(y, window.innerHeight - r.height - 8) + "px";
  m.addEventListener("click", function(e){
    var b = e.target.closest(".ctxitem");
    if(!b) return;
    e.stopPropagation();
    var chosen = items[+b.getAttribute("data-i")];
    closeMenu();
    chosen.run();
  });
}
document.addEventListener("click", closeMenu);
document.addEventListener("click", function(e){
  if(!fileMenuOpen) return;
  if(e.target.closest && e.target.closest(".savewrap")) return;
  fileMenuOpen = false;
  render();
});
document.addEventListener("scroll", closeMenu, true);
window.addEventListener("blur", closeMenu);

function confirmDeletePage(n, p){
  if(n.pages.length === 1){ alert("A note needs at least one page."); return; }
  var filled = p.blocks.filter(function(b){ return b.title || b.body || b.todo; }).length;
  var msg = filled
    ? 'Delete "'+p.title+'" and its '+filled+' card'+(filled===1?"":"s")+'?'
    : 'Delete "'+p.title+'"?';
  if(!confirm(msg)) return;
  pushUndo();
  deletePage(n, p.id);
  save();
  render();
}

/* ============ events ============ */
var NEEDS_PAGE = {addPage:1, askDelPage:1, delPage:1, openPage:1, editPage:1,
                  addBlock:1, delBlock:1, bTodo:1, bDone:1, ptDone:1, ptDel:1,
                  spread:1, cgrip:1};
var NEEDS_BLOCK = {delBlock:1, bTodo:1, bDone:1, ptDone:1, ptDel:1};

function ctx(el){
  var n = el.getAttribute("data-note") ? note(el.getAttribute("data-note")) : note(view.note);
  var p = null, b = null;
  if(n){
    p = el.getAttribute("data-page") ? page(n, el.getAttribute("data-page"))
      : (view.v==="page" ? page(n, view.page) : null);
    if(p && el.getAttribute("data-block")){
      b = p.blocks.filter(function(x){return x.id===el.getAttribute("data-block");})[0];
    }
  }
  var pt = null;
  if(b && el.getAttribute("data-point")) pt = findPoint(b, el.getAttribute("data-point"));
  return {n:n,p:p,b:b,pt:pt};
}

app.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if(!el) return;
  var act = el.getAttribute("data-act");
  if(el.tagName==="INPUT" || el.tagName==="TEXTAREA" || el.tagName==="SELECT") return;
  e.stopPropagation();
  var c = ctx(el);
  /* a stale id (a click landing on markup from a previous render) must not crash.
     Only guard actions that actually need those things - front-page buttons
     like Save file have no note context at all. */
  if(NEEDS_PAGE[act] && (!c.n || !c.p)) return;
  if(NEEDS_BLOCK[act] && !c.b) return;

  switch(act){
    case "theme": setTheme(resolvedTheme() === "dark" ? "light" : "dark"); break;
    case "fileMenu": fileMenuOpen = !fileMenuOpen; break;
    case "help": fileMenuOpen = false; helpOpen = true; break;
    case "helpClose": helpOpen = false; break;

    case "tlOpen":
      timeline = { noteId: c.n.id,
                   pageId: el.getAttribute("data-page") || null,
                   blockId: el.getAttribute("data-block") || null,
                   pointId: el.getAttribute("data-point") || null,
                   filter: "all", mode: "list" };
      break;
    case "tlClose": timeline = null; break;
    case "tlNoop": return;
    case "tlFilter": timeline.filter = el.getAttribute("data-v"); break;
    case "tlMode": timeline.mode = el.getAttribute("data-v"); break;
    case "tlGo":
      var gp = el.getAttribute("data-page");
      timeline = null;
      if(gp && page(c.n, gp)) view = {v:"page", note:c.n.id, page:gp};
      break;

    case "front": editingPageId=null; view={v:"front"}; break;
    case "openNote": editingPageId=null; view={v:"note",note:c.n.id}; break;
    case "openPage": editingPageId=null; view={v:"page",note:c.n.id,page:c.p.id}; break;

    case "editPage":
      editingPageId=c.p.id; editStartTitle=c.p.title; pendingColour=undefined; break;

    case "newNote":
      pushUndo();
      var nn = newNote(db.notes.length+1);
      db.notes.push(nn); view={v:"note",note:nn.id}; save(); break;

    case "delNote":
      if(!confirm('Delete "'+c.n.title+'" and all of its pages?')) return;
      pushUndo();
      db.notes = db.notes.filter(function(x){return x.id!==c.n.id;}); save(); break;

    case "askDelPage": confirmDeletePage(c.n, c.p); return;

    case "addPage":
      pushUndo();
      var np = addPage(c.n, c.p, el.getAttribute("data-dir"));
      editingPageId = np.id; editStartTitle = np.title;
      logChange(c.n, "add", {pageId:np.id, section:np.title, text:"new page"});
      save(); break;

    case "delPage":
      if(c.n.pages.length===1){ alert("A note needs at least one page."); return; }
      if(!confirm('Delete "'+c.p.title+'"?')) return;
      pushUndo();
      deletePage(c.n, c.p.id); view={v:"note",note:c.n.id}; save(); break;

    case "addBlock":
      pushUndo();
      var nb = newBlock();
      c.p.blocks.unshift(nb);
      logChange(c.n, "add", {pageId:c.p.id, blockId:nb.id, section:c.p.title, text:"new card"});
      save(); break;

    case "ptDone":
      if(!c.pt) return;
      pushUndo();
      c.pt.done = !c.pt.done;
      if(c.pt.done) c.pt.doneAt = Date.now(); else delete c.pt.doneAt;
      logChange(c.n, c.pt.done ? "done" : "undone",
                {pageId:c.p.id, blockId:c.b.id, pointId:c.pt.id,
                 section:c.p.title, text:(c.pt.text || "a point")});
      save(); break;

    case "ptTodo":
      if(!c.pt) return;
      pushUndo();
      c.pt.todo = !c.pt.todo;
      save(); break;

    case "ptDel":
      if(!c.pt) return;
      pushUndo();
      c.b.points = c.b.points.filter(function(x){ return x.id !== c.pt.id; });
      if(!c.b.points.length) c.b.points.push(newPoint(""));
      save(); break;

    case "delBlock":
      pushUndo();
      c.p.blocks = c.p.blocks.filter(function(x){return x.id!==c.b.id;}); save(); break;

    case "bTodo": pushUndo(); c.b.todo = !c.b.todo; save(); break;
    case "bDone":
      pushUndo();
      c.b.done = !c.b.done;
      if(c.b.done){ c.b.todo = true; c.b.doneAt = Date.now(); }
      else delete c.b.doneAt;
      logChange(c.n, c.b.done ? "done" : "undone",
                {pageId:c.p.id, blockId:c.b.id, section:c.p.title, text:blockLabel(c.b)});
      save(); break;

    case "saveFile": fileMenuOpen = false; saveFile(); return;
    case "export": fileMenuOpen = false; doExport(); render(); return;
    case "import": fileMenuOpen = false; render(); document.getElementById("importer").click(); return;
    default: return;
  }
  render();
});

app.addEventListener("contextmenu", function(e){
  var el = e.target.closest(".node");
  if(!el || e.target.closest(".handle")) return;
  e.preventDefault();
  var c = ctx(el);
  if(!c.n || !c.p) return;
  var n = c.n, pg = c.p;
  openMenu(e.clientX, e.clientY, [
    { i:0, label:"Open",   run:function(){ view={v:"page",note:n.id,page:pg.id}; render(); } },
    { i:1, label:"Rename\u2026", run:function(){
        pushUndo(); editingPageId = pg.id; editStartTitle = pg.title;
        pendingColour = undefined; render();
      } },
    { i:2, label:"Delete", danger:true, run:function(){ confirmDeletePage(n, pg); } }
  ]);
});

/* Renaming can't re-render (it would eat the caret), so patch the mirrors by hand. */
function syncPageTitle(pid, t){
  var chips = document.querySelectorAll('.axischip[data-page="'+pid+'"]');
  for(var i=0;i<chips.length;i++) chips[i].textContent = t;
  var nts = document.querySelectorAll('.node[data-page="'+pid+'"] .nt');
  for(var j=0;j<nts.length;j++) nts[j].textContent = t;
}
function syncNoteTitle(nid, t){
  var cr = document.querySelectorAll('.crumb[data-note="'+nid+'"]');
  for(var i=0;i<cr.length;i++) cr[i].textContent = t;
}

app.addEventListener("input", function(e){
  var el = e.target.closest("[data-act]"); if(!el) return;
  var act = el.getAttribute("data-act"), c = ctx(el);
  if(act==="noteTitle" || act==="pageTitle" || act==="bTitle" || act==="bBody"
     || act==="nodeTitle" || act==="ptText") typingUndo();
  if(act==="noteTitle"){ c.n.title = el.value; syncNoteTitle(c.n.id, el.value); }
  else if(act==="pageTitle" || act==="nodeTitle"){
    c.p.title = el.value;
    syncPageTitle(c.p.id, el.value);
    logChange(c.n, "edit", {pageId:c.p.id, section:c.p.title, text:"renamed page"});
  }
  else if(act==="ptText"){
    if(!c.pt) return;
    c.pt.text = el.value;
    c.pt.editedAt = Date.now();
    grow(el);
    logChange(c.n, "edit", {pageId:c.p.id, blockId:c.b.id, pointId:c.pt.id,
                            section:c.p.title, text:(c.pt.text || "empty point")});
  }
  else if(act==="bTitle"){
    c.b.title = el.value;
    logChange(c.n, "edit", {pageId:c.p.id, blockId:c.b.id, section:c.p.title, text:blockLabel(c.b)});
  }
  else if(act==="bBody"){
    c.b.body = el.value; grow(el);
    logChange(c.n, "edit", {pageId:c.p.id, blockId:c.b.id, section:c.p.title, text:blockLabel(c.b)});
  }
  else return;
  save();   /* no re-render: keeps the caret where it is */
});

app.addEventListener("change", function(e){
  var el = e.target.closest('[data-act="bPerson"],[data-act="ptPerson"]'); if(!el) return;
  var isPoint = el.getAttribute("data-act") === "ptPerson";
  var c = ctx(el);
  if(isPoint && !c.pt) return;
  pushUndo();
  var target = isPoint ? c.pt : c.b;
  if(el.value==="__new"){
    var nm = (prompt("Name?")||"").trim();
    if(nm){
      if(c.n.people.indexOf(nm)===-1){ c.n.people.push(nm); c.n.people.sort(); }
      target.person = nm;
    }
  } else {
    target.person = el.value;
  }
  save(); render();
});

var focusPointId = null;

app.addEventListener("keydown", function(e){
  var pin = e.target.closest && e.target.closest(".pttx");
  if(pin){
    var c = ctx(pin);
    if(!c.b || !c.pt) return;
    var pts = c.b.points, i = pts.indexOf(c.pt);
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      pushUndo();
      var np = newPoint("", c.pt.depth || 0);
      pts.splice(i+1, 0, np);
      focusPointId = np.id;
      save(); render();
    } else if(e.key === "Tab"){
      e.preventDefault();
      pushUndo();
      var above = pts[i-1];
      var ceiling = above ? (above.depth || 0) + 1 : 0;   /* no skipping levels */
      c.pt.depth = Math.max(0, Math.min((c.pt.depth || 0) + 1, ceiling, 8));
      focusPointId = c.pt.id;
      save(); render();
    } else if(e.key === "Backspace" && pin.selectionStart === 0 && pin.selectionEnd === 0){
      /* at the very start: step out a level first, then merge away */
      if(c.pt.depth > 0){
        e.preventDefault();
        pushUndo();
        c.pt.depth = c.pt.depth - 1;
        focusPointId = c.pt.id;
        save(); render();
      } else if(pin.value === "" && pts.length > 1){
        e.preventDefault();
        pushUndo();
        pts.splice(i, 1);
        focusPointId = (pts[i-1] || pts[0]).id;
        save(); render();
      }
    }
    return;
  }
  var inp = e.target.closest && e.target.closest(".nedit");
  if(inp){
    if(e.key === "Enter"){ e.preventDefault(); e.stopPropagation(); exitEdit(); }
    else if(e.key === "Escape"){
      e.preventDefault(); e.stopPropagation();
      var c = ctx(inp);
      if(c.p){ c.p.title = editStartTitle; syncPageTitle(c.p.id, editStartTitle); save(); }
      exitEdit();
    }
    return;
  }
  if(e.key!=="Enter" && e.key!==" ") return;
  var n = e.target.closest('.node'); if(!n) return;
  e.preventDefault(); n.click();
});

app.addEventListener("focusout", function(e){
  if(!e.target.classList || !e.target.classList.contains("nedit")) return;
  var id = e.target.getAttribute("data-page");
  setTimeout(function(){          /* let a click on another pencil win first */
    var a = document.activeElement;
    if(editingPageId === id && !(a && a.classList && a.classList.contains("nedit"))) exitEdit();
  }, 0);
});

document.addEventListener("keydown", function(e){
  if(drag && e.key === "Escape"){ e.preventDefault(); endDrag(false); return; }
  var mod = e.metaKey || e.ctrlKey;
  if(mod && (e.key === "z" || e.key === "Z")){
    e.preventDefault();
    if(e.shiftKey) redo(); else undo();
    return;
  }
  if(mod && (e.key === "y" || e.key === "Y")){ e.preventDefault(); redo(); return; }

  if(e.key === "Escape" && helpOpen){ e.preventDefault(); helpOpen = false; render(); return; }
  if(e.key === "Escape" && timeline){ e.preventDefault(); timeline = null; render(); return; }
  if(e.key!=="Escape") return;
  var t = e.target.tagName;
  if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT"){ e.target.blur(); return; }
  if(view.v==="page"){ view={v:"note",note:view.note}; render(); }
  else if(view.v==="note"){ view={v:"front"}; render(); }
});

/* ============ export / import ============ */
function download(text, name, mime){
  var blob = new Blob([text], {type:mime});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

/* Serialise the whole page back out, with the notes baked into #seed.
   The result is a single file that is both the app and the data. */
function saveFile(){
  var appEl = document.getElementById("app");
  var seedEl = document.getElementById("seed");
  var keep = appEl.innerHTML;
  var wasDirty = dirty, wasLast = db.lastFileSave;
  try{
    db.lastFileSave = Date.now();
    appEl.innerHTML = "";                       /* ship a clean shell, not this render */
    dirty = false;
    seedEl.textContent = JSON.stringify(db).replace(/</g,"\\u003c");
    download("<!doctype html>\n" + document.documentElement.outerHTML,
             "notes.html", "text/html");
  }catch(e){
    dirty = wasDirty; db.lastFileSave = wasLast;
    alert("Couldn't build the file: " + e.message);
  }finally{
    appEl.innerHTML = keep;
  }
  persist();
  render();
}

function doExport(){
  var d = new Date(), pad = function(v){ return String(v).padStart(2,"0"); };
  download(JSON.stringify(db,null,2),
           "notes-" + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + ".json",
           "application/json");
}

document.getElementById("importer").addEventListener("change", function(e){
  var f = e.target.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.notes)) throw new Error("not a notes file");
      if(!confirm("Replace everything currently in this app with the contents of "+f.name+"?")) return;
      pushUndo();
      db = d; view = {v:"front"}; save(); render();
    }catch(err){ alert("Couldn't read that file: "+err.message); }
  };
  r.readAsText(f);
  e.target.value = "";
});

window.addEventListener("beforeunload", function(e){
  if(!dirty) return;
  if(storageOK) return;          /* storage has it; closing is safe */
  e.preventDefault(); e.returnValue = "";
});

document.documentElement.setAttribute("data-theme", resolvedTheme());
db.notes.forEach(function(n){ relayout(n); });
render();
</script>
