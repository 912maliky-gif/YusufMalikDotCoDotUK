<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yusuf's Notes</title>
<style>
:root{
  --bg:#d2e7d6; --panel:#ffffff; --ink:#17281a; --muted:#5b7360;
  --line:#c0d8c6; --line2:#a4c2ab; --accent:#2f6b3a; --accent-soft:#e0f0e4; --accent-ink:#ffffff;
  --node:#e9f4ec; --node-line:#bcd7c3; --danger:#a8412f; --done:#8fa694;
  --icon:#7c7c7a; --icon-hi:#17281a;
  --radius:8px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 12px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141614; --panel:#1d201e; --ink:#e9ece8; --muted:#8b918c;
  --line:#2a2e2b; --line2:#3b413c; --accent:#8fd39a; --accent-soft:#222a23; --accent-ink:#0f2213;
  --node:#232723; --node-line:#343935; --danger:#e08b72; --done:#787e79;
  --icon:#8f948f; --icon-hi:#e9ece8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#141614; --panel:#1d201e; --ink:#e9ece8; --muted:#8b918c;
  --line:#2a2e2b; --line2:#3b413c; --accent:#8fd39a; --accent-soft:#222a23; --accent-ink:#0f2213;
  --node:#232723; --node-line:#343935; --danger:#e08b72; --done:#787e79;
  --icon:#8f948f; --icon-hi:#e9ece8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
input,textarea,select{font:inherit;color:inherit}

/* ---------- chrome ---------- */
.top{display:flex;align-items:center;gap:12px;padding:10px clamp(10px,1.4vw,24px);border-bottom:1px solid var(--line);
  background:var(--panel);position:sticky;top:0;z-index:20}
.brand{font-weight:640;letter-spacing:-.01em;white-space:nowrap}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--muted);min-width:0}
.crumb{background:none;border-radius:5px;padding:3px 7px;margin-left:-7px;white-space:nowrap}
.crumb:hover{background:var(--bg);color:var(--ink)}
.sep{opacity:.5}
.top .spacer{flex:1}
.btn{border:1px solid var(--line2);border-radius:6px;padding:5px 11px;background:var(--panel);
  color:var(--muted);white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.dot{font-size:9px;vertical-align:middle;opacity:.85}
.savewrap{position:relative;display:inline-flex}
.savebtn{display:inline-flex;align-items:center;gap:8px;padding-right:0}
.savebtn .caret{display:inline-flex;align-items:center;align-self:stretch;
  padding:0 10px;margin:-6px 0 -6px 2px;font-size:9px;
  border-left:1px solid rgba(0,0,0,.18);border-radius:0 5px 5px 0}
.savebtn .caret:hover{background:rgba(0,0,0,.12)}
.btn.primary.clean .caret{border-left-color:var(--line2)}
.filemenu{position:absolute;top:calc(100% + 6px);right:0;z-index:90;min-width:150px;
  display:flex;flex-direction:column;padding:4px;background:var(--panel);
  border:1px solid var(--line2);border-radius:7px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.fmi{padding:7px 10px;border-radius:5px;text-align:left;font-size:13px;color:var(--ink)}
.fmi:hover{background:var(--accent-soft)}
.themebtn{position:relative;width:34px;height:28px;flex:none;overflow:hidden;
  border:1px solid var(--line2);border-radius:6px;background:var(--panel)}
.themebtn i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-style:normal;color:var(--icon);
  transition:transform .24s cubic-bezier(.35,0,.25,1),opacity .2s ease}
.themebtn:hover i{color:var(--ink)}
.themebtn .sun{transform:translateY(0);opacity:1}
.themebtn .moon{transform:translateY(130%);opacity:0}
.themebtn:hover .sun{transform:translateY(130%);opacity:0}
.themebtn:hover .moon{transform:translateY(0);opacity:1;transition-delay:.06s}
.themebtn.is-dark .sun{transform:translateY(130%);opacity:0}
.themebtn.is-dark .moon{transform:translateY(0);opacity:1}
.themebtn.is-dark:hover .moon{transform:translateY(130%);opacity:0}
.themebtn.is-dark:hover .sun{transform:translateY(0);opacity:1;transition-delay:.06s}
@media (prefers-reduced-motion:reduce){ .themebtn i{transition:none} }
.savedat{font-size:12px;color:var(--muted);white-space:nowrap;margin-right:2px}
.savedat.stale{color:var(--danger);font-weight:640}
.btn.primary.clean{background:none;border-color:var(--line2);color:var(--muted);font-weight:400}
.btn.primary.clean:hover{color:var(--ink);border-color:var(--muted)}
.btn.primary.stale{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.primary.stale:hover{filter:brightness(1.1);color:#fff}
@media (max-width:700px){.savedat{display:none}}
@media (max-width:900px){.brand,.top>.sep{display:none}}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.titlefield{font:inherit;font-size:15px;font-weight:640;background:none;border:1px solid transparent;
  border-radius:5px;padding:3px 7px;min-width:8ch;max-width:36ch}
.titlefield:hover{border-color:var(--line)}
.titlefield:focus{outline:none;border-color:var(--accent);background:var(--panel)}

.wrap{max-width:none;margin:0;padding:14px clamp(10px,1.4vw,24px) 32px}
.pageL{display:grid;grid-template-columns:158px minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr);gap:14px;align-items:start}
.corner{grid-column:1;grid-row:1}
.arm{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:8px;display:flex;gap:5px}
.arm.row{grid-column:2;grid-row:1;flex-direction:row;flex-wrap:wrap;align-items:center;min-height:53px}
.arm.col{grid-column:1;grid-row:2;flex-direction:column;position:sticky;top:74px;min-height:53px}
.armlab{font-size:10px;font-weight:660;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:3px 6px;flex:none}
.arm.col .armlab{border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:2px}
.arm.row .armlab{border-right:1px solid var(--line);padding-right:9px;margin-right:3px}
.axischip{padding:5px 10px;border-radius:5px;color:var(--muted);text-align:left;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.axischip:hover{background:var(--bg);color:var(--ink)}
.axischip.on{background:var(--accent-soft);color:var(--ink);font-weight:660}
.arm.col .axischip.on{border-left:2px solid var(--accent)}
.arm.row .axischip.on{border-bottom:2px solid var(--accent)}
.main{grid-column:2;grid-row:2;min-width:0}
@media (max-width:760px){
  .pageL{grid-template-columns:1fr}
  .corner{display:none}
  .arm.row,.arm.col,.main{grid-column:1;grid-row:auto}
  .arm.col{flex-direction:row;flex-wrap:wrap;align-items:center;position:static}
  .arm.col .armlab{border-bottom:none;border-right:1px solid var(--line);
    padding:3px 9px 3px 6px;margin:0 3px 0 0}
  .arm.row{order:1}.arm.col{order:2}.main{order:3}
}
.warn{background:#8a2f1c;color:#fff;padding:8px clamp(10px,1.4vw,24px);font-size:13px;
  display:flex;align-items:center;gap:10px}
.warn b{font-weight:660}
.warn button{border:1px solid rgba(255,255,255,.5);border-radius:5px;padding:2px 9px;color:#fff}

/* ---------- front ---------- */
.cols{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.35fr);gap:26px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card>h2{margin:0;padding:13px 16px;font-size:12px;font-weight:660;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px}
.card>h2 .spacer{flex:1}
.rowlist{padding:6px}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:6px;text-align:left}
.row:hover{background:var(--bg)}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{color:var(--muted);font-size:12px;white-space:nowrap}
.x{color:var(--muted);opacity:0;padding:2px 5px;border-radius:4px;line-height:1}
.row:hover .x{opacity:.7}
.x:hover{opacity:1;color:var(--danger)}
.empty{padding:22px 16px;color:var(--muted);font-style:italic}

.todogroup{padding:12px 16px;border-bottom:1px solid var(--line)}
.todogroup:last-child{border-bottom:none}
.todogroup h3{margin:0 0 8px;font-size:13px;font-weight:640}
.todo{display:flex;gap:9px;align-items:flex-start;width:100%;padding:5px 6px;border-radius:5px;text-align:left}
.todo:hover{background:var(--bg)}
.todo .box{flex:none;width:14px;height:14px;margin-top:3px;border:1.5px solid var(--line2);border-radius:3px}
.todo.is-done .box{background:var(--done);border-color:var(--done)}
.todo.is-done .t{color:var(--done);text-decoration:line-through}
.todo .t{flex:1;min-width:0}
.todo .where{color:var(--muted);font-size:12px}

/* ---------- map ---------- */
.mapscroll{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow)}
.mapinner{position:relative}
.mapinner > svg{position:absolute;inset:0;pointer-events:none}
.node{position:absolute;background:var(--node);border:1px solid var(--node-line);border-radius:var(--radius);
  padding:12px 14px;text-align:left;display:flex;flex-direction:column}
.node{cursor:pointer;font:inherit;color:inherit;justify-content:flex-start;gap:7px}
.node:hover{border-color:var(--accent)}
.node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.node:focus-within .handle{opacity:1}
.nrow{display:flex;align-items:center;gap:4px;
  border-bottom:1px solid var(--node-line);padding-bottom:7px}
.node .nt{font-weight:620;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nedit{flex:1;min-width:0;font:inherit;font-weight:620;background:var(--panel);color:var(--ink);
  border:1px solid var(--accent);border-radius:4px;padding:1px 5px;margin:-2px 0}
.nedit:focus{outline:none}
.node.tinted{color:#1c1c1a;border-color:rgba(0,0,0,.18)}
.node.tinted .nc{color:rgba(0,0,0,.55)}
.node.tinted .nrow{border-bottom-color:rgba(0,0,0,.18)}
.node.tinted .npen,.node.tinted .nodex,.node.tinted .grip,.node.tinted .spread{color:rgba(0,0,0,.45)}
.node.tinted .npen:hover,.node.tinted .grip:hover,.node.tinted .spread:hover{color:#1c1c1a}
.swatches{position:absolute;z-index:70;padding:8px;
  background:var(--panel);border:1px solid var(--line2);border-radius:7px;
  box-shadow:0 6px 20px rgba(0,0,0,.25)}
.swgrid{display:grid;grid-template-columns:repeat(7,20px);gap:5px}
.swrow{display:flex;gap:6px;margin-top:8px}
.swbtn{flex:1;padding:4px 6px;font-size:12px;text-align:center}
.swch{width:20px;height:20px;border-radius:5px;border:1px solid rgba(0,0,0,.2);padding:0}
.swch:hover{transform:scale(1.15)}
.swch.on{box-shadow:0 0 0 2px var(--accent)}
.swch.wheel{position:relative;overflow:hidden;padding:0;
  background:conic-gradient(#e79190,#eeaf78,#e9d484,#a5cf9f,#96bfe3,#bea3da,#e79190)}
.swch.wheel input{position:absolute;inset:-4px;width:200%;height:200%;border:none;
  padding:0;background:none;opacity:0;cursor:pointer}
.swch.none{background:var(--bg);position:relative}
.swch.none::after{content:"";position:absolute;left:2px;right:2px;top:9px;height:1.5px;
  background:var(--danger);transform:rotate(-45deg)}
.spread{position:absolute;bottom:26px;right:8px;padding:2px 4px;border-radius:5px;
  color:var(--icon);font-size:13px;line-height:1;cursor:ew-resize}
.spread:hover{color:var(--icon-hi)}
.grip{position:absolute;bottom:4px;right:6px;padding:6px;border-radius:5px;
  color:var(--icon);display:flex;align-items:center;justify-content:center;
  cursor:grab;line-height:0}
.grip svg{fill:currentColor;display:block}
.grip:hover{color:var(--icon-hi)}
.grip:active{cursor:grabbing}
.node.dragging{opacity:.85;z-index:20;box-shadow:0 10px 28px rgba(0,0,0,.3);cursor:grabbing}
.previewlayer{position:absolute;left:0;top:0;pointer-events:none;z-index:8}
.previewlayer svg{position:absolute;inset:0}
.pvnode{position:absolute;border:2px dashed var(--accent);border-radius:var(--radius);
  background:var(--accent-soft);display:flex;align-items:center;padding:0 14px;
  font-weight:620;color:var(--ink);overflow:hidden}
.pvnode span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvnode.moved{background:var(--accent);color:var(--accent-ink);border-style:solid}
.pvnode.origin{background:transparent;border-color:var(--line2);color:var(--muted)}
.mapinner.previewing > .node,.mapinner.previewing > svg{opacity:0}
.mapinner.previewing > .node.dragging{opacity:.45;pointer-events:none}
.npen{flex:none;color:var(--icon);font-size:13px;line-height:1;padding:2px 4px;border-radius:4px}
.npen:hover{color:var(--icon-hi);background:var(--panel)}
.node.editing .npen,.node.editing .handle,.node.editing .spread,.node.editing .grip{display:none}
@keyframes jiggle{
  0%{transform:rotate(-.65deg)}
  50%{transform:rotate(.65deg)}
  100%{transform:rotate(-.65deg)}
}
.node.editing{animation:jiggle .21s ease-in-out infinite;z-index:14}
@media (prefers-reduced-motion:reduce){ .node.editing{animation:none} }
.node .nc{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.donetag{padding:1px 7px;border-radius:20px;font-size:11px;font-weight:620;
  background:var(--accent);color:var(--accent-ink)}
.node.tinted .donetag{background:rgba(0,0,0,.55);color:#fff}
.nodex{flex:none;width:19px;height:19px;border-radius:4px;color:var(--icon);
  font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;
  opacity:0;z-index:4;display:none}
.nodex:hover{opacity:1;background:var(--danger);color:#fff}
.ctxmenu{position:fixed;z-index:100;min-width:148px;padding:4px;
  background:var(--panel);border:1px solid var(--line2);border-radius:7px;
  box-shadow:0 6px 24px rgba(0,0,0,.18)}
.ctxitem{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:4px;font-size:13px}
.ctxitem:hover{background:var(--accent-soft)}
.ctxitem.danger{color:var(--danger)}
.ctxitem.danger:hover{background:var(--danger);color:#fff}
.handle{position:absolute;width:20px;height:20px;border-radius:50%;border:1px solid var(--line2);
  background:var(--panel);color:var(--icon);font-size:14px;line-height:1;display:flex;
  align-items:center;justify-content:center;opacity:0;z-index:3}
.node:hover .handle,.handle:focus{opacity:1}
.handle:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);opacity:1}

/* ---------- page ---------- */

.points{margin-top:4px}
.ptgrip{flex:none;padding:3px;border-radius:4px;color:var(--icon);cursor:grab;
  line-height:0;opacity:0}
.ptgrip svg{fill:currentColor;display:block}
.pt:hover .ptgrip{opacity:.7}
.ptgrip:hover{opacity:1;color:var(--icon-hi)}
.pttodo{flex:none;padding:2px 8px;border-radius:20px;font-size:11px;
  border:1px solid var(--line2);color:var(--muted)}
.pttodo:hover{color:var(--ink);border-color:var(--muted)}
.pttodo.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:620}
.ptdonebtn{flex:none;padding:2px 8px;border-radius:20px;font-size:11px;
  border:1px solid var(--line2);color:var(--muted)}
.ptdonebtn:hover{color:var(--ink);border-color:var(--muted)}
.ptdonebtn.on{background:var(--done);border-color:var(--done);color:var(--panel);font-weight:620}
.pt{display:flex;align-items:flex-start;gap:6px;padding:3px 0;border-radius:5px}
.pt:hover{background:var(--bg)}
.ptdone{flex:none;width:18px;height:18px;margin-top:2px;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--icon);border-radius:50%}
.ptdone:hover{color:var(--accent)}
.pt.is-done .ptdone{color:var(--accent)}
.pt.is-done .pttx{color:var(--done);text-decoration:line-through}
.pttx{flex:1;min-width:0;background:none;border:none;padding:2px 2px;line-height:1.5;
  resize:none;overflow:hidden;font:inherit;color:inherit}
.pttx:focus{outline:none}
.pttx::placeholder{color:var(--muted);opacity:.6}
.ptside{flex:none;display:flex;align-items:center;gap:5px;opacity:0;margin-top:1px}
.pt:hover .ptside,.pt:focus-within .ptside{opacity:1}
.pt.is-done .ptside,.pt:has(.pttodo.on) .ptside{opacity:1}
.ptalloc{background:var(--bg);border:1px solid var(--line);border-radius:5px;
  padding:1px 4px;font-size:12px;color:var(--muted);max-width:11ch}
.ptclock{display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:5px;
  color:var(--icon);font-size:12px;white-space:nowrap}
.ptclock:hover{color:var(--icon-hi);background:var(--panel)}
.ptx{padding:2px 5px;border-radius:5px;color:var(--icon);font-size:11px}
.ptx:hover{color:#fff;background:var(--danger)}
.pthint{margin-top:8px;font-size:11px;color:var(--muted);opacity:.75}

.btop{display:flex;align-items:center;gap:8px}
.btop .btitle{flex:1;min-width:0}
.clock{flex:none;display:flex;align-items:center;gap:5px;padding:3px 7px;border-radius:5px;
  color:var(--icon);font-size:12px;white-space:nowrap}
.clock:hover{color:var(--icon-hi);background:var(--bg)}

.tlback{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;
  display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px}
.tlbox{width:min(820px,100%);max-height:88vh;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line2);border-radius:10px;
  box-shadow:0 18px 50px rgba(0,0,0,.4);overflow:hidden}
.tlhead{display:flex;align-items:center;gap:10px;padding:12px 14px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.tlscope{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:34ch}
.tlhead .spacer{flex:1}
.seg{display:flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.segb{padding:5px 11px;font-size:13px;color:var(--muted)}
.segb+.segb{border-left:1px solid var(--line2)}
.segb:hover{color:var(--ink);background:var(--bg)}
.segb.on{background:var(--accent);color:var(--accent-ink);font-weight:620}
.tlbody{overflow:auto;padding:8px}
.tlbox.help .tlbody{padding:16px 20px 22px}
.hlead{margin:0 0 18px;color:var(--muted);line-height:1.6}
.hsec{margin-bottom:20px}
.hsec h3{margin:0 0 8px;font-size:11px;font-weight:660;letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent)}
.hsec dl{margin:0;display:grid;grid-template-columns:minmax(120px,220px) 1fr;
  gap:6px 16px;align-items:baseline}
.hsec dt{font-weight:620;font-size:13px}
.hsec dd{margin:0;color:var(--muted);font-size:13px}
@media (max-width:560px){.hsec dl{grid-template-columns:1fr;gap:2px}
  .hsec dd{margin-bottom:8px}}
.tlempty{padding:26px 14px;color:var(--muted);font-style:italic;text-align:center}
.tlrow{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;
  padding:9px 10px;border-radius:6px}
.tlrow:hover{background:var(--bg)}
.tlwhen{flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tlsec{flex:none;font-size:12px;color:var(--accent);max-width:18ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.tltx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tltx em{font-style:normal;color:var(--muted);font-size:12px;margin-right:4px}
.tlgo{flex:none;color:var(--muted);opacity:0}
.tlrow:hover .tlgo{opacity:1}
.tlrail{padding:4px 6px}
.tlday{margin-bottom:14px}
.tldate{font-size:11px;font-weight:660;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);margin:0 0 6px 4px}
.tlitem{position:relative;display:flex;align-items:baseline;gap:10px;width:100%;
  text-align:left;padding:7px 10px 7px 22px;border-radius:6px;border-left:2px solid var(--line2);
  margin-left:8px}
.tlitem:hover{background:var(--bg)}
.tldot{position:absolute;left:-5px;top:12px;width:8px;height:8px;border-radius:50%;
  background:var(--accent);border:2px solid var(--panel)}
.tlhm{flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.cgrip{position:absolute;top:12px;right:12px;padding:4px;border-radius:5px;
  color:var(--icon);cursor:grab;line-height:0;opacity:0}
.cgrip svg{fill:currentColor;display:block}
.block:hover .cgrip{opacity:.75}
.cgrip:hover{opacity:1;color:var(--icon-hi)}
.block.cdragging{opacity:.5}
.stamp{font-size:11px;color:var(--muted);white-space:nowrap}
.block{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px 34px 14px 16px;margin-bottom:14px}
.block.is-done{opacity:.5}
.block.is-done .btitle{text-decoration:line-through}
.btitle{width:100%;font-size:15px;font-weight:620;background:none;border:none;padding:2px 0;margin-bottom:2px}
.btitle:focus{outline:none}
.bbody{width:100%;background:none;border:none;resize:none;padding:2px 0;line-height:1.55;
  overflow:hidden;min-height:24px}
.bbody:focus{outline:none}
.btitle::placeholder,.bbody::placeholder{color:var(--muted);opacity:.7}
.bfoot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:12px;
  padding-top:11px;border-top:1px solid var(--line)}
.field{display:flex;align-items:center;gap:7px}
.lab{font-size:11px;font-weight:640;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select.alloc{background:var(--bg);border:1px solid var(--line2);border-radius:5px;padding:3px 6px;font-size:13px}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sw{width:32px;height:18px;border-radius:10px;background:var(--line2);position:relative;transition:background .12s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
  background:var(--panel);transition:left .12s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle.on .sw{background:var(--accent)}
.toggle.on .sw::after{left:16px}
.toggle.on{color:var(--ink)}
.bfoot .spacer{flex:1}
.hint{color:var(--muted);font-size:12px;margin:0 0 10px}
.addblock{width:100%;border:1px dashed var(--line2);border-radius:var(--radius);padding:11px;
  color:var(--muted);background:var(--panel)}
.addblock:hover{border-color:var(--accent);color:var(--accent)}
/* edit mode overrides, last so they win the specificity ties */
.node.editing .nodex,.node.editing:hover .nodex,.node.editing:focus-within .nodex{
  display:flex;position:absolute;top:-9px;right:-9px;width:22px;height:22px;
  border-radius:50%;background:var(--danger);color:#fff;opacity:1;font-size:11px;
  box-shadow:0 1px 5px rgba(0,0,0,.4);z-index:95}
.node.editing .nodex:hover{filter:brightness(1.15)}
</style>

<body>
<div id="app"></div>
<script id="seed" type="application/json"></script>
<input type="file" id="importer" accept="application/json,.json" hidden>
<script>
"use strict";

/* ============ storage ============ */
var db, view;

function readSeed(){
  var el = document.getElementById("seed");
  if(!el) return null;
  var t = (el.textContent||"").trim();
  if(!t) return null;
  try{ var d = JSON.parse(t); return (d && Array.isArray(d.notes)) ? d : null; }
  catch(e){ return null; }
}
var SEED = readSeed();
var KEY = (SEED && SEED.docId) ? "yusufNotes."+SEED.docId : "yusufNotes.v1";

function uid(){ return Math.random().toString(36).slice(2,10); }
function newPoint(text, depth){
  return {id:uid(), text:text||"", depth:depth||0, done:false, person:""};
}
function newBlock(){
  return {id:uid(),title:"",points:[newPoint("")],person:"",todo:false,done:false};
}
/* older cards stored one lump of text - split it into points on first sight */
function ensurePoints(b){
  if(b.points && b.points.length) return b.points;
  var lines = (b.body || "").split("\n").filter(function(l){ return l.trim().length; });
  b.points = lines.length ? lines.map(function(l){ return newPoint(l, 0); }) : [newPoint("")];
  delete b.body;
  return b.points;
}
function newNote(n){
  var p = {id:uid(),title:"page 1",x:0,y:0,blocks:[newBlock()]};
  return {id:uid(),title:"note "+n,people:[],pages:[p],edges:[]};
}
function seed(){ return {version:1,notes:[newNote(1)]}; }

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return null;
    var d = JSON.parse(raw);
    return (d && Array.isArray(d.notes)) ? d : null;
  }catch(e){ return null; }
}
function newer(a,b){
  if(!a) return b; if(!b) return a;
  return (a.savedAt||0) >= (b.savedAt||0) ? a : b;
}
var saveTimer = null, storageOK = true, dirty = false;
try{ localStorage.setItem(KEY+".probe","1"); localStorage.removeItem(KEY+".probe"); }
catch(e){ storageOK = false; }

function persist(){
  if(!storageOK) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{ localStorage.setItem(KEY, JSON.stringify(db)); }
    catch(e){
      storageOK = false;
      console.warn("Could not save:", e);
      render();   /* surface the banner rather than losing work quietly */
    }
  }, 200);
}

function save(){
  db.savedAt = Date.now();   /* time of the last edit */
  dirty = true;
  refreshSaveUI();
  persist();
}

var stored = load();
db = newer(SEED, stored) || seed();
if(!db.docId) db.docId = uid();
/* live copy came from the browser, not the file: there are edits no file has yet */
dirty = !!stored && db === stored;
view = {v:"front"};

/* ============ lookups ============ */
function note(id){ return db.notes.filter(function(n){return n.id===id;})[0]; }
function page(n,id){ return n.pages.filter(function(p){return p.id===id;})[0]; }
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

var DIRS = {up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
var OPP  = {up:"down",down:"up",left:"right",right:"left"};

function parentOf(n){
  var pm = {};
  n.edges.forEach(function(e){ pm[e[1]] = e[0]; });
  return pm;
}
function childrenOf(n){
  var cm = {};
  n.edges.forEach(function(e){ (cm[e[0]] = cm[e[0]] || []).push(e[1]); });
  return cm;
}

/* Older pages predate p.dir - recover it from where they were sitting. */
function ensureDirs(n){
  var pm = parentOf(n);
  n.pages.forEach(function(p){
    if(p.dir) return;
    var par = pm[p.id] ? page(n, pm[p.id]) : null;
    if(!par) return;
    var dx = (p.x||0)-(par.x||0), dy = (p.y||0)-(par.y||0);
    p.dir = Math.abs(dx) >= Math.abs(dy) ? (dx>=0?"right":"left") : (dy>=0?"down":"up");
  });
}

/* Positions are derived, never stored by hand: each subtree reserves a block of
   the grid, and later siblings start past it. So a branch that grows sideways
   pushes its neighbours out of the way instead of colliding with them. */
var DIR_ORDER = ["down","up","right","left"];

function relayout(n){
  ensureDirs(n);
  n.pages.forEach(function(q){
    if(q.gap !== undefined){ if(!q.xoff) q.xoff = q.gap; delete q.gap; }
  });
  var cm = childrenOf(n), pm = parentOf(n), byId = {};
  n.pages.forEach(function(p){ byId[p.id] = p; });

  /* Lay a subtree out in its own local coordinates, then slide it along until it
     stops overlapping anything already placed. Only cells that are genuinely
     occupied push things along - a tile is free to tuck in above another
     branch's descendants until something actually needs that square. */
  function build(id, seen){
    if(seen[id]) return null;
    seen[id] = 1;
    var cells = {}, pos = {};

    function fits(sub, ox, oy){
      for(var k in sub.cells){
        var c = k.indexOf(",");
        if(cells[(+k.slice(0,c)+ox) + "," + (+k.slice(c+1)+oy)]) return false;
      }
      return true;
    }
    function absorb(sub, ox, oy){
      for(var k in sub.cells){
        var c = k.indexOf(",");
        cells[(+k.slice(0,c)+ox) + "," + (+k.slice(c+1)+oy)] = sub.cells[k];
      }
      for(var q in sub.pos) pos[q] = {x:sub.pos[q].x+ox, y:sub.pos[q].y+oy};
    }

    var kids = cm[id] || [];
    function group(d){
      return kids.filter(function(k){ return byId[k] && !seen[k] && byId[k].dir === d; });
    }

    /* Children below (and above) go first, from a provisional origin. The first
       one slides further along its own direction if it won't fit; later siblings
       fan out sideways from it. */
    var kidXs = [];
    ["down","up"].forEach(function(d){
      var step = (d === "down") ? 1 : -1, first = true;
      group(d).forEach(function(k){
        var sub = build(k, seen);
        if(!sub) return;
        var ox = -sub.pos[k].x, oy = step, guard = 0;
        while(!fits(sub, ox, oy) && guard++ < 400){
          if(first) oy += step; else ox++;
        }
        absorb(sub, ox, oy);
        kidXs.push(sub.pos[k].x + ox);
        first = false;
      });
    });

    /* Sit the parent in the middle of the children hanging beneath it. */
    var px = 0;
    if(kidXs.length){
      px = Math.round((Math.min.apply(null, kidXs) + Math.max.apply(null, kidXs)) / 2);
    }
    var g2 = 0;
    while(cells[px + ",0"] && g2++ < 400) px++;
    cells[px + ",0"] = id; pos[id] = {x:px, y:0};

    /* Then children to the sides, measured from where the parent ended up. */
    ["right","left"].forEach(function(d){
      var step = (d === "right") ? 1 : -1, first = true;
      group(d).forEach(function(k){
        var sub = build(k, seen);
        if(!sub) return;
        var ox = px + step - sub.pos[k].x, oy = 0, guard = 0;
        while(!fits(sub, ox, oy) && guard++ < 400){
          if(first) ox += step; else oy++;
        }
        absorb(sub, ox, oy);
        first = false;
      });
    });

    return {cells:cells, pos:pos};
  }

  var seen = {};
  var roots = n.pages.filter(function(p){ return !pm[p.id] || !byId[pm[p.id]]; });
  if(!roots.length && n.pages.length) roots = [n.pages[0]];
  var cursor = 0;
  roots.forEach(function(r){
    var sub = build(r.id, seen);
    if(!sub) return;
    var ys = [];
    for(var q in sub.pos) ys.push(sub.pos[q].y);
    var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
    var off = cursor - minY;
    for(var q2 in sub.pos){
      var pg = byId[q2];
      if(!pg) continue;
      pg.x = sub.pos[q2].x;
      pg.y = sub.pos[q2].y + off;
    }
    cursor = maxY + off + 2;          /* a blank row between disconnected clusters */
  });
  n.pages.forEach(function(p){        /* nothing ever gets dropped */
    if(!seen[p.id]){ p.x = 0; p.y = cursor; cursor += 2; seen[p.id] = 1; }
  });
}

function addPage(n, from, dir){
  var p = {id:uid(), title:"page "+(n.pages.length+1),
           x:from.x, y:from.y, dir:dir, blocks:[newBlock()]};
  n.pages.push(p);
  n.edges.push([from.id, p.id]);
  relayout(n);
  return p;
}

/* The strand you are on: walk outward through *connected* pages that stay on the
   same axis. Sharing a column by coincidence is not being on the same strand. */
function axis(n, p, kind){
  /* a row is a level: every page sitting at the same depth belongs to it,
     whether or not it is wired to the one you're standing on */
  if(kind === "row"){
    return n.pages.filter(function(q){ return q.y === p.y; })
      .sort(function(a,b){ return visX(a) - visX(b); });
  }
  var adj = {};
  n.edges.forEach(function(e){
    (adj[e[0]] = adj[e[0]] || []).push(e[1]);
    (adj[e[1]] = adj[e[1]] || []).push(e[0]);
  });
  function onAxis(q){ return kind === "col" ? q.x === p.x : q.y === p.y; }
  var seen = {}, stack = [p.id], out = [];
  seen[p.id] = 1;
  while(stack.length){
    var id = stack.pop(), q = page(n, id);
    if(!q) continue;
    out.push(q);
    (adj[id] || []).forEach(function(k){
      if(seen[k]) return;
      var kq = page(n, k);
      if(!kq || !onAxis(kq)) return;
      seen[k] = 1;
      stack.push(k);
    });
  }
  return out.sort(function(a,b){ return kind === "col" ? a.y-b.y : a.x-b.x; });
}

function deletePage(n, id){
  var par = parentOf(n)[id] || null;
  var kids = n.edges.filter(function(e){ return e[0]===id; }).map(function(e){ return e[1]; });
  n.pages = n.pages.filter(function(p){ return p.id!==id; });
  n.edges = n.edges.filter(function(e){ return e[0]!==id && e[1]!==id; });
  if(par) kids.forEach(function(k){ n.edges.push([par, k]); });   /* adopt the orphans */
  relayout(n);
}

/* ============ render ============ */
var app = document.getElementById("app");

function render(){
  if(view.v==="front") app.innerHTML = viewFront();
  else if(view.v==="note") app.innerHTML = viewNote();
  else app.innerHTML = viewPage();
  var pta = app.querySelectorAll("textarea.pttx");
  for(var pi=0; pi<pta.length; pi++) grow(pta[pi]);
  if(focusPointId){
    var pel = app.querySelector('.pttx[data-point="'+focusPointId+'"]');
    focusPointId = null;
    if(pel){ pel.focus(); pel.setSelectionRange(pel.value.length, pel.value.length); }
  }
  if(timeline) app.insertAdjacentHTML("beforeend", timelineHTML());
  if(helpOpen) app.insertAdjacentHTML("beforeend", helpHTML());
  padCanvas(app.querySelector(".mapscroll"));
  var ta = app.querySelectorAll("textarea.bbody");
  for(var i=0;i<ta.length;i++) grow(ta[i]);
  var stale = document.getElementById("swpop");
  if(stale) stale.remove();
  if(editingPageId){
    var inp = app.querySelector('.nedit[data-page="'+editingPageId+'"]');
    if(inp){
      inp.focus(); inp.select();           /* generic name pre-selected, just type over it */
      floatSwatches(inp);
    }
    else editingPageId = null;
  }
}
function grow(el){ el.style.height="auto"; el.style.height = el.scrollHeight+"px"; }

/* Like a spreadsheet: the sheet stays a screenful bigger than wherever you have
   scrolled to, and shrinks back down when you scroll home again. */
function padCanvas(sc){
  if(!sc) return;
  var inner = sc.querySelector(".mapinner");
  if(!inner) return;
  var bw = +inner.getAttribute("data-bw") || 0;
  var bh = +inner.getAttribute("data-bh") || 0;
  inner.style.minWidth  = Math.max(bw, sc.scrollLeft + sc.clientWidth  + 420) + "px";
  inner.style.minHeight = Math.max(bh, sc.scrollTop  + sc.clientHeight + 320) + "px";
}
app.addEventListener("scroll", function(e){
  var sc = e.target;
  if(sc && sc.classList && sc.classList.contains("mapscroll")) padCanvas(sc);
}, true);

/* Paint the pending colour straight onto the tile so you can see it before Apply. */
function previewTint(col){
  var tile = app.querySelector('.node[data-page="'+editingPageId+'"]');
  if(!tile) return;
  if(col){ tile.style.background = col; tile.classList.add("tinted"); }
  else { tile.style.background = ""; tile.classList.remove("tinted"); }
}

/* The map scrolls and would crop the palette, so float it over the page. */
function floatSwatches(inp){
  var sw = app.querySelector(".swatches");
  if(!sw) return;
  var nodeEl = inp.closest(".node");
  var r = nodeEl.getBoundingClientRect();
  sw.id = "swpop";
  document.body.appendChild(sw);
  sw.style.position = "fixed";
  var box = sw.getBoundingClientRect();
  var vh = window.innerHeight, vw = window.innerWidth, pad = 8;
  var left, top;
  if(r.bottom + 10 + box.height <= vh - pad){            /* below the tile */
    top = r.bottom + 10;
    left = Math.min(r.left, vw - box.width - pad);
  } else if(r.top - box.height - 20 >= pad){             /* above, clearing the ✕ badge */
    top = r.top - box.height - 20;
    left = Math.min(r.left, vw - box.width - pad);
  } else if(r.right + 14 + box.width <= vw - pad){       /* beside it, on the right */
    left = r.right + 14;
    top = Math.max(pad, Math.min(r.top, vh - box.height - pad));
  } else {                                               /* beside it, on the left */
    left = Math.max(pad, r.left - box.width - 14);
    top = Math.max(pad, Math.min(r.top, vh - box.height - pad));
  }
  sw.style.left = Math.max(pad, left) + "px";
  sw.style.top = Math.max(pad, top) + "px";

  sw.addEventListener("mousedown", function(e){ e.preventDefault(); });  /* keep the caret */
  sw.addEventListener("input", function(e){
    var w = e.target.closest('[data-act="colourPick"]');
    if(!w) return;
    pendingColour = w.value;
    var all0 = sw.querySelectorAll(".swch");
    for(var k=0;k<all0.length;k++) all0[k].classList.remove("on");
    w.parentNode.classList.add("on");
    previewTint(pendingColour);
  });
  sw.addEventListener("click", function(e){
    var b = e.target.closest('[data-act="colour"]');
    if(b){
      pendingColour = b.getAttribute("data-colour");
      var all = sw.querySelectorAll(".swch");
      for(var i=0;i<all.length;i++){
        all[i].classList.toggle("on", all[i].getAttribute("data-colour") === pendingColour);
      }
      previewTint(pendingColour);     /* show it on the tile before committing */
      return;
    }
    var ap = e.target.closest('[data-act="applyColour"]');
    if(!ap) return;
    var c = ctx(ap);
    if(!c.n || !c.p) return;
    var col = (pendingColour === undefined) ? c.p.color : pendingColour;
    applyColour(c.n, c.p, col, ap.getAttribute("data-scope") === "all");
  });
}

function banner(){
  if(storageOK) return "";
  return '<div class="warn"><b>Not saving automatically.</b>'
    + '<span>This browser won’t store notes for this file. Use Export before you close the tab.</span>'
    + '<span style="flex:1"></span>'
    + '<button data-act="export">Export now</button></div>';
}

var NAG_MS = 10 * 60 * 1000;   /* go red once you've been idle this long with unsaved work */

function saveState(){
  if(!dirty) return "clean";
  return (Date.now() - (db.savedAt||0)) >= NAG_MS ? "stale" : "pending";
}

/* Every change lands here, so the timelines all read from one place. */
function logChange(n, kind, o){
  if(!n) return;
  if(!n.log) n.log = [];
  o = o || {};
  var e = { t:Date.now(), kind:kind, pageId:o.pageId||null, blockId:o.blockId||null,
            pointId:o.pointId||null, section:o.section||"", text:(o.text||"").slice(0,140) };
  var last = n.log[n.log.length-1];
  /* a burst of typing on one thing is one entry, not fifty */
  if(last && last.kind===kind && last.pageId===e.pageId && last.blockId===e.blockId
     && last.pointId===e.pointId && (e.t - last.t) < 60000){
    last.t = e.t; last.text = e.text; last.section = e.section;
  } else {
    n.log.push(e);
    if(n.log.length > 800) n.log.shift();
  }
}
function lastTouched(n, blockId){
  var log = n.log || [], t = 0;
  for(var i=0;i<log.length;i++) if(log[i].blockId === blockId && log[i].t > t) t = log[i].t;
  return t;
}
function blockLabel(b){
  var first = (b.points && b.points[0] && b.points[0].text) || (b.body||"").split("\n")[0] || "";
  return (b.title || first || "untitled").slice(0,120);
}
function findPoint(b, id){
  var pts = b.points || [];
  for(var i=0;i<pts.length;i++) if(pts[i].id === id) return pts[i];
  return null;
}

function twoDigit(v){ return v < 10 ? "0"+v : String(v); }

/* DD/MM/YY HH:MM, the format from the sketches */
function shortStamp(ts){
  var d = new Date(ts);
  return twoDigit(d.getDate())+"/"+twoDigit(d.getMonth()+1)+"/"+twoDigit(d.getFullYear()%100)
    + " " + twoDigit(d.getHours())+":"+twoDigit(d.getMinutes());
}

function saveLabel(){
  if(!db.lastFileSave) return "Never saved to a file";
  var d = new Date(db.lastFileSave), now = new Date();
  var t = twoDigit(d.getHours()) + ":" + twoDigit(d.getMinutes());
  var sameDay = d.toDateString() === now.toDateString();
  return "Last saved " + (sameDay ? t
    : d.getDate() + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()] + ", " + t);
}

function saveBtnInner(){
  return (dirty ? '<span class="dot">\u25CF</span> ' : "") + "Save file";
}

/* Updated in place on a timer, so it never re-renders under your cursor. */
function refreshSaveUI(){
  var btn = document.querySelector('[data-act="saveFile"]');
  if(!btn) return;
  var st = saveState();
  btn.className = "btn primary savebtn " + st;
  btn.innerHTML = saveBtnInner()
    + '<span class="caret" data-act="fileMenu" title="File actions">\u25BE</span>';
  btn.title = st === "stale"
    ? "You have unsaved changes and haven't typed for a while \u2014 save them to a file"
    : "Write out a notes.html with your notes inside";
  var lab = document.querySelector(".savedat");
  if(lab){
    lab.textContent = saveLabel();
    lab.className = "savedat" + (st === "stale" ? " stale" : "");
  }
}
setInterval(refreshSaveUI, 15000);

var fileMenuOpen = false, helpOpen = false;

function helpHTML(){
  function sec(title, rows){
    return '<div class="hsec"><h3>'+title+'</h3><dl>'
      + rows.map(function(r){ return '<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>'; }).join("")
      + '</dl></div>';
  }
  return '<div class="tlback" data-act="helpClose"><div class="tlbox help" data-act="tlNoop">'
    + '<div class="tlhead"><strong>Help</strong>'
    + '<span class="tlscope">How this thing works</span><span class="spacer"></span>'
    + '<button class="btn" data-act="helpClose">Close</button></div>'
    + '<div class="tlbody">'
    + '<p class="hlead">A note is a spider diagram. Pages are tiles on a map, each page holds '
      + 'cards, and each card holds a list of points.</p>'
    + sec("On the map", [
        ["Hover a page","the <strong>+</strong> handles appear on all four sides"],
        ["Click a <strong>+</strong>","a new page lands on that side, ready to be named"],
        ["Click a tile","open the page"],
        ["Pencil","rename it, and pick a colour"],
        ["Right-click","Open, Rename or Delete"],
        ["Hover, then \u2715","delete the page \u2014 it always asks first"],
        ["Grip, bottom right","drag to reorder; a preview shows the result before you let go"],
        ["Hold \u2318 / Ctrl while dragging","move just that page, leaving its children behind"],
        ["\u2194 arrows","nudge a page sideways. Purely visual \u2014 nothing changes parent"],
        ["Esc","cancel a drag"]
      ])
    + sec("Inside a page", [
        ["ROW bar","every page on the same level"],
        ["COLUMN bar","the pages connected above and below this one"],
        ["+ card","a new card, added at the top"],
        ["Card grip","drag to reorder cards"]
      ])
    + sec("Points", [
        ["Enter","new point"],
        ["Shift + Enter","another line inside the same point"],
        ["Tab","indent one level"],
        ["Backspace at the start","step back out a level, then delete"],
        ["to do","adds it to the to-do list on the index"],
        ["Clock","the history of that point alone"]
      ])
    + sec("Everywhere", [
        ["\u2318Z / Ctrl+Z","undo"],
        ["\u21e7\u2318Z / Ctrl+Y","redo"],
        ["Timeline","every change, filterable by all / Done / edits"],
        ["Save file","writes a notes.html with your notes inside it"]
      ])
    + '</div></div></div>';
}
var THEME_KEY = "yusufNotes.theme";
function resolvedTheme(){
  var t = null;
  try{ t = localStorage.getItem(THEME_KEY); }catch(e){}
  if(t === "light" || t === "dark") return t;
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme:dark)").matches)
    ? "dark" : "light";
}
function setTheme(t){
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  document.documentElement.setAttribute("data-theme", t);
}

function themeButton(){
  var dark = resolvedTheme() === "dark";
  return '<button class="themebtn'+(dark?" is-dark":"")+'" data-act="theme"'
    + ' title="Switch to '+(dark?"light":"dark")+' mode">'
    + '<i class="sun"><svg viewBox="0 0 24 24" width="15" height="15">'

      + '</g></svg></i>'
    + '<i class="moon"><svg viewBox="0 0 24 24" width="15" height="15">'
      + '<path fill="currentColor" d="M20.3 14.9A8.6 8.6 0 0 1 9.1 3.7a8.6 8.6 0 1 0 11.2 11.2z"/>'

}
