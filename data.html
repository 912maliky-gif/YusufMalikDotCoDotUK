<style>
:root{
  --bg:#f5f4f0; --panel:#ffffff; --panel2:#faf9f6; --ink:#1b1b1f; --muted:#6a6a72; --line:#e3e1da; --line2:#efede7;
  --acc:#2f56c9; --acc-soft:#e8eefc; --pos:#1d8048; --pos-soft:#e2f3e8; --neg:#bf3a2f; --neg-soft:#fbe8e5;
  --warn:#9a5b00; --warn-soft:#fcf0d9; --vio:#6d45c2; --vio-soft:#efe9fb; --teal:#0f7c86; --teal-soft:#e1f3f4;
  --mut-soft:#efeee9; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131315; --panel:#1c1c1f; --panel2:#202024; --ink:#ececf0; --muted:#9a9aa3; --line:#2e2e33; --line2:#26262a;
    --acc:#7d9bff; --acc-soft:#232b45; --pos:#58c487; --pos-soft:#1b3326; --neg:#f07a6f; --neg-soft:#3a201d;
    --warn:#e3a645; --warn-soft:#3a2c14; --vio:#b39cff; --vio-soft:#2c2442; --teal:#5cc9d2; --teal-soft:#16343a;
    --mut-soft:#29292e; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#131315; --panel:#1c1c1f; --panel2:#202024; --ink:#ececf0; --muted:#9a9aa3; --line:#2e2e33; --line2:#26262a;
  --acc:#7d9bff; --acc-soft:#232b45; --pos:#58c487; --pos-soft:#1b3326; --neg:#f07a6f; --neg-soft:#3a201d;
  --warn:#e3a645; --warn-soft:#3a2c14; --vio:#b39cff; --vio-soft:#2c2442; --teal:#5cc9d2; --teal-soft:#16343a;
  --mut-soft:#29292e; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none} a:hover{text-decoration:underline}
#app{display:flex;height:100%}
#nav{width:208px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px}
#nav .brand{font-weight:700;font-size:20px;letter-spacing:-.02em;padding:0 10px 16px}
#nav .brand span{color:var(--muted);font-weight:500;font-size:12px;display:block;letter-spacing:0}
#nav a.nl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);font-weight:500}
#nav a.nl:hover{background:var(--mut-soft);text-decoration:none}
#nav a.nl.on{background:var(--acc-soft);color:var(--acc)}
#nav a.nl svg{width:17px;height:17px;flex:none}
#nav .grow{flex:1}
#backupbox{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;color:var(--muted)}
#backupbox.dirty{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
#backupbox button{margin-top:8px;width:100%}
#mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:12px;padding:12px 28px;border-bottom:1px solid var(--line);background:var(--panel)}
#gsearch-wrap{position:relative;flex:1;max-width:520px}
#gsearch{width:100%}
#gresults{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:30;max-height:420px;overflow:auto}
#gresults a{display:block;padding:8px 12px;color:var(--ink);border-bottom:1px solid var(--line2)}
#gresults a:hover,#gresults a.sel{background:var(--acc-soft);text-decoration:none}
#gresults small{color:var(--muted)}
#top .meta{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
#main{flex:1;overflow:auto;padding:24px 28px 60px}
.page{max-width:1240px;margin:0 auto}
h1{font-size:24px;letter-spacing:-.02em;margin:0 0 4px}
h2{font-size:16px;margin:28px 0 10px}
h3{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--muted);margin:0 0 18px}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1000px){.g2,.g3{grid-template-columns:1fr}}
/* narrow screens (iPad portrait): sidebar becomes a top bar */
@media (max-width:900px){
  #app{flex-direction:column}
  #nav{width:auto;flex-direction:row;align-items:center;gap:4px;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  #nav .brand{padding:0 8px 0 4px;font-size:17px;white-space:nowrap}
  #nav .brand span{display:none}
  #nav a.nl{white-space:nowrap;padding:7px 9px}
  #nav .grow{display:none}
  #backupbox{padding:6px 8px;white-space:nowrap;display:flex;align-items:center;gap:8px}
  #backupbox button{margin:0;width:auto}
  #backupbox > div{display:none}
  #top{padding:10px 14px}
  #top .meta{display:none}
  #main{padding:16px 14px 50px}
  .ev{grid-template-columns:96px 1fr}
  .ev .date{display:none}
}
@media (pointer:coarse){ .vt-row{height:40px} button,.chip{min-height:36px} }
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;margin:0 0 6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:default;text-align:left;font:inherit;color:inherit}
button.stat{cursor:pointer}
button.stat:hover{border-color:var(--acc)}
.stat.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.stat .n{font-size:24px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
button:hover{border-color:var(--muted)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
[data-theme="dark"] button.pri{color:#111}
button.pri:hover{filter:brightness(1.07)}
button.danger{color:var(--neg)}
button.sm{padding:4px 9px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line);padding:6px 12px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc-soft);color:var(--acc)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--mut-soft);color:var(--muted)}
.t-pos{background:var(--pos-soft);color:var(--pos)} .t-neg{background:var(--neg-soft);color:var(--neg)}
.t-acc{background:var(--acc-soft);color:var(--acc)} .t-warn{background:var(--warn-soft);color:var(--warn)}
.t-vio{background:var(--vio-soft);color:var(--vio)} .t-teal{background:var(--teal-soft);color:var(--teal)}
.t-mut{background:var(--mut-soft);color:var(--muted)}
.c-pos{background:var(--pos)}.c-neg{background:var(--neg)}.c-acc{background:var(--acc)}.c-warn{background:var(--warn)}.c-vio{background:var(--vio)}.c-teal{background:var(--teal)}.c-mut{background:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.chip b{font-variant-numeric:tabular-nums}
.evlist{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:132px 1fr auto;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line2);align-items:start}
.ev:last-child{border-bottom:0}
.ev .pills{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.ev .who{font-weight:600}
.ev .h{margin-left:6px}
.ev .meta{color:var(--muted);font-size:12px;margin-top:2px}
.ev .date{color:var(--muted);font-size:12px;white-space:nowrap;text-align:right}
.diffs{margin:6px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--muted)}
.diffs li{margin:1px 0}
.diffs .f{color:var(--ink);opacity:.8}
.diffs s{opacity:.75}
.wkhead{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:16px 4px 6px;border-bottom:1px solid var(--line)}
.ann{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line2);align-items:center}
.ann:last-child{border-bottom:0}
.yrs{font-weight:700;font-size:18px;text-align:center;line-height:1;letter-spacing:-.02em}
.yrs small{display:block;font-size:10px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:2px}
.empty{color:var(--muted);padding:18px 4px}
/* table */
.tbl-wrap{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.vt-head{display:grid;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12px}
.vt-head .hc{padding:8px 10px 4px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
.vt-head .hc:hover{color:var(--ink)}
.vt-head .fc{padding:0 6px 8px}
.vt-head .fc input{width:100%;padding:4px 7px;font-size:12px}
.vt-body{overflow:auto;position:relative}
.vt-row{display:grid;position:absolute;left:0;right:0;height:34px;align-items:center;border-bottom:1px solid var(--line2);cursor:pointer}
.vt-row:hover{background:var(--acc-soft)}
.vt-row div{padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt-row.left{color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 18px}
.fact{padding:7px 0;border-bottom:1px solid var(--line2)}
.fact .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.fact .v{word-break:break-word}
.hbar{display:grid;grid-template-columns:minmax(120px,38%) 1fr 64px;gap:10px;align-items:center;padding:3px 0;font-size:13px}
.hbar .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .track{height:14px;border-radius:4px;background:var(--line2);overflow:hidden}
.hbar .fill{height:100%;background:var(--acc);border-radius:4px}
.hbar .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.delta{font-variant-numeric:tabular-nums;font-weight:600}
.delta.up{color:var(--pos)} .delta.down{color:var(--neg)} .delta.zero{color:var(--muted)}
.dbar{position:relative;height:10px;width:120px;display:inline-block;vertical-align:middle}
.dbar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.dbar i{position:absolute;top:0;bottom:0;border-radius:2px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--muted);font-size:11px}
svg.chart .grid line{stroke:var(--line2)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.notice{border-radius:10px;padding:10px 14px;margin:10px 0;border:1px solid var(--line);background:var(--panel2)}
.notice.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.notice.bad{background:var(--neg-soft);border-color:transparent;color:var(--neg)}
.notice.good{background:var(--pos-soft);border-color:transparent;color:var(--pos)}
.notice b{font-weight:650}
.pastezone{width:100%;height:150px;resize:none;border:2px dashed var(--line);border-radius:12px;background:var(--panel2);text-align:center;padding-top:56px;font-size:15px;color:var(--muted);cursor:pointer}
.pastezone:focus{border-color:var(--acc);background:var(--acc-soft);box-shadow:none}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;z-index:100}
#overlay[hidden]{display:none}
#overlay div{background:var(--panel);padding:18px 26px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.ph{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:none}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
.tl > li{position:relative;padding:0 0 14px 6px}
.tl > li::before{content:"";position:absolute;left:-25px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--acc)}
.tl .d{font-size:12px;color:var(--muted)}
details.colpick{position:relative}
details.colpick summary{list-style:none;cursor:pointer}
.btnlike{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:500;display:inline-block}
.btnlike:hover{border-color:var(--muted)}
details.colpick summary::-webkit-details-marker{display:none}
details.colpick .menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;z-index:20;width:260px;max-height:380px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.12)}
details.colpick label{display:flex;gap:8px;padding:3px 0;font-size:13px}
.kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:12px}
#gate{position:fixed;inset:0;z-index:150;background:var(--bg);overflow:auto}
#gate[hidden]{display:none}
.gatewrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gatecard{width:100%;max-width:400px;text-align:center;display:flex;flex-direction:column;gap:10px;padding:26px 24px}
.gatecard h1{margin:0}
.gatecard p{margin:0}
.gatecard input{width:100%;font-size:16px;padding:10px 12px}
.gatecard button.pri{padding:10px;font-size:15px}
.gateicon{color:var(--acc);display:flex;justify-content:center}
.small{font-size:12.5px}
body.locked #app{visibility:hidden}
#pwmodal{position:fixed;inset:0;z-index:160;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px}
#pwmodal .gatecard{text-align:left}
.reckey{font:600 19px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;word-break:break-all;user-select:all}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:200;font-weight:500}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   Data — single-file, offline people-changes tracker.
   Everything stays in this browser (IndexedDB) and in Data-store.js, the data file you save next to this page.
   Nothing is sent anywhere: no network requests are made by this page.
   ===================================================================== */

/* ---------- VERSIONS & UPGRADES (read this before changing the page) ----------
   APP_VERSION  — the version of this page. Bump it on every release you copy to the work laptop.
   SCHEMA       — the version of the stored data format. Bump it ONLY when the stored structure changes,
                  and add a step to MIGRATIONS that converts data from the previous format.
   Principle: the raw pasted weeks (DB.snapshots + dictionaries) are the source of truth. Everything shown
   on screen (changes, anniversaries, charts…) is recalculated from them every time the page opens,
   so new features automatically work on old data without re-pasting anything.
   Backups store every top-level DB field, so new things a future version adds (e.g. watchlists) are
   carried in backups automatically. A page never opens data from a NEWER format than it understands. */
const APP_VERSION = '1.5.1';
// The data file that lives next to Data.html. Browsers won't let a page read a .json file beside it, but they do let it
// load a script from its own folder (whatever the extension). It's .txt, not .js, because Windows/Edge flags .js downloads as dangerous.
const STORE_FILE = 'Data-store.txt';
// device-aware wording
const UA = navigator.userAgent || '';
const IS_IOS = /iPad|iPhone|iPod/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1); // iPadOS reports itself as a Mac
const IS_APPLE = IS_IOS || /Mac/.test(UA);
const KEY = k => IS_APPLE ? `⌘${k}` : `Ctrl+${k}`;
const IS_LOCAL_FILE = location.protocol === 'file:';
const SCHEMA = 2;
const MIGRATIONS = {
  // 1 → 2: SAP numbers are stored as 8 digits, because Excel can drop leading zeros (7183 vs 00007183)
  1: db => {
    const pad = v => /^\d{1,7}$/.test(v) ? v.padStart(8, '0') : v;
    db.persons = db.persons.map(pad);

// ---------- paste parsing ----------
function parseTSV(text){
  text = text.replace(/^﻿/, '');
  const rows = [];
  if (text.indexOf('"') === -1){
    for (const line of text.split(/\r\n|\r|\n/)) rows.push(line.split('\t'));
  } else {
    let row = [], f = '', i = 0, q = false; const n = text.length;
    while (i < n){
      const ch = text[i];
      if (q){
        if (ch === '"'){ if (text[i + 1] === '"'){ f += '"'; i += 2; continue; } q = false; i++; continue; }
        f += ch; i++; continue;
      }
      if (ch === '"' && f === ''){ q = true; i++; continue; }
      if (ch === '\t'){ row.push(f); f = ''; i++; continue; }
      if (ch === '\r' || ch === '\n'){ row.push(f); rows.push(row); row = []; f = ''; i += (ch === '\r' && text[i + 1] === '\n') ? 2 : 1; continue; }
      f += ch; i++;
    }
    row.push(f); rows.push(row);
  }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
function cleanValue(key, v){
  v = String(v).replace(/ /g, ' ').trim().replace(/\s+/g, ' ');
  if (!v) return '';
  // SAP numbers: Excel sometimes drops leading zeros (7183 vs 00007183) — always store as 8 digits so they match
  if (key.includes('sap no') && /^\d{1,7}$/.test(v)) return v.padStart(8, '0');
  if (key.includes('date')){ const d = parseDate(v); if (d) return dmy(d); }
  if (key === K.fte && /^-?\d+(\.\d+)?$/.test(v)) return (+v).toFixed(2);
  return v;
}
function analysePaste(text){
  const rows = parseTSV(text);
  if (rows.length < 2) throw new Error('That doesn’t look like a table. Copy the whole sheet in Excel (select everything with the corner square, then copy) including the header row.');
  const rawHeaders = rows[0];
  const headers = []; const seen = new Set(); const dupHeaders = [];
  rawHeaders.forEach((h, j) => {
    const name = String(h).replace(/ /g, ' ').trim().replace(/\s+/g, ' '); const key = canonKey(name);
    if (!key) return;
    if (seen.has(key)){ dupHeaders.push(name); return; }
    seen.add(key); headers.push({ j, name, key });
  });
  const sapH = headers.find(h => h.key === K.sap);
  if (!sapH) throw new Error('No “SAP No” column found in the first row. Make sure you copied the header row too.');
  const warnings = []; if (dupHeaders.length) warnings.push(`Duplicate column header(s) ignored: ${dupHeaders.join(', ')}`);
  const data = []; const keys = new Set(); let noSap = 0, dupSap = 0, ragged = 0;
  for (let r = 1; r < rows.length; r++){
    const row = rows[r];
    if (row.length !== rawHeaders.length) ragged++;
    const sap = cleanValue(K.sap, row[sapH.j] || '');
    if (!sap){ noSap++; continue; }
    const pk = personKey(sap);
    if (keys.has(pk)){ dupSap++; continue; }
    keys.add(pk);
    data.push({ sap, pk, vals: headers.map(h => cleanValue(h.key, row[h.j] == null ? '' : row[h.j])) });
  }
  if (noSap) warnings.push(`${fmtN(noSap)} row(s) had no SAP No and were skipped.`);
  if (dupSap) warnings.push(`${fmtN(dupSap)} duplicate SAP No row(s) — only the first of each was kept.`);
  if (ragged > Math.max(5, data.length * 0.01)) warnings.push(`${fmtN(ragged)} row(s) had a different number of cells than the header — check the copy included every column.`);
  return { headers, data, warnings };
}
function comparePaste(pd, dateIso){
  const S = DB.snapshots.length;
  let prevIdx = -1; for (let s = 0; s < S; s++) if (DB.snapshots[s].date < dateIso) prevIdx = s;
  const out = { prevIdx, joiners:0, leavers:0, changed:0, newCols:[], missingCols:[], existing: DB.snapshots.findIndex(s => s.date === dateIso), laterThan: S && dateIso < DB.snapshots[S - 1].date };
  out.newCols = pd.headers.filter(h => cid(h.key) < 0).map(h => h.name);
  if (S){
    const lastCols = Object.keys(DB.snapshots[S - 1].cols).map(Number);
    const inPaste = new Set(pd.headers.map(h => h.key));
    out.missingCols = lastCols.map(c => DB.columns[c]).filter(c => !inPaste.has(c.key)).map(c => c.name);
  }
  if (prevIdx < 0) return out;
  const prev = DB.snapshots[prevIdx];
  const ignored = new Set(DB.settings.ignored.concat([K.leaderName, K.leaderGrade]));
  const hc = pd.headers.map(h => ignored.has(h.key) ? -1 : cid(h.key));
  const seenP = new Uint8Array(prev.present.length);
  for (const row of pd.data){
    const p = RT.personByKey.get(row.pk);
    if (p === undefined || p >= prev.present.length || !prev.present[p]){ out.joiners++; continue; }
    seenP[p] = 1;
    for (let j = 0; j < hc.length; j++){
      const c = hc[j]; if (c < 0) continue; const a = prev.cols[c]; if (!a) continue;
      const code = RT.dictMaps[c].get(row.vals[j]);
      if (code === undefined || code !== a[p]){ out.changed++; break; }
    }
  }
  for (let p = 0; p < prev.present.length; p++) if (prev.present[p] && !seenP[p]) out.leavers++;
  out.prevRows = prev.rows; out.prevDate = prev.date;
  return out;
}
function commitPaste(pd, dateIso){
  const ex = DB.snapshots.findIndex(s => s.date === dateIso); if (ex >= 0) DB.snapshots.splice(ex, 1);
  const colIds = pd.headers.map(h => {
    let c = cid(h.key);
    if (c < 0){ c = DB.columns.length; DB.columns.push({ key:h.key, name:h.name, firstSeen:dateIso }); DB.dicts.push(['']); RT.dictMaps.push(new Map([['', 0]])); RT.colByKey.set(h.key, c); }
    else DB.columns[c].name = h.name;
    return c;
  });
  const pidx = pd.data.map(row => { let p = RT.personByKey.get(row.pk); if (p === undefined){ p = DB.persons.length; DB.persons.push(row.sap); RT.personByKey.set(row.pk, p); } return p; });
  const P = DB.persons.length; const present = new Uint8Array(P); const cols = {};
  colIds.forEach(c => { cols[c] = new Int32Array(P).fill(-1); });
  pd.data.forEach((row, r) => { const p = pidx[r]; present[p] = 1; row.vals.forEach((v, j) => { cols[colIds[j]][p] = intern(colIds[j], v); }); });
  DB.snapshots.push({ date:dateIso, rows:pd.data.length, addedAt:new Date().toISOString(), present, cols });
  markChanged(); rebuild();
}

function latestPresentList(){

  for (let p = 0; p < pr.length; p++) if (pr[p]) out.push(p);

function startOf(p){
  const c = cid(K.start); if (c < 0 || D.lastSeen[p] < 0) return null;
  const cache = D.cache.start || (D.cache.start = new Map());
  const code = kc(D.lastSeen[p], c, p); if (cache.has(code)) return cache.get(code);
  const d = code < 0 ? null : parseDate(DB.dicts[c][code]); cache.set(code, d); return d;
}
function childrenMap(){
  if (D.cache.children) return D.cache.children;
  const m = new Map(); const c = cid(K.leaderSap); if (c >= 0 && D.S){
    for (const p of latestPresentList()){ const v = valAt(p, K.leaderSap, D.S - 1); if (!v) continue; const k = personKey(v); let l = m.get(k); if (!l) m.set(k, l = []); l.push(p); }
  }

  return n;
}
function anniversaries(fromIso, toIso, onlyMilestones){
  const ms = new Set(DB.settings.milestones); const out = []; if (!D.S) return out;
  const fy = +fromIso.slice(0, 4), ty = +toIso.slice(0, 4);
  for (const p of latestPresentList()){
    const sd = startOf(p); if (!sd) continue;

// ---------- charts (inline SVG, no libraries) ----------
function lineChart(labels, values, { height = 190, color = 'var(--acc)', hi = null } = {}){
  const W = 680, H = height, pl = 52, pr = 18, pt = 14, pb = 26;
  const vs = values.filter(v => v != null); if (!vs.length) return '<p class="muted">No data yet</p>';
  let mn = Math.min(...vs), mx = Math.max(...vs); if (mn === mx){ mn -= 1; mx += 1; } const pad = (mx - mn) * 0.18; mn -= pad; mx += pad;
  const n = labels.length;
  const x = i => n === 1 ? (pl + W - pr) / 2 : pl + i * (W - pl - pr) / (n - 1);
  const y = v => pt + (1 - (v - mn) / (mx - mn)) * (H - pt - pb);
  let g = '<g class="grid">';
  for (let k = 0; k <= 3; k++){ const v = mn + (mx - mn) * k / 3, yy = y(v); g += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}"/><text x="${pl - 8}" y="${yy + 4}" text-anchor="end">${fmtN(Math.round(v))}</text>`; }
  g += '</g>';
  let band = '';
  if (hi && n > 1){ const x1 = x(hi[0]), x2 = x(hi[1]); band = `<rect x="${Math.min(x1, x2)}" y="${pt}" width="${Math.max(2, Math.abs(x2 - x1))}" height="${H - pt - pb}" fill="var(--acc-soft)" opacity=".7"/>`; }
  let d = ''; values.forEach((v, i) => { if (v == null) return; d += (d ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1); });
  const step = Math.max(1, Math.ceil(n / 10));
  let xl = ''; labels.forEach((l, i) => { if (i % step === 0 || i === n - 1) xl += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>`; });
  let dots = ''; values.forEach((v, i) => { if (v == null) return; dots += `<circle cx="${x(i)}" cy="${y(v)}" r="${n > 40 ? 2 : 3.5}" fill="var(--panel)" stroke="${color}" stroke-width="2"><title>${esc(labels[i])}: ${fmtN(v)}</title></circle>`; });
  const lastLbl = n <= 12 ? values.map((v, i) => v == null ? '' : `<text x="${x(i)}" y="${y(v) - 9}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${fmtN(v)}</text>`).join('') : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${band}${g}<path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>${dots}${lastLbl}${xl}</svg>`;
}
function barChart(labels, series, { height = 190 } = {}){
  const W = 680, H = height, pl = 40, pr = 12, pt = 16, pb = 26; const n = labels.length;
  if (!n) return '<p class="muted">No data yet</p>';
  const mx = Math.max(1, ...series.flatMap(s => s.values));
  const gw = (W - pl - pr) / n, bw = Math.min(26, (gw * 0.75) / series.length);
  const y = v => pt + (1 - v / mx) * (H - pt - pb);
  let g = '<g class="grid">'; for (let k = 0; k <= 3; k++){ const v = mx * k / 3, yy = y(v); g += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}"/><text x="${pl - 6}" y="${yy + 4}" text-anchor="end">${fmtN(Math.round(v))}</text>`; } g += '</g>';
  let bars = '', xl = ''; const step = Math.max(1, Math.ceil(n / 12));
  labels.forEach((l, i) => {
    const cx = pl + gw * i + gw / 2, start = cx - (bw * series.length) / 2;
    series.forEach((s, k) => { const v = s.values[i] || 0; const yy = y(v); bars += `<rect x="${start + k * bw + 1}" y="${yy}" width="${bw - 2}" height="${Math.max(0, H - pb - yy)}" rx="2" fill="${s.color}"><title>${esc(l)} — ${esc(s.name)}: ${fmtN(v)}</title></rect>`; if (n <= 12 && v) bars += `<text x="${start + k * bw + bw / 2}" y="${yy - 4}" text-anchor="middle">${fmtN(v)}</text>`; });
    if (i % step === 0 || i === n - 1) xl += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>`;
  });
  const legend = `<div class="legend">${series.map(s => `<span><i class="dot" style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
  return legend + `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}${bars}${xl}</svg>`;
}
function hbars(items, { limit = 15, hrefFn = null } = {}){

// ---------- Updates (home) ----------
function periodRange(key){
  const S = D.S, last = DB.snapshots[S - 1].date; let minS = S - 1;
  const since = days => { const cut = addDays(last, -days); let m = S - 1; for (let s = S - 1; s >= 1; s--) if (DB.snapshots[s].date > cut) m = s; return m; };
  if (key === '4w') minS = since(28); else if (key === '3m') minS = since(91); else if (key === '12m') minS = since(365); else if (key === 'all') minS = 1;
  return [Math.max(1, minS), S - 1];
}
function renderUpdates(main){
  const S = D.S, today = todayISO();
  const latest = DB.snapshots[S - 1], prevSnap = S > 1 ? DB.snapshots[S - 2] : null;
  // anniversaries
  let aFrom = today, aTo = today;
  if (UI.annRange === 'week'){ const dw = (new Date(isoUTC(today)).getUTCDay() + 6) % 7; aFrom = addDays(today, -dw); aTo = addDays(aFrom, 6); }
  if (UI.annRange === 'month'){ aFrom = today.slice(0, 8) + '01'; const y = +today.slice(0, 4), m = +today.slice(5, 7); aTo = isoOf(y, m, new Date(y, m, 0).getDate()); }
  if (UI.annRange === '30'){ aTo = addDays(today, 30); }
  const anns = anniversaries(aFrom, aTo, UI.annMilestones);
  // starters: start date from 14 days ago to 60 days ahead
  const starters = [];
  for (const p of latestPresentList()){ const sd = startOf(p); if (!sd) continue; const si = dIso(sd); if (si >= addDays(today, -14) && si <= addDays(today, 60)) starters.push({ p, si }); }
  starters.sort((a, b) => a.si < b.si ? -1 : 1);

  const [minS, maxS] = S > 1 ? periodRange(UI.updPeriod) : [1, 0];
  const inPeriod = D.events.filter(e => e.s >= minS && e.s <= maxS);
  const counts = {}; for (const e of inPeriod) for (const t of e.tags) counts[t] = (counts[t] || 0) + 1;
  let list = inPeriod;
  if (UI.updTags.size) list = list.filter(e => e.tags.some(t => UI.updTags.has(t)));
  const q = UI.updQ.trim().toLowerCase();
  if (q){ const terms = q.split(/\s+/); list = list.filter(e => { const t = eventSearchText(e); return terms.every(x => t.includes(x)); }); }

  const periods = [['latest', prevSnap ? `Latest paste (${fmtShort(prevSnap.date)} → ${fmtShort(latest.date)})` : 'Latest paste'], ['4w', 'Last 4 weeks'], ['3m', 'Last 3 months'], ['12m', 'Last 12 months'], ['all', 'All time']];
  const headTags = ['joiner', 'leaver', 'promotion', 'team', 'office', 'leader', 'leave', 'return'];
  const age = Math.round((isoUTC(today) - isoUTC(latest.date)) / 864e5);

  let evHtml = '';
  if (S < 2) evHtml = '<div class="empty">Add a second week to start seeing changes.</div>';
  else if (!list.length) evHtml = '<div class="empty">No updates match.</div>';
  else {
    let lastS = -1, n = 0;
    for (const e of list){
      if (n >= UI.updLimit) break;
      if (e.s !== lastS){ evHtml += `<div class="wkhead">Week to ${fmtISO(DB.snapshots[e.s].date)} <span style="font-weight:400;text-transform:none">· changes since ${fmtISO(DB.snapshots[e.s - 1].date)}</span></div>`; lastS = e.s; }
      evHtml += eventCard(e, { showDate:false }); n++;
    }
    if (list.length > UI.updLimit) evHtml += `<div style="padding:14px 0"><button id="u-more">Show more (${fmtN(list.length - UI.updLimit)} left)</button></div>`;
  }

  main.innerHTML = `<div class="page">
    <h1>Updates</h1>
    <p class="sub">Latest data: <b>${fmtISO(latest.date)}</b>${age > 8 ? ` <span class="pill t-warn">${age} days old — time to paste a new week?</span>` : ''}</p>
    <div class="grid g2">
      <div class="card">
        <div class="row" style="margin-bottom:8px"><h3 style="margin:0">Work anniversaries</h3><span class="spacer"></span>
          <div class="seg" id="ann-seg">${[['today', 'Today'], ['week', 'This week'], ['month', 'This month'], ['30', 'Next 30 days']].map(([k, l]) => `<button data-k="${k}" class="${UI.annRange === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
        <label class="muted" style="font-size:12px;display:flex;gap:6px;align-items:center;margin-bottom:6px"><input type="checkbox" id="ann-ms" ${UI.annMilestones ? 'checked' : ''}> Milestones only (${DB.settings.milestones.join(', ')} yrs)</label>
        <div style="max-height:340px;overflow:auto">${anns.length ? anns.slice(0, 300).map(a => `<div class="ann"><div class="yrs">${a.yrs}<small>year${a.yrs > 1 ? 's' : ''}</small></div><div>${plink(a.p)}<div class="meta muted" style="font-size:12px">${metaLine(a.p)}</div></div><div class="muted" style="font-size:12px;text-align:right">${a.date === today ? '<span class="pill t-pos">Today</span>' : `${dowOf(a.date)} ${fmtShort(a.date)}`}</div></div>`).join('') : '<div class="empty">No anniversaries in this period.</div>'}</div>
      </div>
      <div class="card">

        <div style="max-height:372px;overflow:auto">${starters.length ? starters.map(st => `<div class="ann"><div class="yrs" style="font-size:13px">${st.si > today ? 'Starts' : st.si === today ? '<span class="pill t-pos">Today</span>' : 'Started'}</div><div>${plink(st.p)}<div class="meta muted" style="font-size:12px">${metaLine(st.p)}</div></div><div class="muted" style="font-size:12px;text-align:right">${dowOf(st.si)} ${fmtISO(st.si)}</div></div>`).join('') : '<div class="empty">No recent or upcoming starters.</div>'}</div>
      </div>
    </div>
    <h2>What changed</h2>
    <div class="row" style="margin-bottom:12px">
      <select id="u-period">${periods.map(([k, l]) => `<option value="${k}" ${UI.updPeriod === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <input type="search" id="u-q" placeholder="Filter by name, office, team, grade…" value="${esc(UI.updQ)}" style="flex:1;min-width:220px">
    </div>
    <div class="stats">${headTags.map(t => `<button class="stat ${UI.updTags.has(t) ? 'on' : ''}" data-t="${t}"><div class="l"><i class="dot c-${TAG[t].cls}"></i>${TAG[t].label}</div><div class="n">${fmtN(counts[t] || 0)}</div></button>`).join('')}</div>
    <div class="chips" style="margin:8px 0 6px">${TAGS.filter(([t]) => !headTags.includes(t)).map(([t]) => `<span class="chip ${UI.updTags.has(t) ? 'on' : ''}" data-t="${t}">${TAG[t].label} <b>${fmtN(counts[t] || 0)}</b></span>`).join('')}
      ${UI.updTags.size ? '<span class="chip" id="u-clear">Clear filter ✕</span>' : ''}</div>
    <div class="card" style="padding-top:4px"><div class="evlist">${evHtml}</div></div>
  </div>`;
  $$('#ann-seg button').forEach(b => b.onclick = () => { UI.annRange = b.dataset.k; renderUpdates(main); });
  $('#ann-ms').onchange = e => { UI.annMilestones = e.target.checked; renderUpdates(main); };
  $('#u-period').onchange = e => { UI.updPeriod = e.target.value; UI.updLimit = 150; renderUpdates(main); };
  const qi = $('#u-q'); qi.oninput = debounce(() => { UI.updQ = qi.value; UI.updLimit = 150; const pos = qi.selectionStart; renderUpdates(main); const n = $('#u-q'); n.focus(); n.setSelectionRange(pos, pos); }, 250);
  $$('[data-t]', main).forEach(b => b.onclick = () => { const t = b.dataset.t; UI.updTags.has(t) ? UI.updTags.delete(t) : UI.updTags.add(t); UI.updLimit = 150; renderUpdates(main); });
  const cl = $('#u-clear'); if (cl) cl.onclick = () => { UI.updTags.clear(); renderUpdates(main); };

}

// ---------- People table ----------
const ROW_H = matchMedia('(pointer:coarse)').matches ? 40 : 34;
function peopleRows(cols){
  const sig = cols.join('|');
  if (D.cache.people && D.cache.people.sig === sig) return D.cache.people.rows;
  const rows = [];
  for (let p = 0; p < D.P; p++){
    const ls = D.lastSeen[p]; if (ls < 0) continue;
    const vals = cols.map(k => valAt(p, k, ls));
    rows.push({ p, left: ls !== D.S - 1, vals, lc: vals.map(v => v.toLowerCase()) });
  }
  D.cache.people = { sig, rows }; return rows;
}
function renderPeople(main){
  const st = UI.people;
  const cols = DB.settings.peopleCols.filter(k => cid(k) >= 0);
  if (!cols.length) cols.push(K.sap);
  const all = peopleRows(cols);

  main.innerHTML = `<div class="page" style="max-width:none">

      <details class="colpick"><summary class="btnlike">Columns ▾</summary><div class="menu">${DB.columns.map(c => `<label><input type="checkbox" data-k="${esc(c.key)}" ${cols.includes(c.key) ? 'checked' : ''}> ${esc(c.name)}</label>`).join('')}</div></details>
      <button id="p-clear">Clear filters</button>
      <button id="p-copy" title="Copy the filtered rows — paste straight into Excel">Copy table</button>
    </div>
    <p class="muted" style="margin:-4px 0 10px;font-size:12px">Type in any box under a column to filter (contains). Start with <span class="kbd">=</span> for an exact match, e.g. <span class="kbd">=London</span>. Click a heading to sort.</p>
    <div class="tbl-wrap">
      <div class="vt-head" style="grid-template-columns:${template}">
        ${cols.map(k => `<div class="hc" data-k="${esc(k)}">${esc(colName(k))}${st.sort.key === k ? (st.sort.dir > 0 ? ' ▲' : ' ▼') : ''}</div>`).join('')}
        ${cols.map(k => `<div class="fc"><input type="text" data-k="${esc(k)}" value="${esc(st.filters[k] || '')}" placeholder="Filter…"></div>`).join('')}
      </div>
      <div class="vt-body" id="vt" style="height:calc(100vh - 250px)"><div id="vt-spacer"></div></div>
    </div></div>`;
  let view = [];
  const isDateCol = k => k.includes('date');
  const sortKey = (r, i) => { const v = r.lc[i]; if (isDateCol(cols[i])){ const d = parseDate(v); return d ? dIso(d) : ''; } return v; };
  function apply(){
    const fs = cols.map((k, i) => [i, (st.filters[k] || '').trim().toLowerCase()]).filter(f => f[1]);
    view = all.filter(r => {
      if (r.left && !st.includeLeft) return false;
      for (const [i, f] of fs){ if (f[0] === '='){ if (r.lc[i] !== f.slice(1).trim()) return false; } else if (!r.lc[i].includes(f)) return false; }
      return true;
    });
    const si = cols.indexOf(st.sort.key);
    if (si >= 0){
      const numeric = view.length && view.slice(0, 50).every(r => r.vals[si] === '' || /^-?\d+(\.\d+)?$/.test(r.vals[si]));
      const keyed = view.map(r => ({ r, k: numeric ? (parseFloat(r.vals[si]) || 0) : sortKey(r, si) }));
      keyed.sort((a, b) => (a.k < b.k ? -1 : a.k > b.k ? 1 : 0) * st.sort.dir);
      view = keyed.map(x => x.r);
    }
    $('#pc').textContent = `${fmtN(view.length)} shown`;
    $('#vt-spacer').style.height = view.length * ROW_H + 'px';
    draw();
  }
  const vt = $('#vt');
  function draw(){
    const top = vt.scrollTop, h = vt.clientHeight; const a = Math.max(0, Math.floor(top / ROW_H) - 5), b = Math.min(view.length, Math.ceil((top + h) / ROW_H) + 5);
    let html = '';
    for (let i = a; i < b; i++){ const r = view[i]; html += `<div class="vt-row ${r.left ? 'left' : ''}" style="top:${i * ROW_H}px;grid-template-columns:${template}" data-p="${r.p}">${r.vals.map(v => `<div title="${esc(v)}">${esc(v)}</div>`).join('')}</div>`; }
    $$('.vt-row', vt).forEach(x => x.remove());
    $('#vt-spacer').insertAdjacentHTML('afterend', html);

  vt.onscroll = () => requestAnimationFrame(draw);
  vt.onclick = e => { const r = e.target.closest('.vt-row'); if (r) location.hash = personHref(+r.dataset.p); };
  const refilter = debounce(apply, 150);
  $$('.fc input', main).forEach(inp => inp.oninput = () => { st.filters[inp.dataset.k] = inp.value; vt.scrollTop = 0; refilter(); });
  $$('.hc', main).forEach(h => h.onclick = () => { const k = h.dataset.k; st.sort = { key:k, dir: st.sort.key === k ? -st.sort.dir : 1 }; renderPeople(main); });
  $('#p-left').onchange = e => { st.includeLeft = e.target.checked; apply(); };
  $('#p-clear').onclick = () => { st.filters = {}; renderPeople(main); };
  $$('.colpick input', main).forEach(cb => cb.onchange = async () => {
    const k = cb.dataset.k; const list = DB.settings.peopleCols.filter(x => x !== k); if (cb.checked) list.push(k);
    const order = DB.columns.map(c => c.key); list.sort((a, b) => order.indexOf(a) - order.indexOf(b));

  });
  $('#p-copy').onclick = async () => {
    const tsv = [cols.map(colName).join('\t')].concat(view.map(r => r.vals.join('\t'))).join('\n');
    toast(await copyText(tsv) ? `Copied ${fmtN(view.length)} rows — paste into Excel` : 'Copy failed');
  };
  apply();
}

// ---------- Group (office / team / grade… ) ----------
function groupCodeAt(c, s, p){ return kc(s, c, p); }
function renderGroup(main, key, value){
  const c = cid(key); if (c < 0){ main.innerHTML = '<div class="page"><h1>Unknown column</h1></div>'; return; }
  const vcode = RT.dictMaps[c].get(value);
  const S = D.S;
  const labels = DB.snapshots.map(s => fmtShort(s.date));
  const counts = []; const members = [];
  for (let s = 0; s < S; s++){
    const sn = DB.snapshots[s];
    if (!sn.cols[c]){ counts.push(null); continue; }
    let n = 0; const pr = sn.present;
    for (let p = 0; p < pr.length; p++) if (pr[p] && groupCodeAt(c, s, p) === vcode){ n++; if (s === S - 1) members.push(p); }
    counts.push(n);
  }
  const joiners = new Array(S).fill(0), leavers = new Array(S).fill(0), movIn = new Array(S).fill(0), movOut = new Array(S).fill(0);
  const gEvents = [];
  for (const e of D.events){
    let inG = false;
    if (e.kind === 'leaver'){ if (kc(e.s - 1, c, e.p) === vcode){ leavers[e.s]++; inG = true; } }
    else {
      if ((e.kind === 'joiner' || e.kind === 'rejoiner') && kc(e.s, c, e.p) === vcode){ joiners[e.s]++; inG = true; }
      const d = e.diffs.find(x => x[0] === c);
      if (d){ if (d[2] === vcode){ movIn[e.s]++; inG = true; } if (d[1] === vcode){ movOut[e.s]++; inG = true; } }
      if (!inG && kc(e.s, c, e.p) === vcode) inG = true;
    }
    if (inG) gEvents.push(e);
  }
  const bkKeys = DB.columns.map(x => x.key).filter(k => k !== key && !NOT_GROUPABLE.has(k));
  if (!bkKeys.includes(UI.group.breakdown)) UI.group.breakdown = bkKeys.includes(K.grade) ? K.grade : bkKeys[0];
  const bc = cid(UI.group.breakdown); const bmap = new Map();
  for (const p of members){ const v = kc(S - 1, bc, p); const l = v < 0 ? '' : DB.dicts[bc][v]; bmap.set(l, (bmap.get(l) || 0) + 1); }
  const bItems = Array.from(bmap, ([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value);
  const cur = counts[S - 1] || 0, prev = S > 1 ? counts[S - 2] : null, first = counts.find(x => x != null);
  members.sort((a, b) => personName(a).localeCompare(personName(b)));
  main.innerHTML = `<div class="page">
    <p class="muted" style="margin:0 0 2px">${esc(colName(key))}</p><h1>${esc(value || '(blank)')}</h1>
    <p class="sub">${fmtN(cur)} people on the latest list (${fmtISO(DB.snapshots[S - 1].date)})</p>
    <div class="stats">
      <div class="stat"><div class="l">Headcount now</div><div class="n">${fmtN(cur)}</div></div>
      <div class="stat"><div class="l">vs previous paste</div><div class="n" style="font-size:19px">${prev != null ? deltaHtml(cur - prev, prev) : '—'}</div></div>
      <div class="stat"><div class="l">vs first week (${fmtShort(DB.snapshots[0].date)})</div><div class="n" style="font-size:19px">${first != null ? deltaHtml(cur - first, first) : '—'}</div></div>
      <div class="stat"><div class="l"><i class="dot c-pos"></i>Joined / moved in</div><div class="n">${fmtN(joiners.reduce((a, b) => a + b, 0) + movIn.reduce((a, b) => a + b, 0))}</div></div>
      <div class="stat"><div class="l"><i class="dot c-neg"></i>Left / moved out</div><div class="n">${fmtN(leavers.reduce((a, b) => a + b, 0) + movOut.reduce((a, b) => a + b, 0))}</div></div>
    </div>
    <div class="grid g2" style="margin-top:14px">
      <div class="card"><h3>Headcount over time</h3>${lineChart(labels, counts)}</div>
      <div class="card"><h3>In and out per week</h3>${barChart(labels.slice(1), [
        { name:'Joiners', values:joiners.slice(1), color:'var(--pos)' }, { name:'Moved in', values:movIn.slice(1), color:'var(--teal)' },
        { name:'Moved out', values:movOut.slice(1), color:'var(--warn)' }, { name:'Leavers', values:leavers.slice(1), color:'var(--neg)' }])}</div>
    </div>
    <div class="grid g2" style="margin-top:14px;align-items:start">
      <div class="card"><div class="row" style="margin-bottom:8px"><h3 style="margin:0">Breakdown by</h3><select id="g-bk">${bkKeys.map(k => `<option value="${esc(k)}" ${k === UI.group.breakdown ? 'selected' : ''}>${esc(colName(k))}</option>`).join('')}</select></div>
        ${hbars(bItems, { limit:20, hrefFn: l => `#/group/${enc(UI.group.breakdown)}/${enc(l)}` })}</div>
      <div class="card"><div class="row" style="margin-bottom:8px"><h3 style="margin:0">People (${fmtN(members.length)})</h3><span class="spacer"></span><button class="sm" id="g-tbl">Open in People table</button></div>
        <div style="max-height:420px;overflow:auto">${members.slice(0, 400).map(p => `<div style="padding:4px 0;border-bottom:1px solid var(--line2)">${plink(p)} <span class="muted" style="font-size:12px">· ${esc(valAt(p, K.grade))} · ${esc(valAt(p, K.job))}</span></div>`).join('')}${members.length > 400 ? `<p class="muted">+ ${fmtN(members.length - 400)} more — open in the People table to see everyone.</p>` : ''}</div></div>
    </div>
    <h2>Updates for this ${esc(colName(key).toLowerCase())}</h2>
    <div class="card" style="padding-top:4px"><div class="evlist">${gEvents.length ? gEvents.slice(0, 200).map(e => eventCard(e)).join('') : '<div class="empty">No changes recorded.</div>'}</div>${gEvents.length > 200 ? `<p class="muted">Showing the latest 200 of ${fmtN(gEvents.length)}.</p>` : ''}</div>
  </div>`;
  $('#g-bk').onchange = e => { UI.group.breakdown = e.target.value; renderGroup(main, key, value); };
  $('#g-tbl').onclick = async () => {
    UI.people.filters = { [key]: '=' + value }; UI.people.includeLeft = false;
    if (!DB.settings.peopleCols.includes(key)){ DB.settings.peopleCols.push(key); await persist(); }
    location.hash = '#/people';
  };
}

// ---------- Trends (MoM etc.) ----------
function closestSnapBefore(iso){ let best = 0; for (let s = 0; s < D.S; s++) if (DB.snapshots[s].date <= iso) best = s; return best; }
function renderTrends(main){
  const S = D.S, T = UI.trends;
  if (T.to == null || T.to >= S) T.to = S - 1;
  if (T.from == null || T.from >= S) T.from = closestSnapBefore(addDays(DB.snapshots[S - 1].date, -28));
  if (T.from > T.to) [T.from, T.to] = [T.to, T.from];
  const dims = DB.columns.map(c => c.key).filter(k => !NOT_GROUPABLE.has(k));
  if (!dims.includes(T.dim)) T.dim = dims[0];
  const fc = T.fcol ? cid(T.fcol) : -1; const fv = fc >= 0 ? RT.dictMaps[fc].get(T.fval) : undefined;
  const pass = (s, p) => fc < 0 || T.fval === '' ? true : kc(s, fc, p) === fv;
  // overall series
  const labels = DB.snapshots.map(s => fmtShort(s.date));
  const head = DB.snapshots.map((sn, s) => { let n = 0; const pr = sn.present; for (let p = 0; p < pr.length; p++) if (pr[p] && pass(s, p)) n++; return n; });
  const jw = new Array(S).fill(0), lw = new Array(S).fill(0), pw = new Array(S).fill(0);
  for (const e of D.events){
    const s = e.kind === 'leaver' ? e.s - 1 : e.s; if (!pass(s, e.p)) continue;
    if (e.kind === 'joiner' || e.kind === 'rejoiner') jw[e.s]++; else if (e.kind === 'leaver') lw[e.s]++;
    if (e.tags.includes('promotion')) pw[e.s]++;
  }
  // breakdown A -> B
  const A = T.from, B = T.to, c = cid(T.dim);
  const rows = new Map(); const R = l => { let r = rows.get(l); if (!r) rows.set(l, r = { label:l, from:0, to:0, join:0, leave:0, inn:0, out:0 }); return r; };
  const lab = (s, p) => { const v = kc(s, c, p); return v < 0 ? '' : DB.dicts[c][v]; };
  let totA = 0, totB = 0, tj = 0, tl = 0, moves = 0;
  for (let p = 0; p < D.P; p++){
    const inA = isPresent(A, p) && pass(A, p), inB = isPresent(B, p) && pass(B, p);
    if (!inA && !inB) continue;
    const la = inA ? lab(A, p) : null, lb = inB ? lab(B, p) : null;
    if (inA){ R(la).from++; totA++; } if (inB){ R(lb).to++; totB++; }
    if (inA && !inB){ R(la).leave++; tl++; }
    if (!inA && inB){ R(lb).join++; tj++; }
    if (inA && inB && la !== lb){ R(la).out++; R(lb).inn++; moves++; }
  }
  let promos = 0; for (let s = A + 1; s <= B; s++) promos += pw[s];
  let list = Array.from(rows.values()); const sk = T.sort.k;
  list.sort((a, b) => { const va = sk === 'label' ? a.label.toLowerCase() : sk === 'delta' ? a.to - a.from : sk === 'pct' ? (a.from ? (a.to - a.from) / a.from : 9e9) : a[sk]; const vb = sk === 'label' ? b.label.toLowerCase() : sk === 'delta' ? b.to - b.from : sk === 'pct' ? (b.from ? (b.to - b.from) / b.from : 9e9) : b[sk]; return (va < vb ? -1 : va > vb ? 1 : 0) * T.sort.dir; });
  const maxAbs = Math.max(1, ...list.map(r => Math.abs(r.to - r.from)));
  const shown = T.showAll ? list : list.slice(0, 40);
  const opt = (sel) => DB.snapshots.map((sn, s) => `<option value="${s}" ${s === sel ? 'selected' : ''}>${fmtISO(sn.date)}</option>`).join('');
  const fvals = fc >= 0 ? DB.dicts[fc].filter(Boolean).slice().sort() : [];
  const th = (k, l, num) => `<th class="${num ? 'num' : ''}" data-s="${k}">${l}${T.sort.k === k ? (T.sort.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  const quick = [['wow', 'Week on week', 7], ['mom', 'Month on month', 28], ['qoq', '3 months', 91], ['yoy', 'Year on year', 365]];
  main.innerHTML = `<div class="page">
    <h1>Trends</h1><p class="sub">Compare any two weeks — headcount, joiners, leavers and moves, broken down however you like.</p>
    <div class="card"><div class="row">
      <span class="muted">Compare</span><select id="t-from">${opt(A)}</select><span class="muted">with</span><select id="t-to">${opt(B)}</select>
      <div class="seg">${quick.map(([k, l]) => `<button data-q="${k}">${l}</button>`).join('')}</div>
      <span class="spacer"></span>
      <span class="muted">Only include</span>
      <select id="t-fcol"><option value="">everyone</option>${dims.map(k => `<option value="${esc(k)}" ${k === T.fcol ? 'selected' : ''}>${esc(colName(k))}</option>`).join('')}</select>
      ${fc >= 0 ? `<span class="muted">=</span><select id="t-fval"><option value="">(choose)</option>${fvals.map(v => `<option ${v === T.fval ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>` : ''}
    </div>
    </div>
    <div class="stats" style="margin-top:14px">
      <div class="stat"><div class="l">Headcount ${fmtShort(DB.snapshots[A].date)} → ${fmtShort(DB.snapshots[B].date)}</div><div class="n">${fmtN(totB)}</div><div>${deltaHtml(totB - totA, totA)}</div></div>
      <div class="stat"><div class="l"><i class="dot c-pos"></i>Joiners</div><div class="n">${fmtN(tj)}</div></div>
      <div class="stat"><div class="l"><i class="dot c-neg"></i>Leavers</div><div class="n">${fmtN(tl)}</div></div>
      <div class="stat"><div class="l"><i class="dot c-acc"></i>Promotions</div><div class="n">${fmtN(promos)}</div></div>
      <div class="stat"><div class="l"><i class="dot c-vio"></i>Moved ${esc(colName(T.dim).toLowerCase())}</div><div class="n">${fmtN(moves)}</div></div>
    </div>
    <div class="grid g2" style="margin-top:14px">
      <div class="card"><h3>Headcount by week</h3>${lineChart(labels, head, { hi:[A, B] })}</div>
      <div class="card"><h3>Joiners, leavers and promotions by week</h3>${barChart(labels.slice(1), [{ name:'Joiners', values:jw.slice(1), color:'var(--pos)' }, { name:'Leavers', values:lw.slice(1), color:'var(--neg)' }, { name:'Promotions', values:pw.slice(1), color:'var(--acc)' }])}</div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="row" style="margin-bottom:10px"><h3 style="margin:0">Breakdown by</h3><select id="t-dim">${dims.map(k => `<option value="${esc(k)}" ${k === T.dim ? 'selected' : ''}>${esc(colName(k))}</option>`).join('')}</select>
        <span class="muted" style="font-size:12px">${fmtISO(DB.snapshots[A].date)} → ${fmtISO(DB.snapshots[B].date)} · ${fmtN(list.length)} values</span><span class="spacer"></span><button class="sm" id="t-copy">Copy table for Excel</button></div>
      <table class="t" id="t-table"><thead><tr>${th('label', esc(colName(T.dim)))}${th('from', fmtShort(DB.snapshots[A].date), 1)}${th('to', fmtShort(DB.snapshots[B].date), 1)}${th('delta', 'Change', 1)}<th></th>${th('pct', '%', 1)}${th('join', 'Joiners', 1)}${th('leave', 'Leavers', 1)}${th('inn', 'Moved in', 1)}${th('out', 'Moved out', 1)}</tr></thead><tbody>
      ${shown.map(r => { const d = r.to - r.from; const w = Math.abs(d) / maxAbs * 50; return `<tr><td><a href="#/group/${enc(T.dim)}/${enc(r.label)}">${esc(r.label || '(blank)')}</a></td><td class="num">${fmtN(r.from)}</td><td class="num">${fmtN(r.to)}</td><td class="num"><span class="delta ${d > 0 ? 'up' : d < 0 ? 'down' : 'zero'}">${d > 0 ? '+' : ''}${fmtN(d)}</span></td><td><span class="dbar"><i style="${d >= 0 ? `left:50%;width:${w}%;background:var(--pos)` : `right:50%;width:${w}%;background:var(--neg)`}"></i></span></td><td class="num muted">${r.from ? ((d / r.from) * 100).toFixed(1) + '%' : 'new'}</td><td class="num">${r.join || ''}</td><td class="num">${r.leave || ''}</td><td class="num">${r.inn || ''}</td><td class="num">${r.out || ''}</td></tr>`; }).join('')}
      </tbody></table>
      ${list.length > 40 ? `<div style="padding-top:10px"><button class="sm" id="t-all">${T.showAll ? 'Show top 40' : `Show all ${fmtN(list.length)}`}</button></div>` : ''}
    </div>
  </div>`;
  const re = () => renderTrends(main);
  $('#t-from').onchange = e => { T.from = +e.target.value; re(); };
  $('#t-to').onchange = e => { T.to = +e.target.value; re(); };
  $$('[data-q]', main).forEach(b => b.onclick = () => { const days = quick.find(q => q[0] === b.dataset.q)[2]; T.to = S - 1; T.from = closestSnapBefore(addDays(DB.snapshots[S - 1].date, -days)); if (T.from === T.to && S > 1) T.from = S - 2; if (DB.snapshots[T.from].date > addDays(DB.snapshots[S - 1].date, -days)) toast(`Not enough history yet — comparing with your earliest week (${fmtISO(DB.snapshots[T.from].date)})`); re(); });
  $('#t-dim').onchange = e => { T.dim = e.target.value; T.showAll = false; re(); };
  $('#t-fcol').onchange = e => { T.fcol = e.target.value; T.fval = ''; re(); };
  const fvs = $('#t-fval'); if (fvs) fvs.onchange = e => { T.fval = e.target.value; re(); };
  $$('#t-table th[data-s]').forEach(h => h.onclick = () => { const k = h.dataset.s; T.sort = { k, dir: T.sort.k === k ? -T.sort.dir : (k === 'label' ? 1 : -1) }; re(); });
  const all = $('#t-all'); if (all) all.onclick = () => { T.showAll = !T.showAll; re(); };
  $('#t-copy').onclick = async () => {
    const hdr = [colName(T.dim), fmtISO(DB.snapshots[A].date), fmtISO(DB.snapshots[B].date), 'Change', '% change', 'Joiners', 'Leavers', 'Moved in', 'Moved out'];
    const lines = [hdr.join('\t')].concat(list.map(r => [r.label, r.from, r.to, r.to - r.from, r.from ? ((r.to - r.from) / r.from * 100).toFixed(1) + '%' : '', r.join, r.leave, r.inn, r.out].join('\t')));
    toast(await copyText(lines.join('\n')) ? `Copied ${fmtN(list.length)} rows — paste into Excel` : 'Copy failed');
  };
}

// ---------- Import (paste a week) ----------

      : `In Excel: click the square in the top-left corner of the sheet to select everything (include the header row), press <span class="kbd">${KEY('C')}</span>, then click the box below and press <span class="kbd">${KEY('V')}</span>. Make sure no filters are on in Excel.`}</p>

  </div>`;

  });

  function showImpResult(){

        <div class="stat"><div class="l"><i class="dot c-neg"></i>No longer listed</div><div class="n">${fmtN(cmp.leavers)}</div></div>

      </div>` : `<p class="muted">This is the earliest week, so there’s nothing to compare it with — it becomes the starting point.</p>`}
      <div class="row"><button class="pri" id="imp-go">${cmp.existing >= 0 ? 'Replace week' : 'Add to Data'}</button><button id="imp-cancel">Cancel</button></div>
    </div>`;
    $('#imp-cancel').onclick = () => { pendingPaste = null; box.innerHTML = ''; };
    $('#imp-go').onclick = async () => {
      await busy('Adding and working out changes…');
      try { commitPaste(pd, date); await persist(); pendingPaste = null; }
      catch (e) { console.error(e); done(); showImpError('Something went wrong: ' + e.message); return; }
      done(); renderChrome(); renderImport(main);
      const s = DB.snapshots.findIndex(x => x.date === date); const n = D.events.filter(e => e.s === s).length;
      $('#imp-result').innerHTML = `<div class="notice good" style="margin-top:12px">Added ${fmtISO(date)} — ${fmtN(n)} update${n === 1 ? '' : 's'} found. <a href="#/updates">See updates →</a></div>
        ${syncAllowed()
          ? '<div class="notice">Syncing to GitHub automatically — nothing else to do. Your other devices get it next time they unlock.</div>'
          : `<div class="notice warn">Next: click <b>Save data file</b> (bottom left) and put ${STORE_FILE} in your Data folder, replacing the old one.</div>`}`;
    };
  }
}

// ---------- lock screen & start ----------
const GATE = { active:false, onFile:null };
let SKIP_UNLOAD = false;
const LOCK_SVG = '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
function showGate(html){ const g = $('#gate'); g.innerHTML = `<div class="gatewrap">${html}</div>`; g.hidden = false; GATE.active = true; document.body.classList.add('locked'); }
function hideGate(){ $('#gate').hidden = true; $('#gate').innerHTML = ''; GATE.active = false; GATE.onFile = null; document.body.classList.remove('locked'); }
function pickFileFromGate(e){ e.preventDefault(); const fi = $('#filein'); fi.value = ''; fi.click(); }
function attemptsText(){ const left = MAX_TRIES - getFails(); return `${left} attempt${left === 1 ? '' : 's'} left on this device before its stored copy is erased.`; }

// cands: encrypted copies (browser and/or data file), newest first
function gateUnlock(cands, note){
  const top = cands[0], kr = top.meta.enc && top.meta.enc.keyring, pk = needsPasskey(kr);
  const pkHere = pk && canPasskey();
  showGate(`<form class="card gatecard" id="g-form">
    <div class="gateicon">${LOCK_SVG}</div>
    <h1>Data is locked</h1>
    <p class="muted">${note || (pk ? (pkHere ? 'Enter your password, then confirm with your passkey (Face ID, Touch ID or Windows Hello).' : 'This data is protected with a passkey, which only works on the website version of Data (www.yusufmalik.co.uk/data.html). Here you can unlock it with your password and recovery key.') : 'Enter your password to unlock your data on this device.')}</p>
    <input type="password" id="g-pw" autocomplete="current-password" placeholder="Password" aria-label="Password">
    <input type="text" id="g-rec" placeholder="Recovery key (XXXX-XXXX-…)" aria-label="Recovery key" autocomplete="off" autocapitalize="characters" spellcheck="false" ${pk && !pkHere ? '' : 'hidden'}>
    <button class="pri" type="submit" id="g-go">${pkHere ? 'Unlock with passkey' : 'Unlock'}</button>
    <p class="small muted" id="g-msg">${attemptsText()}</p>
    ${pkHere ? '<p class="small"><a href="#" id="g-userec">Lost your passkey? Use your recovery key</a></p>' : ''}
    <p class="small"><a href="#" id="g-file">Open a data file instead…</a></p>
  </form>`);
  setTimeout(() => $('#g-pw') && $('#g-pw').focus(), 50);
  let useRec = pk && !pkHere;
  $('#g-file').onclick = pickFileFromGate;
  if ($('#g-userec')) $('#g-userec').onclick = e => { e.preventDefault(); useRec = !useRec; $('#g-rec').hidden = !useRec; $('#g-go').textContent = useRec ? 'Unlock with recovery key' : 'Unlock with passkey'; e.target.textContent = useRec ? 'Use my passkey instead' : 'Lost your passkey? Use your recovery key'; if (useRec) $('#g-rec').focus(); };
  GATE.onFile = (parsed, name) => parsed.meta.enc
    ? gateUnlock([{ from:'file', meta:parsed.meta, data:parsed.data, time:parsed.meta.savedAt || '' }], `Enter the password for <b>${esc(name)}</b>.`)
    : gateCreate({ from:'file', meta:parsed.meta, data:parsed.data });
  const say = html => { $('#g-msg').innerHTML = html; };
  $('#g-form').onsubmit = async e => {
    e.preventDefault(); const pw = $('#g-pw').value; if (!pw) { $('#g-pw').focus(); return; }
    let creds = { pw };
    if (pk){
      if (useRec){ const rec = $('#g-rec').value; if (normRec(rec).length < 24){ say('<b style="color:var(--neg)">Enter the whole recovery key.</b>'); $('#g-rec').focus(); return; } creds.rec = rec; }
      else { try { Object.assign(creds, await PK.get(kr)); } catch (err){ say(`<b style="color:var(--neg)">${esc(passkeyErrorText(err))}</b> ${attemptsText()}`); return; } }
    }
    await busy('Unlocking…');
    let ok = null, other = null;
    // with a passkey or recovery key, only the newest copy is tried; with a password alone, any copy it opens
    for (const c of (pk ? [top] : cands)){
      try { ok = { c, loaded: await openStore(c.meta, c.data, creds) }; break; }
      catch (err){ if (err.name === 'NeedsPasskeyError') continue; if (!isWrongPassword(err)){ other = err; break; } }
    }
    if (other){ done(); say(`<b style="color:var(--neg)">Couldn’t open:</b> ${esc(other.message)}`); return; }
    if (!ok){
      done(); const left = await failedAttempt();
      if (!left){
        const file = cands.find(c => c.from === 'file');
        const msg = '<b style="color:var(--neg)">Too many failed attempts.</b> The copy stored on this device has been erased. Your data file is still encrypted.';
        return file ? gateUnlock([file], msg) : gateWelcome(msg);
      }
      say(`<b style="color:var(--neg)">Unlock failed.</b> ${attemptsText()}`);   // never says which part was wrong
      $('#g-pw').value = ''; $('#g-pw').focus(); return;
    }
    await setFails(0);
    const { c, loaded } = ok;
    const note2 = await adoptLoaded(loaded, c.meta.savedAt, c.from === 'file' ? c.meta.savedAt : c.meta.changedAt);
    STORE.used = c.from;
    const file = cands.find(x => x.from === 'file'); if (c.from === 'browser' && file && file.time < c.time) STORE.older = true;
    await removePlainLeftovers();
    done(); enterApp([note2, c !== cands[0] ? 'Opened the copy that matches this password — another copy uses a different password.' : '', creds.rec ? 'Unlocked with your recovery key. Add a new passkey in Data file & settings.' : '']);
  };
}

// a device with no data yet: lead with getting existing data, not with making a new password
function gateWelcome(note){
  showGate(`<div class="card gatecard">
    <div class="gateicon">${LOCK_SVG}</div>
    <h1>Welcome to Data</h1>
    <p class="muted">There’s no data on this device yet.</p>
    ${note ? `<p class="small">${note}</p>` : ''}
    <button class="pri" id="w-sync">Get my data from GitHub sync</button>
    <button id="w-file">Open a data file…</button>
    <p class="small muted" style="margin-top:6px">First time using Data? <a href="#" id="w-new">Start fresh with a new password</a></p>
  </div>`);
  $('#w-sync').onclick = () => gateSync();
  $('#w-file').onclick = pickFileFromGate;
  $('#w-new').onclick = e => { e.preventDefault(); gateCreate(null); };
  GATE.onFile = (parsed, name) => parsed.meta.enc
    ? gateUnlock([{ from:'file', meta:parsed.meta, data:parsed.data, time:parsed.meta.savedAt || '' }], `Enter the password for <b>${esc(name)}</b>.`)
    : gateCreate({ from:'file', meta:parsed.meta, data:parsed.data });
}

// first run (or after unencrypted data from an older version): choose a password
function gateCreate(plain, note){
  showGate(`<form class="card gatecard" id="g-form">
    <div class="gateicon">${LOCK_SVG}</div>
    <h1>${plain ? 'Encrypt your data' : 'Set a password'}</h1>
    <p class="muted">${plain ? 'Data now encrypts everything it stores. Choose a password to encrypt the data you already have.' : 'Everything you paste into Data is encrypted with this password — on this device and in your data file.'}</p>
    ${note ? `<p class="small">${note}</p>` : ''}
    <input type="password" id="g-pw" autocomplete="new-password" placeholder="Password (at least 10 characters)" aria-label="New password">
    <input type="password" id="g-pw2" autocomplete="new-password" placeholder="Type it again" aria-label="Repeat password">
    <div class="notice warn small" style="text-align:left">There is no “forgot password”. If it’s lost, nobody can open the data. Keep it somewhere safe, such as a password manager.</div>
    <button class="pri" type="submit">${plain ? 'Encrypt my data' : 'Set password'}</button>
    <p class="small" id="g-msg"></p>
    ${plain ? '' : '<p class="small"><a href="#" id="g-back">Back</a></p>'}
  </form>`);
  if ($('#g-back')) $('#g-back').onclick = e => { e.preventDefault(); gateWelcome(); };
  setTimeout(() => $('#g-pw') && $('#g-pw').focus(), 50);
  $('#g-form').onsubmit = async e => {
    e.preventDefault();
    const pw = $('#g-pw').value, pw2 = $('#g-pw2').value, msg = $('#g-msg');
    if (pw.length < 10){ msg.innerHTML = '<b style="color:var(--neg)">Use at least 10 characters.</b> A short phrase is easiest to remember.'; return; }
    if (pw !== pw2){ msg.innerHTML = '<b style="color:var(--neg)">The two passwords don’t match.</b>'; return; }
    await busy('Encrypting…');
    try {
      await newKeyring(pw);
      let note2 = '';
      if (plain){
        const loaded = plain.db ? plain.db : await decodeBackup(plain.data.buffer.slice(plain.data.byteOffset, plain.data.byteOffset + plain.data.byteLength));
        note2 = await adoptLoaded(loaded, null, null);   // marked as changed, so you're prompted to save an encrypted data file
      } else { DB = emptyDB(); buildIndexes(); rebuild(); await persist(); }
      await removePlainLeftovers(); await setFails(0);
      done(); enterApp([note2, plain ? 'Your data is now encrypted. Click Save data file to replace the old unencrypted file.' : '']);
    } catch (err){ console.error(err); done(); msg.textContent = 'Something went wrong: ' + err.message; }
  };
}

// new device: fetch the encrypted data file from the private GitHub repository, then unlock it
function gateSync(note){
  showGate(`<form class="card gatecard" id="g-form">
    <div class="gateicon">${LOCK_SVG}</div>
    <h1>Get my data</h1>
    <p class="muted">Enter your sync repository and GitHub access key (you saved it in Apple Passwords when you set up sync).</p>
    ${note ? `<p class="small">${note}</p>` : ''}
    <input type="text" id="g-repo" placeholder="your-github-name/data-vault" autocapitalize="off" spellcheck="false" aria-label="Repository">
    <input type="password" id="g-tok" placeholder="GitHub access key" autocomplete="off" aria-label="GitHub access key">
    <button class="pri" type="submit">Get my data</button>
    <p class="small" id="g-msg"></p>
    <p class="small"><a href="#" id="g-back">Back</a></p>
  </form>`);
  setTimeout(() => $('#g-repo') && $('#g-repo').focus(), 50);
  $('#g-back').onclick = e => { e.preventDefault(); gateWelcome(); };
  $('#g-form').onsubmit = async e => {
    e.preventDefault();
    const cfg = { repo:cleanRepo($('#g-repo').value), token:$('#g-tok').value.trim(), path:STORE_FILE }, msg = $('#g-msg');
    if (!/^[\w.-]+\/[\w.-]+$/.test(cfg.repo) || !cfg.token){ msg.innerHTML = '<b style="color:var(--neg)">Enter both the repository and the access key.</b>'; return; }
    await busy('Fetching from GitHub…');
    try {
      const m = await GH.meta(cfg);
      if (!m){ done(); msg.innerHTML = '<b style="color:var(--neg)">There’s no data in that repository yet.</b> Turn on sync on the device that has your data first.'; return; }
      const parsed = parseStoreFile(utf8(await GH.getText(cfg)).buffer); done();
      if (!parsed.meta.enc){ msg.textContent = 'That file isn’t encrypted — not opened.'; return; }
      PENDING_SYNC = { ...cfg, sha:m.sha };
      gateUnlock([{ from:'file', meta:parsed.meta, data:parsed.data, time:parsed.meta.savedAt || '' }], 'Got your encrypted data from GitHub. Unlock it with your password and passkey.');
    } catch (err) { done(); msg.innerHTML = `<b style="color:var(--neg)">${esc(err.message)}</b>`; }
  };
}

function enterApp(notes){
  if (PENDING_SYNC && CRYPTO.dk){ DB.sync = { ...(DB.sync || {}), ...PENDING_SYNC }; PENDING_SYNC = null; persist(); }
  hideGate(); renderChrome(); route(); startAutoLock();
  if (syncCfg()) setTimeout(syncNow, 300);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !GATE.active) scheduleSync(200); });
  notes = (notes || []).filter(Boolean); if (notes.length) toast(notes.join(' '));
}
function lockNow(){ SKIP_UNLOAD = true; CRYPTO.dk = null; CRYPTO.dkRaw = null; CRYPTO.pwBits = null; persistChain.then(() => location.reload()); }
let lockTimer = null, lastActive = Date.now();
function startAutoLock(){
  const reset = () => { lastActive = Date.now(); clearTimeout(lockTimer); lockTimer = setTimeout(lockNow, AUTO_LOCK_MIN * 60000); };
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => addEventListener(ev, reset, { passive:true, capture:true }));
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastActive > AUTO_LOCK_MIN * 60000) lockNow(); });
  reset();
}

(async function start(){
  await busy('Opening…');
  if (!hasCrypto()){ done(); showGate(`<div class="card gatecard"><div class="gateicon">${LOCK_SVG}</div><h1>Data</h1><p class="muted">This page needs a secure connection to encrypt your data. Open it from an https:// address, or as a file on this computer.</p></div>`); return; }
  await IDB.open();
  let vault = null, legacy = null;
  if (IDB.ok){
    try { vault = (await IDB.get('vault')) || null; legacy = (await IDB.get('db')) || null; FAILS_IDB = (await IDB.get('fails')) || 0; }
    catch (e) { console.error(e); }
  }
  if (legacy && !legacy.snapshots) legacy = null;
  // Data-store.txt in the same folder as this page (only when opened as a file)
  const FS = window.DATA_STORE && window.DATA_STORE.b64 ? window.DATA_STORE : null;
  STORE.found = !!FS; if (FS){ STORE.savedAt = FS.savedAt; STORE.appVersion = FS.appVersion; STORE.encrypted = !!FS.enc; }
  done();
  // data from a newer version of Data: never open or overwrite it
  const tooNew = [vault, FS, legacy].find(x => x && (x.schema || 1) > SCHEMA);
  if (tooNew){ IDB.blocked = true; showGate(`<div class="card gatecard"><div class="gateicon">${LOCK_SVG}</div><h1>Newer data</h1><p class="muted">${esc(new NewerDataError(tooNew.schema, tooNew.appVersion).message)}</p></div>`); return; }
  // encrypted copies, newest first: whichever is newer (browser or data file) is opened
  const cands = [];
  if (vault && vault.enc) cands.push({ from:'browser', meta:vault, data:vault.ct, time:vault.changedAt || vault.savedAt || '' });
  if (FS && FS.enc){ try { cands.push({ from:'file', meta:FS, data:b64ToBytes(FS.b64), time:FS.savedAt || '' }); } catch (e) { STORE.error = e.message; } }
  cands.sort((a, b) => a.time < b.time ? 1 : a.time > b.time ? -1 : (a.from === 'file' ? -1 : 1));
  if (cands.length) return gateUnlock(cands);
  // unencrypted data from an older version (browser copy or data file): encrypt it with a new password
  const plain = legacy ? { from:'browser', db:legacy } : (FS ? { from:'file', meta:FS, data:b64ToBytes(FS.b64) } : null);
  plain ? gateCreate(plain) : gateWelcome();
})();
</script>
